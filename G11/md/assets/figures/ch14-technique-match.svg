<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 418" width="680" height="418"><rect width="680" height="418" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Match the Technique to the Question｜给问题配技术</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">Exam favourite: given a scenario, choose the method and justify it.</text><rect x="45" y="74" width="590" height="46" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="65" y="95" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Is this salt NaCl or KCl?</text><text x="65" y="113" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="700" text-anchor="start">→  flame test — K⁺ lilac vs Na⁺ yellow</text><rect x="45" y="126" width="590" height="46" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="65" y="147" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Is this HCl 0.10 M or 0.12 M?</text><text x="65" y="165" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">→  titration against a standard base</text><rect x="45" y="178" width="590" height="46" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="65" y="199" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">How much Ag is in this alloy?</text><text x="65" y="217" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="700" text-anchor="start">→  gravimetric: dissolve, precipitate AgCl, weigh</text><rect x="45" y="230" width="590" height="46" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="65" y="251" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Does this water contain Pb²⁺?</text><text x="65" y="269" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B46C1" font-weight="700" text-anchor="start">→  precipitation test with Cl⁻, confirm with SO₄²⁻</text><rect x="45" y="282" width="590" height="46" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="65" y="303" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Which painkiller dissolves faster?</text><text x="65" y="321" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="start">→  controlled dissolution + timed sampling</text><rect x="45" y="334" width="590" height="46" rx="8" fill="#FFFAF0" stroke="#C05621" stroke-width="1.3"/><text x="65" y="355" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Is this fertilizer N-rich?</text><text x="65" y="373" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C05621" font-weight="700" text-anchor="start">→  quantitative test for NH₄⁺ content (titration)</text><text x="340" y="396" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">Justify with BOTH the property used and the evidence read. 性质+证据双说理。</text></svg>