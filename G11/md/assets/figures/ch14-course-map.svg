<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 492" width="680" height="492"><rect width="680" height="492" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">The Whole Course in One Map｜全课程一张图</text><rect x="60" y="56" width="560" height="54" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="80" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">B1  Building blocks 构件</text><text x="80" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ch.5–7  atoms → periodic table → bonds &amp; IMF</text><rect x="60" y="120" width="560" height="54" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="80" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">B3  Measuring 量度</text><text x="80" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ch.1 + Ch.8  sig figs · dimensional analysis · the mole</text><rect x="60" y="184" width="560" height="54" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="80" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="start">B4  Conservation 守恒</text><text x="80" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ch.9–11  reactions → stoichiometry → energy</text><rect x="60" y="248" width="560" height="54" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="80" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">B5  Solutions 溶解</text><text x="80" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ch.12–14  solubility → concentration → analysis</text><rect x="60" y="312" width="560" height="54" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="80" y="334" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="start">B2  Applications 应用</text><text x="80" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ch.2–4  organic chemistry → health · society · environment</text><line x1="340" y1="378" x2="340" y2="396" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="400" width="400" height="48" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.3"/><text x="340" y="421" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">Atoms rearrange; matter &amp; energy are conserved;</text><text x="340" y="437" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">what dissolves depends on the nature of solute &amp; solvent.</text><text x="340" y="470" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">One storyline, five Big Ideas — nothing in the course is orphaned.</text></svg>