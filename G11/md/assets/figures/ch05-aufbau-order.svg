-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">电子按能量从低到高入住。</text><rect x="237" y="402" width="186" height="60" rx="6" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.0"/><text x="247" y="422" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">Pauli｜泡利不相容</text><text x="247" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">一个轨道最多 2 个电子，</text><text x="247" y="455" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">且两个电子自旋相反。</text><rect x="434" y="402" width="186" height="60" rx="6" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.0"/><text x="444" y="422" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">Hund｜洪特规则</text><text x="444" y="440" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">等能轨道先各占一个，</text><text x="444" y="455" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">再逐一配对。</text></svg>