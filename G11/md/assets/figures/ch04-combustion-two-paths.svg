<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 393" width="680" height="393"><rect width="680" height="393" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14.5" fill="#1F2933" font-weight="600" text-anchor="middle">Complete vs Incomplete Combustion｜完全燃烧与不完全燃烧</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">Same fuel, different oxygen supply — and very different products.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">同样的燃料，供氧不同，产物与危险程度完全不同。这是本章最重要的一条安全线。</text><rect x="40" y="89" width="291.0" height="196" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="58" y="115" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">COMPLETE｜完全燃烧</text><text x="58" y="137" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="600" text-anchor="start">Oxygen plentiful｜氧气充足</text><text x="58" y="163" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">fuel + O₂  →  CO₂ + H₂O</text><text x="58" y="189" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="700" text-anchor="start">Products｜产物：</text><text x="58" y="207" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CO₂  carbon dioxide｜二氧化碳</text><text x="58" y="223" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">H₂O  water｜水</text><text x="58" y="245" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="400" text-anchor="start">Flame｜火焰：blue, clean</text><text x="58" y="261" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">蓝色、洁净、几乎无烟</text><text x="58" y="277" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="600" text-anchor="start">Energy released is MAXIMUM｜放热最多</text><rect x="349.0" y="89" width="291.0" height="196" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="367.0" y="115" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="start">INCOMPLETE｜不完全燃烧</text><text x="367.0" y="137" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="600" text-anchor="start">Oxygen limited｜氧气不足</text><text x="367.0" y="163" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="start">fuel + O₂  →  CO  or  C  +  H₂O</text><text x="367.0" y="189" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="700" text-anchor="start">Products｜产物：</text><text x="367.0" y="207" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CO  carbon monoxide｜一氧化碳</text><text x="367.0" y="223" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">C  soot｜碳烟</text><text x="367.0" y="245" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="400" text-anchor="start">Flame｜火焰：yellow, sooty</text><text x="367.0" y="261" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">黄色、冒黑烟、有积碳</text><text x="367.0" y="277" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="600" text-anchor="start">Less energy AND toxic gas｜放热少且有毒气</text><rect x="40" y="301" width="600" height="76" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="325" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="600" text-anchor="start">⚠ Carbon monoxide: colourless, odourless, binds haemoglobin ~200× stronger than O₂.</text><text x="58" y="345" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CO 无色无味，与血红蛋白结合能力约为氧的 200 倍——这就是车库/热水器/炭火取暖</text><text x="58" y="363" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">事故的化学原因。通风不良 + 密闭空间 = 高危。</text></svg>