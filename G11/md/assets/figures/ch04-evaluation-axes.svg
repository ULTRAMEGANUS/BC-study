<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 413" width="680" height="413"><rect width="680" height="413" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Evaluating an Application｜应用的三维评价</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">Big Idea B2 says "evaluate" — so you must look at BOTH benefits and risks.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">B2 的关键动词是 evaluate（评价）——只讲好处或只讲坏处都不及格。必须两面都讲。</text><rect x="40.0" y="91" width="190.66666666666666" height="168" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="135.33333333333331" y="117" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="middle">HEALTH｜健康</text><text x="54.0" y="143" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">＋ Benefit｜收益</text><text x="54.0" y="161" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">medicine, food, clean water</text><text x="54.0" y="177" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">药物、食品、净水</text><text x="54.0" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="start">− Risk｜风险</text><text x="54.0" y="221" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">toxicity, air quality, exposure</text><text x="54.0" y="237" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">毒性、空气质量、暴露</text><rect x="244.66666666666666" y="91" width="190.66666666666666" height="168" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="340.0" y="117" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">SOCIETY｜社会</text><text x="258.66666666666663" y="143" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">＋ Benefit｜收益</text><text x="258.66666666666663" y="161" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">jobs, fuel, housing, transport</text><text x="258.66666666666663" y="177" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">就业、燃料、住房、交通</text><text x="258.66666666666663" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="start">− Risk｜风险</text><text x="258.66666666666663" y="221" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">cost, equity, dependence</text><text x="258.66666666666663" y="237" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">成本、公平、依赖</text><rect x="449.3333333333333" y="91" width="190.66666666666666" height="168" rx="10" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="544.6666666666666" y="117" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="middle">ENVIRONMENT｜环境</text><text x="463.3333333333333" y="143" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">＋ Benefit｜收益</text><text x="463.3333333333333" y="161" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">renewable materials, green synthesis</text><text x="463.3333333333333" y="177" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">可再生材料、绿色合成</text><text x="463.3333333333333" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="start">− Risk｜风险</text><text x="463.3333333333333" y="221" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">emissions, plastics, land use</text><text x="463.3333333333333" y="237" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">排放、塑料、土地利用</text><rect x="40" y="275" width="600" height="122" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.2"/><text x="58" y="299" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#6B46C1" font-weight="700" text-anchor="start">Trade-off table｜权衡表（评价题的答题骨架）</text><text x="58" y="321" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="700" text-anchor="start">Question｜问题</text><text x="320" y="321" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="700" text-anchor="start">What to write｜写什么</text><text x="58" y="341" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">1  What is it used for?｜它用来做什么？</text><text x="58" y="355" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">2  Who benefits, and how?｜谁受益、怎么受益？</text><text x="58" y="369" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">3  What is the harm, and to whom?｜害处是什么、害谁？</text><text x="58" y="383" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="400" text-anchor="start">4  Is there a safer substitute?｜有没有更安全的替代？</text><text x="320" y="341" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">state the use, then the mechanism</text><text x="320" y="355" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">be specific: name the group</text><text x="320" y="369" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">say whether it is short- or long-term</text><text x="320" y="383" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">end with a reasoned verdict</text></svg>