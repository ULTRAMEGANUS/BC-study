<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 434" width="680" height="434"><rect width="680" height="434" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Five Atomic Models｜原子模型的五次升级</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Each upgrade kept what the old model explained and repaired the one thing it could not.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">每一次升级都保留旧模型能解释的部分，只修补它解释不了的那一处。</text><rect x="40" y="88" width="600" height="52" rx="6" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.9"/><rect x="40" y="88" width="6" height="52" rx="8" fill="#2B6CB0" stroke="#9AA5B1" stroke-width="1.2"/><text x="58" y="109" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">1803 · Dalton — solid sphere｜道尔顿 · 实心球</text><text x="58" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">原子不可再分，同种元素原子完全相同。解释不了阴极射线与放射性。</text><rect x="40" y="152" width="600" height="52" rx="6" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.9"/><rect x="40" y="152" width="6" height="52" rx="8" fill="#2B6CB0" stroke="#9AA5B1" stroke-width="1.2"/><text x="58" y="173" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">1897 · Thomson — plum pudding｜汤姆孙 · 葡萄干布丁</text><text x="58" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">电子嵌在正电球内。阴极射线实验发现了第一个亚原子粒子。</text><rect x="40" y="216" width="600" height="52" rx="6" fill="#F0FFF4" stroke="#E1E7EC" stroke-width="0.9"/><rect x="40" y="216" width="6" height="52" rx="8" fill="#2F855A" stroke="#9AA5B1" stroke-width="1.2"/><text x="58" y="237" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">1911 · Rutherford — nuclear model｜卢瑟福 · 核式模型</text><text x="58" y="256" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">正电核极小、电子在核外。金箔 α 散射：多数穿透，少数大角度偏折。</text><rect x="40" y="280" width="600" height="52" rx="6" fill="#FFFBEB" stroke="#E1E7EC" stroke-width="0.9"/><rect x="40" y="280" width="6" height="52" rx="8" fill="#B7791F" stroke="#9AA5B1" stroke-width="1.2"/><text x="58" y="301" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="start">1913 · Bohr — fixed shells｜玻尔 · 分层轨道</text><text x="58" y="320" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">电子只能待在固定能级上，跃迁时发光。成功解释氢原子光谱线。</text><rect x="40" y="344" width="600" height="52" rx="6" fill="#F5F0FF" stroke="#E1E7EC" stroke-width="0.9"/><rect x="40" y="344" width="6" height="52" rx="8" fill="#6B46C1" stroke="#9AA5B1" stroke-width="1.2"/><text x="58" y="365" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">1926 · Quantum mechanical — electron cloud｜量子力学 · 电子云</text><text x="58" y="384" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">电子位置只能用概率描述，轨道就是概率密度。海森堡与薛定谔建立。</text><text x="40" y="412" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">Bohr 不是「错」的——它对氢光谱至今成立，是从「确定轨道」通向「概率云」的桥。</text></svg>