<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="680" height="272"><rect width="680" height="272" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Bonding Is a Continuum, Not a Switch｜键型是连续谱，不是开关</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Electronegativity difference, ΔEN, estimates where a bond sits on the slide.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">电负性差 ΔEN 估计化学键在滑轴上的位置——从共价滑到离子。</text><rect x="60.0" y="94" width="80.0" height="34" rx="0" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="100.0" y="109" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="middle">covalent</text><text x="100.0" y="123" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="600" text-anchor="middle">non-polar｜非极性共价</text><rect x="140.0" y="94" width="208.00000000000006" height="34" rx="0" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="244.00000000000003" y="109" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="middle">covalent</text><text x="244.00000000000003" y="123" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="600" text-anchor="middle">polar｜极性共价</text><rect x="348.00000000000006" y="94" width="271.99999999999994" height="34" rx="0" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="484.0" y="109" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="middle">ionic｜离子键</text><text x="484.0" y="123" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="600" text-anchor="middle"></text><line x1="60.0" y1="128" x2="60.0" y2="134" stroke="#52606D" stroke-width="1.2"/><text x="60.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="600" text-anchor="middle">0</text><line x1="140.0" y1="128" x2="140.0" y2="134" stroke="#52606D" stroke-width="1.2"/><text x="140.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="600" text-anchor="middle">0.5</text><line x1="348.00000000000006" y1="128" x2="348.00000000000006" y2="134" stroke="#52606D" stroke-width="1.2"/><text x="348.00000000000006" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="600" text-anchor="middle">1.8</text><line x1="620.0" y1="128" x2="620.0" y2="134" stroke="#52606D" stroke-width="1.2"/><text x="620.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="600" text-anchor="middle">3.5</text><circle cx="60.0" cy="178" r="4" fill="#6B46C1" stroke="#6B46C1" stroke-width="1"/><line x1="60.0" y1="173" x2="60.0" y2="164" stroke="#6B46C1" stroke-width="1"/><text x="60.0" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="600" text-anchor="middle">H–H  0.0</text><circle cx="124.0" cy="178" r="4" fill="#6B46C1" stroke="#6B46C1" stroke-width="1"/><line x1="124.0" y1="183" x2="124.0" y2="192" stroke="#6B46C1" stroke-width="1"/><text x="124.0" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="600" text-anchor="middle">C–H  0.4</text><circle cx="204.00000000000003" cy="178" r="4" fill="#6B46C1" stroke="#6B46C1" stroke-width="1"/><line x1="204.00000000000003" y1="173" x2="204.00000000000003" y2="164" stroke="#6B46C1" stroke-width="1"/><text x="204.00000000000003" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="600" text-anchor="middle">H–Cl / N–H  0.9</text><circle cx="284.0" cy="178" r="4" fill="#6B46C1" stroke="#6B46C1" stroke-width="1"/><line x1="284.0" y1="183" x2="284.0" y2="192" stroke="#6B46C1" stroke-width="1"/><text x="284.0" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="600" text-anchor="middle">O–H  1.4</text><circle cx="396.0" cy="178" r="4" fill="#6B46C1" stroke="#6B46C1" stroke-width="1"/><line x1="396.0" y1="173" x2="396.0" y2="164" stroke="#6B46C1" stroke-width="1"/><text x="396.0" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="600" text-anchor="middle">Na–Cl  2.1</text><circle cx="588.0" cy="178" r="4" fill="#6B46C1" stroke="#6B46C1" stroke-width="1"/><line x1="588.0" y1="183" x2="588.0" y2="192" stroke="#6B46C1" stroke-width="1"/><text x="588.0" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="600" text-anchor="middle">Cs–F  3.3</text><text x="40" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">The cut-offs are empirical — HF (ΔEN = 1.9) crosses the line yet is still a</text><text x="40" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">molecular, polar-covalent substance. Read the number as a hint, not a verdict.</text><text x="40" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="600" text-anchor="start">阈值是经验线：HF（ΔEN=1.9）虽越线，仍是极性共价分子——数值是提示，不是判决。</text></svg>