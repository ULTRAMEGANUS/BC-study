<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 286" width="680" height="286"><rect width="680" height="286" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">The Three Bridges｜摩尔三桥：粒子 ⇄ 摩尔 ⇄ 质量</text><rect x="40.0" y="54" width="168" height="76" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.4"/><text x="124.0" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#6B46C1" font-weight="700" text-anchor="middle">PARTICLES｜粒子数</text><text x="124.0" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="middle">N  (atoms, molecules, ions)</text><rect x="256.0" y="54" width="168" height="76" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/><text x="340.0" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="middle">MOLES｜物质的量</text><text x="340.0" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="middle">n  (mol)</text><rect x="472.0" y="54" width="168" height="76" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="556.0" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="middle">MASS｜质量</text><text x="556.0" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="middle">m  (g)</text><defs><marker id="ar1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2B6CB0"/></marker></defs><defs><marker id="ar1r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2B6CB0"/></marker></defs><line x1="212.0" y1="80.0" x2="252.0" y2="80.0" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#ar1)"/><line x1="252.0" y1="104.0" x2="212.0" y2="104.0" stroke="#2B6CB0" stroke-width="1.6" marker-end="url(#ar1r)"/><text x="232.0" y="66.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="600" text-anchor="middle">÷ 6.02×10²³</text><text x="232.0" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="600" text-anchor="middle">× 6.02×10²³</text><defs><marker id="ar2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2F855A"/></marker></defs><defs><marker id="ar2r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2F855A"/></marker></defs><line x1="428.0" y1="80.0" x2="468.0" y2="80.0" stroke="#2F855A" stroke-width="1.6" marker-end="url(#ar2)"/><line x1="468.0" y1="104.0" x2="428.0" y2="104.0" stroke="#2F855A" stroke-width="1.6" marker-end="url(#ar2r)"/><text x="448.0" y="66.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="600" text-anchor="middle">× M  (g/mol)</text><text x="448.0" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="600" text-anchor="middle">÷ M  (g/mol)</text><text x="40" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="600" text-anchor="start">Avogadro's number｜阿伏伽德罗常数：N_A = 6.02 × 10²³  particles / mol</text><text x="40" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="600" text-anchor="start">Molar mass｜摩尔质量：M = the average atomic mass from the periodic table, in g/mol</text><rect x="40" y="208" width="600" height="62" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="232" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="600" text-anchor="start">⚠ You can never jump straight from particles to mass.</text><text x="58" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">粒子数不能直接换算成质量——必须经过「摩尔」这一站，这是本章之后所有计算题的骨架。</text></svg>