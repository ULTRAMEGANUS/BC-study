<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452"><rect width="680" height="452" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Energy-Level Diagrams｜能量变化图</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">The peak is the activation energy; the gap between plateaus is ΔH.</text><line x1="60" y1="70" x2="60" y2="252" stroke="#52606D" stroke-width="1.4"/><line x1="60" y1="252" x2="310" y2="252" stroke="#52606D" stroke-width="1.4"/><text x="52" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="end">E</text><text x="306" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="end">reaction progress 反应进程</text><path d="M 60,126 L 130.0,126 L 185.0,82 L 215.0,182 L 310,182" fill="none" stroke="#C53030" stroke-width="2.2"/><line x1="60" y1="126" x2="110.0" y2="126" stroke="#9AA5B1" stroke-width="1.0" stroke-dasharray="3 3"/><text x="66" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="start">reactants 反应物</text><text x="304" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="end">products 生成物</text><line x1="260.0" y1="126" x2="260.0" y2="182" stroke="#2F855A" stroke-width="1.6"/><text x="266.0" y="158.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">ΔH &lt; 0</text><line x1="155.0" y1="78" x2="155.0" y2="126" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/><text x="149.0" y="102.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="700" text-anchor="end">E_a</text><text x="185.0" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="middle">Exothermic 放热 — heat OUT</text><line x1="370" y1="70" x2="370" y2="252" stroke="#52606D" stroke-width="1.4"/><line x1="370" y1="252" x2="620" y2="252" stroke="#52606D" stroke-width="1.4"/><text x="362" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="end">E</text><text x="616" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="end">reaction progress 反应进程</text><path d="M 370,182 L 440.0,182 L 495.0,82 L 525.0,126 L 620,126" fill="none" stroke="#2B6CB0" stroke-width="2.2"/><line x1="370" y1="182" x2="420.0" y2="182" stroke="#9AA5B1" stroke-width="1.0" stroke-dasharray="3 3"/><text x="376" y="176" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="start">reactants 反应物</text><text x="614" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="end">products 生成物</text><line x1="570.0" y1="126" x2="570.0" y2="182" stroke="#2B6CB0" stroke-width="1.6"/><text x="576.0" y="158.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">ΔH &gt; 0</text><line x1="465.0" y1="78" x2="465.0" y2="182" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="4 3"/><text x="459.0" y="130.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="700" text-anchor="end">E_a</text><text x="495.0" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Endothermic 吸热 — heat IN</text><rect x="55" y="288" width="570" height="56" rx="8" fill="#FFFFFF" stroke="#C53030" stroke-width="1.3"/><text x="75" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#C53030" font-weight="700" text-anchor="start">Exothermic 放热</text><text x="230" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">ΔH negative (e.g. −890 kJ)</text><text x="75" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">combustion, neutralization, freezing</text><rect x="55" y="356" width="570" height="56" rx="8" fill="#FFFFFF" stroke="#2B6CB0" stroke-width="1.3"/><text x="75" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">Endothermic 吸热</text><text x="230" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">ΔH positive (e.g. +66 kJ)</text><text x="75" y="398" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">melting, evaporation, photosynthesis</text><text x="340" y="428" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">kJ on the product side = exothermic ; on the reactant side = endothermic.</text></svg>