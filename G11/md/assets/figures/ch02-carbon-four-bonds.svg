<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 344" width="680" height="344"><rect width="680" height="344" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Carbon's Four Bonds｜碳的四个键</text><text x="40" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#52606D" font-weight="400" text-anchor="start">Carbon has 4 valence electrons, so it forms 4 covalent bonds —</text><text x="40" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#52606D" font-weight="400" text-anchor="start">and it can bond to other carbons, building long chains.</text><text x="40" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">碳有 4 个价电子，因此形成 4 个共价键——并且能与其它碳原子相连。这是有机化学化合物数量庞大的根本原因。</text><rect x="40.0" y="120" width="186.66666666666666" height="120" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="133.33333333333331" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="middle">CHAIN｜链</text><text x="133.33333333333331" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">C—C—C—C—C</text><text x="133.33333333333331" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">直链：碳首尾相连</text><rect x="246.66666666666666" y="120" width="186.66666666666666" height="120" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="340.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="middle">BRANCH｜支链</text><text x="340.0" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">C—C—C</text><text x="340.0" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">    |</text><text x="340.0" y="210" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">    C</text><text x="340.0" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">支链：从主链分岔</text><rect x="453.3333333333333" y="120" width="186.66666666666666" height="120" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="546.6666666666666" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#6B46C1" font-weight="700" text-anchor="middle">RING｜环</text><text x="546.6666666666666" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">C—C</text><text x="546.6666666666666" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">|   |</text><text x="546.6666666666666" y="210" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">C—C</text><text x="546.6666666666666" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">成环：首尾闭合</text><rect x="40" y="262" width="600" height="66" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="600" text-anchor="start">📏 Rule｜规则：every carbon shows exactly FOUR bonds in a structure.</text><text x="58" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">骨架式里每个顶点就是 1 个碳；氢不画出来，但要按 4 键补齐。这是检查结构图画错没画错的第一把尺子。</text></svg>