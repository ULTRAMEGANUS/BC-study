<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 542" width="680" height="542"><rect width="680" height="542" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Significant Figures — Decision Flow｜有效数字判定流程</text><rect x="40" y="46" width="600" height="62" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="58" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">Step 1</text><text x="118" y="70" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">Is the number a MEASURED value or an EXACT count?</text><text x="118" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">这个数是测量值，还是精确计数／定义值？</text><line x1="340.0" y1="108" x2="340.0" y2="118" stroke="#9AA5B1" stroke-width="1.4"/><rect x="40" y="118" width="600" height="62" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="58" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">Step 2</text><text x="118" y="142" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">Find each digit: all non-zero digits count.</text><text x="118" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">逐位判断：所有非零数字都算。</text><line x1="340.0" y1="180" x2="340.0" y2="190" stroke="#9AA5B1" stroke-width="1.4"/><rect x="40" y="190" width="600" height="62" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="58" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">Step 3</text><text x="118" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">Zeros BETWEEN non-zero digits always count.</text><text x="118" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">夹在非零数字之间的零，一律算。</text><line x1="340.0" y1="252" x2="340.0" y2="262" stroke="#9AA5B1" stroke-width="1.4"/><rect x="40" y="262" width="600" height="62" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="start">Step 4</text><text x="118" y="286" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">Leading zeros NEVER count (0.0025 → 2 s.f.).</text><text x="118" y="306" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">前导零不算（0.0025 是 2 位）。</text><line x1="340.0" y1="324" x2="340.0" y2="334" stroke="#9AA5B1" stroke-width="1.4"/><rect x="40" y="334" width="600" height="62" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="start">Step 5</text><text x="118" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">Trailing zeros count ONLY if a decimal point is present.</text><text x="118" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">末尾零只有在有小数点时才算（800 → 1 位；800. → 3 位）。</text><rect x="40" y="414" width="295.0" height="74" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="58" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">× and ÷ : least s.f.</text><text x="58" y="458" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">乘除 → 取有效位数最少者</text><rect x="345.0" y="414" width="295.0" height="74" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="363.0" y="438" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">+ and − : least decimal place</text><text x="363.0" y="458" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">加减 → 取小数位最少者</text><text x="40" y="508" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="600" text-anchor="start">⛔ Never round in the middle of a multi-step calculation.</text><text x="52" y="526" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">多步计算中途不要四舍五入，只在最后一步取整。</text></svg>