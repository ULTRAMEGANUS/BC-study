<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320"><rect width="680" height="320" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Dimensional Analysis｜量纲分析：单位连消</text><text x="40" y="52" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#52606D" font-weight="400" text-anchor="start">Given｜已知：0.752 kg of water  kg → mol   (M(H₂O) = 18.02 g/mol)</text><rect x="40.0" y="78" width="150" height="72" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="115.0" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">GIVEN｜已知</text><text x="115.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">0.752 kg</text><defs><marker id="dc0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9AA5B1"/></marker></defs><line x1="196.0" y1="114.0" x2="259.0" y2="114.0" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#dc0)"/><rect x="265.0" y="78" width="150" height="72" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="340.0" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="middle">× factor ①</text><text x="340.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">1000 g</text><text x="340.0" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">————</text><text x="340.0" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">1 kg</text><defs><marker id="dc1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9AA5B1"/></marker></defs><line x1="421.0" y1="114.0" x2="484.0" y2="114.0" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#dc1)"/><rect x="490.0" y="78" width="150" height="72" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="565.0" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="middle">× factor ②</text><text x="565.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">1 mol</text><text x="565.0" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">————</text><text x="565.0" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="middle">18.02 g</text><rect x="40" y="172" width="600" height="92" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="58" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">Chain｜连式（单位像分数一样约掉）</text><text x="58" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="start">0.752 kg × 1000 g/1 kg × 1 mol/18.02 g = 41.7 mol</text><text x="58" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">kg 约掉 → g 约掉 → 只剩 mol ✓　结果 41.7 mol（3 s.f.，与 0.752 一致）</text><text x="40" y="296" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="600" text-anchor="start">📏 Rule｜规则：每一站都写单位；单位不消干净，答案一定是错的。</text></svg>