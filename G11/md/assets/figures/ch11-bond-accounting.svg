<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374"><rect width="680" height="374" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">The Energy Ledger｜能量收支账本</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">Every reaction breaks bonds then forms bonds. The balance decides exo/endo.</text><rect x="45" y="74" width="285" height="150" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="187" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#B7791F" font-weight="700" text-anchor="middle">Breaking bonds 断键</text><text x="187" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">absorbs energy 吸收能量</text><text x="187" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">always IN from surroundings</text><text x="187" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="middle" font-style="italic">spending money</text><text x="187" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="400" text-anchor="middle">（花钱）</text><rect x="350" y="74" width="285" height="150" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="492" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="middle">Forming bonds 成键</text><text x="492" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">releases energy 释放能量</text><text x="492" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">always OUT to surroundings</text><text x="492" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="middle" font-style="italic">earning money</text><text x="492" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="400" text-anchor="middle">（赚钱）</text><rect x="45" y="242" width="590" height="40" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="340" y="267" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="middle">form MORE than you break → net OUT → exothermic 放热</text><rect x="45" y="294" width="590" height="40" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="340" y="319" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="middle">break MORE than you form → net IN → endothermic 吸热</text><text x="340" y="350" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">Combustion pays well: the new C=O and O–H bonds are much stronger than the old ones.</text></svg>