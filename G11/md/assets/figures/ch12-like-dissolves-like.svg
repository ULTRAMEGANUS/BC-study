<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380"><rect width="680" height="380" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Like Dissolves Like｜相似相溶</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">Polar attracts polar; nonpolar attracts nonpolar. Mismatch = no dissolving.</text><rect x="150" y="74" width="240" height="40" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="270.0" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Polar solvent 极性溶剂 (water 水)</text><rect x="400" y="74" width="240" height="40" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="520.0" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="middle">Nonpolar solvent 非极性 (hexane 己烷)</text><rect x="40" y="124" width="100" height="74" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="90" y="152" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="middle">Polar solute</text><text x="90" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">食盐 · 糖</text><rect x="150" y="124" width="240" height="74" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="270.0" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="middle">DISSOLVES ✔ 溶解</text><text x="270.0" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">salt in water</text><rect x="400" y="124" width="240" height="74" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.4"/><text x="520.0" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#C53030" font-weight="700" text-anchor="middle">NO ✘ 不溶</text><text x="520.0" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">salt in gasoline</text><rect x="40" y="208" width="100" height="74" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="90" y="236" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="700" text-anchor="middle">Nonpolar</text><text x="90" y="256" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">油 · 碘</text><rect x="150" y="208" width="240" height="74" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.4"/><text x="270.0" y="240" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#C53030" font-weight="700" text-anchor="middle">NO ✘ 不溶</text><text x="270.0" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">oil &amp; water — the classic</text><rect x="400" y="208" width="240" height="74" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="520.0" y="240" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="middle">DISSOLVES ✔ 溶解</text><text x="520.0" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">iodine in hexane</text><rect x="45" y="300" width="590" height="58" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="65" y="323" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Why: IMF between solute &amp; solvent must rival those inside each liquid.</text><text x="65" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">原理（接 Ch.7）：溶质-溶剂间作用力必须强到能拆开各自的抱团。</text></svg>