<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 448" width="680" height="448"><rect width="680" height="448" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">The Six Reaction Types｜六类反应一览</text><text x="340" y="56" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">General pattern + one real example each — learn the shape, not the sample.</text><rect x="45" y="74" width="590" height="50" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="65" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">1  Synthesis 合成</text><text x="270" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">A + B → AB</text><text x="450" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">2 Mg + O₂ → 2 MgO</text><rect x="45" y="132" width="590" height="50" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="65" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">2  Decomposition 分解</text><text x="270" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">AB → A + B</text><text x="450" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">2 H₂O₂ → 2 H₂O + O₂</text><rect x="45" y="190" width="590" height="50" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="65" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="start">3  Single replacement 单置换</text><text x="270" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">A + BC → AC + B</text><text x="450" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Zn + 2 HCl → ZnCl₂ + H₂</text><rect x="45" y="248" width="590" height="50" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="65" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">4  Double replacement 双置换</text><text x="270" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">AB + CD → AD + CB</text><text x="450" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">AgNO₃ + NaCl → AgCl↓ + NaNO₃</text><rect x="45" y="306" width="590" height="50" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="65" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="start">5  Neutralization 中和</text><text x="270" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">acid + base → salt + water</text><text x="450" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">HCl + NaOH → NaCl + H₂O</text><rect x="45" y="364" width="590" height="50" rx="8" fill="#FFFAF0" stroke="#C05621" stroke-width="1.3"/><text x="65" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C05621" font-weight="700" text-anchor="start">6  Combustion 燃烧</text><text x="270" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">CₓHᵧ + O₂ → CO₂ + H₂O</text><text x="450" y="388" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">CH₄ + 2 O₂ → CO₂ + 2 H₂O</text><text x="340" y="426" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">Neutralization is double replacement with H₂O as one product.</text></svg>