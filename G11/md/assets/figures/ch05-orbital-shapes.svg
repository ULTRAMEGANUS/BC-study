<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 284" width="680" height="284"><rect width="680" height="284" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Orbitals: Shape and Capacity｜轨道的形状与容量</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">An orbital is a region where an electron is likely to be found — not a path it travels.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">轨道是「电子大概会出现在这里」的区域，不是电子跑的路线。</text><rect x="40" y="90" width="600" height="26" rx="6" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="55" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Orbital｜轨道</text><text x="185" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Shape｜形状</text><text x="400" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Orbitals｜轨道数</text><text x="570" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Max e⁻｜最多电子</text><rect x="40" y="116" width="600" height="30" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">s</text><text x="185" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">sphere｜球形</text><text x="400" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">1</text><text x="570" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">2</text><rect x="40" y="146" width="600" height="30" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">p</text><text x="185" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">dumbbell ×3｜哑铃形 ×3</text><text x="400" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">3</text><text x="570" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">6</text><rect x="40" y="176" width="600" height="30" rx="4" fill="#FFFBEB" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="start">d</text><text x="185" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">cloverleaf ×5｜四叶形 ×5</text><text x="400" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">5</text><text x="570" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">10</text><rect x="40" y="206" width="600" height="30" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">f</text><text x="185" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">complex ×7｜复杂形 ×7</text><text x="400" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">7</text><text x="570" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">14</text><text x="40" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Each orbital holds at most 2 electrons (Pauli); orbitals in one subshell share one energy.</text><text x="40" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">每个轨道最多容纳 2 个电子（泡利）；同一亚层内各轨道能量相同。</text></svg>