<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 508" width="680" height="508"><rect width="680" height="508" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Titration Anatomy｜滴定解剖图</text><rect x="150" y="58" width="44" height="190" rx="4" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.6"/><rect x="153" y="88" width="38" height="150" rx="2" fill="#DBEAFE" stroke="none" stroke-width="0"/><text x="204" y="84" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">burette 滴定管</text><text x="204" y="102" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">standard NaOH 标准液</text><text x="204" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">read initial &amp; final 读初读数与终读数</text><path d="M 325,148 L 325,178 L 305,248 Q 345.0,262 385,248 L 365,178 L 365,148 Z" fill="#FEE2E2" stroke="#1F2933" stroke-width="1.6"/><text x="345.0" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">flask 锥形瓶: HCl + indicator</text><text x="345.0" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">指示剂 2–3 滴即可</text><path d="M 169.0,254 q 3,6 3,9 a 3,3 0 1 1 -6,0 q 0,-3 3,-9" fill="#2B6CB0"/><text x="430" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">swirl while adding 边滴边摇</text><text x="430" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">stop at first permanent colour</text><text x="430" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">变色即停（且半分钟不褪）</text><rect x="45" y="262" width="590" height="58" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="65" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Equivalence point 等当点: exactly stoichiometric moles 恰好按系数比反应完</text><text x="65" y="305" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">End point 终点: the indicator changes colour 变色点 — ≈ but not exactly equal（误差来源）</text><rect x="45" y="336" width="590" height="92" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="65" y="360" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="start">Calculation chain｜计算链</text><text x="65" y="384" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">V(base) × M(base) = 0.02500 L × 0.100 M = 0.002500 mol NaOH</text><text x="65" y="406" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">→ 1:1 ratio → 0.002500 mol HCl ÷ V(acid) 0.02500 L = 0.100 M HCl</text><rect x="45" y="444" width="590" height="44" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="65" y="463" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#C53030" font-weight="700" text-anchor="start">Safety: ALWAYS acid into water when diluting. 稀释浓酸时“酸入水”，沿壁缓搅。</text><text x="65" y="481" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">平行滴 2–3 次取平均；单次偏差超 0.05 mL 重滴。</text></svg>