<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 366" width="680" height="366"><rect width="680" height="366" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Reading an Equation Like a Chemist｜方程式的每一个部件</text><text x="340" y="72" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#1F2933" font-weight="700" text-anchor="middle">Zn(s) + 2 HCl(aq) → ZnCl₂(aq) + H₂(g)</text><line x1="108" y1="66" x2="108" y2="110" stroke="#2B6CB0" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="108" cy="63" r="2.5" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="1.0"/><text x="108" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="400" text-anchor="start">state symbol: solid｜固</text><line x1="176" y1="66" x2="170" y2="134" stroke="#2F855A" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="176" cy="63" r="2.5" fill="#2F855A" stroke="#2F855A" stroke-width="1.0"/><text x="170" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="400" text-anchor="start">coefficient: balances atoms｜系数</text><line x1="300" y1="66" x2="290" y2="110" stroke="#B7791F" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="300" cy="63" r="2.5" fill="#B7791F" stroke="#B7791F" stroke-width="1.0"/><text x="290" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="400" text-anchor="start">aqueous = dissolved in water｜水溶液</text><line x1="404" y1="66" x2="395" y2="134" stroke="#6B46C1" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="404" cy="63" r="2.5" fill="#6B46C1" stroke="#6B46C1" stroke-width="1.0"/><text x="395" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#6B46C1" font-weight="400" text-anchor="start">yield arrow｜生成箭头</text><line x1="585" y1="66" x2="560" y2="110" stroke="#C53030" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="585" cy="63" r="2.5" fill="#C53030" stroke="#C53030" stroke-width="1.0"/><text x="560" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="400" text-anchor="start">gas｜气体</text><rect x="55" y="154" width="290" height="150" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="75" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="start">State symbols｜状态符号</text><text x="85" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">(s)</text><text x="135" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">solid 固体</text><text x="85" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">(l)</text><text x="135" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">liquid 液体</text><text x="85" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">(g)</text><text x="135" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">gas 气体</text><text x="85" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">(aq)</text><text x="135" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">aqueous 水溶液</text><rect x="365" y="154" width="260" height="150" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="385" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">Counting check｜数原子自检</text><text x="385" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">Zn: 1 = 1</text><text x="600" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">OK</text><text x="385" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">H: 2 = 2</text><text x="600" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">OK</text><text x="385" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">Cl: 2 = 2</text><text x="600" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">OK</text><text x="340" y="344" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Balanced = every element has equal atoms on both sides. 配平 = 每种元素左右原子数相等。</text></svg>