<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464"><rect width="680" height="464" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">IUPAC Naming in Four Steps｜IUPAC 命名四步</text><rect x="40" y="50" width="600" height="74" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="58" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">Step 1</text><text x="122" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="600" text-anchor="start">Find the LONGEST carbon chain.</text><text x="122" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">找**最长**的碳链作主链（不是「最直」的那条）。</text><text x="622" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="end">→ butane (4 C)</text><rect x="40" y="134" width="600" height="74" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="58" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">Step 2</text><text x="122" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="600" text-anchor="start">Number the chain so substituents get the LOWEST numbers.</text><text x="122" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">编号方向要让**取代基位次最小**。</text><text x="622" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="end">→ 2-methyl, not 3-methyl</text><rect x="40" y="218" width="600" height="74" rx="10" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="58" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="start">Step 3</text><text x="122" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="600" text-anchor="start">Name each substituent as an alkyl group (methyl, ethyl…).</text><text x="122" y="268" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">把每个取代基写成烷基名（甲基、乙基…）。</text><text x="622" y="258" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="end">→ methyl group</text><rect x="40" y="302" width="600" height="74" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="58" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#6B46C1" font-weight="700" text-anchor="start">Step 4</text><text x="122" y="328" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="600" text-anchor="start">Assemble: substituent position + name + parent + family suffix.</text><text x="122" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">拼装：取代基位次 + 名称 + 主链 + 家族后缀。</text><text x="622" y="342" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#6B46C1" font-weight="700" text-anchor="end">→ 2-methylbutane</text><rect x="40" y="392" width="600" height="58" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="58" y="416" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="600" text-anchor="start">💡 Prefixes 1–10｜前缀：meth eth prop but pent hex hept oct non dec</text><text x="58" y="436" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">多个相同取代基用 di- / tri- / tetra-（2,3-dimethylbutane）。</text></svg>