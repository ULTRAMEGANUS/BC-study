<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 394" width="680" height="394"><rect width="680" height="394" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Why Trends Happen: Charge vs Shielding｜趋势从哪来：电荷与屏蔽</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">An outer electron feels roughly: nuclear charge minus shielding by inner electrons.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">外层电子感受到的引力 ≈ 核电荷 − 内层电子的屏蔽。</text><text x="40" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">Across a period (Na → Cl)｜横向（Na → Cl）</text><circle cx="150" cy="156" r="13.333333333333334" fill="none" stroke="#2B6CB0" stroke-width="1.3"/><text x="163.6" y="144.4" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2B6CB0" font-weight="700" text-anchor="start">2</text><circle cx="150" cy="156" r="26.666666666666668" fill="none" stroke="#2B6CB0" stroke-width="1.3"/><text x="173.2" y="134.8" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2B6CB0" font-weight="700" text-anchor="start">8</text><circle cx="150" cy="156" r="40.0" fill="none" stroke="#2B6CB0" stroke-width="1.3"/><text x="182.8" y="125.2" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2B6CB0" font-weight="700" text-anchor="start">1</text><text x="150" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor=