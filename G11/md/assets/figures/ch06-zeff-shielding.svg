text-anchor="start">pull stronger｜引力更强</text><text x="40" y="224" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">Down a group (Na → K)｜纵向（Na → K）</text><circle cx="150" cy="298" r="13.333333333333334" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="163.6" y="286.4" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">2</text><circle cx="150" cy="298" r="26.666666666666668" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="173.2" y="276.8" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">8</text><circle cx="150" cy="298" r="40.0" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="182.8" y="267.2" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">1</text><text x="150" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">+11</text><line x1="215" y1="298" x2="285" y2="298" stroke="#52606D" stroke-width="2"/><text x="250" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#52606D" font-weight="700" text-anchor="middle">→</text><circle cx="370" cy="298" r="11.75" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="382.46" y="287.54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">2</text><circle cx="370" cy="298" r="23.5" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="390.92" y="279.08" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">8</text><circle cx="370" cy="298" r="35.25" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="399.38" y="270.62" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">8</text><circle cx="370" cy="298" r="47.0" fill="none" stroke="#2F855A" stroke-width="1.3"/><text x="407.84" y="262.16" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#2F855A" font-weight="700" text-anchor="start">1</text><text x="370" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">+19</text><text x="470" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">shells: 3 → 4｜层数 +1</text><text x="470" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">shielding: 8 → 18｜屏蔽增大</text><text x="470" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">outer shell farther｜外层更远</text><text x="470" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">pull weaker｜引力更弱</text><text x="40" y="376" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">同一张图读两条趋势：横向看「电荷加码」，纵向看「层数与屏蔽加码」。</text></svg>