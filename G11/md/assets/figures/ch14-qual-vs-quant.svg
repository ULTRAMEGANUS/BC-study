<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392"><rect width="680" height="392" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Qualitative vs Quantitative｜定性与定量</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">First ask: WHAT is it? Then ask: HOW MUCH is there?</text><rect x="45" y="74" width="285" height="210" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/><text x="187" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Qualitative 定性</text><text x="187" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">answers “what is present?”</text><text x="65" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  flame test 焰色试验</text><text x="65" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  precipitation tests 沉淀检验</text><text x="65" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  indicator colour 指示剂判酸碱</text><text x="65" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  litmus / pH paper 定性酸碱</text><rect x="350" y="74" width="285" height="210" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="492" y="100" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2F855A" font-weight="700" text-anchor="middle">Quantitative 定量</text><text x="492" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">answers “how much is there?”</text><text x="370" y="148" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  titration 滴定（浓度）</text><text x="370" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  gravimetric analysis 重量分析</text><text x="370" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  mass &amp; volume measurements 称量量体积</text><text x="370" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">•  uncertainty &amp; parallel trials 不确定度</text><rect x="45" y="312" width="590" height="58" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="65" y="335" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">Good labs do both: identify first, then measure. 先鉴定、后定量。</text><text x="65" y="355" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">Gravimetric: dissolve → precipitate → filter → dry to constant mass → weigh.</text></svg>