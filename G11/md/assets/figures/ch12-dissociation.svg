<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 334" width="680" height="334"><rect width="680" height="334" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Dissociation Equation Anatomy｜电离方程式解剖</text><text x="340" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="22" fill="#1F2933" font-weight="700" text-anchor="middle">NaCl(s)  →  Na⁺(aq)  +  Cl⁻(aq)</text><line x1="168" y1="62" x2="150" y2="116" stroke="#2B6CB0" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="168" cy="59" r="2.5" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="1.0"/><text x="150" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="400" text-anchor="start">ionic solid — keep (s) 保留固态</text><line x1="330" y1="62" x2="330" y2="140" stroke="#2F855A" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="330" cy="59" r="2.5" fill="#2F855A" stroke="#2F855A" stroke-width="1.0"/><text x="330" y="144" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="400" text-anchor="start">cation hydrated in solution 水合阳离子</text><line x1="505" y1="62" x2="520" y2="116" stroke="#B7791F" stroke-width="1.0" stroke-dasharray="2 2"/><circle cx="505" cy="59" r="2.5" fill="#B7791F" stroke="#B7791F" stroke-width="1.0"/><text x="520" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="400" text-anchor="start">anion hydrated 水合阴离子</text><rect x="45" y="168" width="285" height="118" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="187" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="middle">Split only aqueous ionic compounds</text><text x="187" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">strong electrolytes → ions</text><text x="187" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle"> solids (s), liquids (l), gases (g)</text><text x="187" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle"> stay intact — never split them</text><text x="187" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">拆强电解质；固液气不拆</text><rect x="350" y="168" width="285" height="118" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="492" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#C53030" font-weight="700" text-anchor="middle">Balance BOTH atoms and charge</text><text x="492" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="middle">CaCl₂(s) → Ca²⁺(aq) + 2 Cl⁻(aq)</text><text x="492" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">charge: +2 and 2(−1) → net 0 ✔</text><text x="492" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">subscripts become coefficients</text><text x="492" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">原子与电荷双守恒</text><text x="340" y="310" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">Conductivity: mobile ions carry current — that is why salt water conducts.</text></svg>