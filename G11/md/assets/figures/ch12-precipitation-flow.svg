<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 488" width="680" height="488"><rect width="680" height="488" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Will a Precipitate Form?｜沉淀预测四步</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Example: mix AgNO₃(aq) with NaCl(aq).</text><rect x="55" y="74" width="570" height="56" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="75" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">1  Write both reactants with ions</text><text x="75" y="118" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">AgNO₃(aq) + NaCl(aq) — both aqueous, both split</text><rect x="55" y="142" width="570" height="56" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="75" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">2  Swap partners (double replacement)</text><text x="75" y="186" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">Ag⁺ pairs with Cl⁻ ; Na⁺ pairs with NO₃⁻</text><rect x="55" y="210" width="570" height="56" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="75" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="start">3  Check the solubility rules for BOTH products</text><text x="75" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">AgCl → INSOLUBLE 沉淀 ; NaNO₃ → soluble 留溶液</text><rect x="55" y="278" width="570" height="56" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="75" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">4  Write the equation with (s) for the precipitate</text><text x="75" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">AgNO₃(aq) + NaCl(aq) → AgCl(s)↓ + NaNO₃(aq)</text><line x1="340" y1="324" x2="340" y2="324" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><rect x="55" y="346" width="570" height="62" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="75" y="370" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">Quick rules you must know cold｜必背速查（Data Booklet 版为准）</text><text x="75" y="392" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">NO₃⁻ · NH₄⁺ · Group 1 → always soluble ; Cl⁻ except Ag⁺/Pb²⁺ ; SO₄²⁻ except Ba²⁺/Pb²⁺</text><rect x="55" y="424" width="570" height="44" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="75" y="443" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#C53030" font-weight="700" text-anchor="start">Both products soluble → NO precipitate, write “no reaction”. 两者都可溶 = 不反应。</text><text x="75" y="461" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">沉淀 = 低溶解度的固体；不是“沉下去”就叫沉淀。</text></svg>