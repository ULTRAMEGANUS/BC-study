<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 544" width="680" height="544"><rect width="680" height="544" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Reading Solubility Curves｜溶解度曲线读图</text><line x1="90" y1="56" x2="90" y2="306" stroke="#52606D" stroke-width="1.4"/><line x1="90" y1="306" x2="420" y2="306" stroke="#52606D" stroke-width="1.4"/><text x="82" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="700" text-anchor="end">g/100 mL</text><text x="420" y="322" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="end">temperature (°C) 温度</text><line x1="90" y1="118.5" x2="420" y2="118.5" stroke="#E4E7EB" stroke-width="1.0"/><text x="84" y="122.5" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#52606D" font-weight="400" text-anchor="end">90</text><line x1="90" y1="181.0" x2="420" y2="181.0" stroke="#E4E7EB" stroke-width="1.0"/><text x="84" y="185.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#52606D" font-weight="400" text-anchor="end">60</text><line x1="90" y1="243.5" x2="420" y2="243.5" stroke="#E4E7EB" stroke-width="1.0"/><text x="84" y="247.5" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#52606D" font-weight="400" text-anchor="end">30</text><path d="M 90,226.0 L 150,196.0 L 210,161.0 L 270,126.0 L 330,91.0 L 390,68.0" fill="none" stroke="#C53030" stroke-width="2.2"/><path d="M 90,241.0 L 150,239.0 L 210,236.0 L 270,234.0 L 330,232.0 L 390,229.0" fill="none" stroke="#2B6CB0" stroke-width="2.2"/><path d="M 90,96.0 L 150,116.0 L 210,141.0 L 270,171.0 L 330,206.0 L 390,246.0" fill="none" stroke="#2F855A" stroke-width="2.2" stroke-dasharray="6 4"/><text x="340" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="start">KNO₃ (solid)</text><text x="340" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="700" text-anchor="start">NaCl (solid)</text><text x="340" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">O₂ (gas)</text><rect x="60" y="346" width="560" height="42" rx="8" fill="#FFFFFF" stroke="#6B46C1" stroke-width="1.2"/><text x="80" y="364" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B46C1" font-weight="700" text-anchor="start">Above the curve 超饱和区</text><text x="80" y="381" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">supersaturated / crystallizes out 过饱和析出</text><rect x="60" y="396" width="560" height="42" rx="8" fill="#FFFFFF" stroke="#B7791F" stroke-width="1.2"/><text x="80" y="414" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">On the curve 曲线上</text><text x="80" y="431" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">saturated 饱和 — exactly dissolved to the limit</text><rect x="60" y="446" width="560" height="42" rx="8" fill="#FFFFFF" stroke="#2F855A" stroke-width="1.2"/><text x="80" y="464" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">Below the curve 欠饱和区</text><text x="80" y="481" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">unsaturated — can still dissolve more 不饱和</text><text x="340" y="504" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">Solids: most dissolve MORE when hot. Gases: opposite — warm water holds less O₂.</text><text x="340" y="522" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">固体多数升温增溶；气体反向——温水中溶氧少，鱼夏天浮头。</text></svg>