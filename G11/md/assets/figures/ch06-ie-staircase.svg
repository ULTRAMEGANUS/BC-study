oe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">O</text><circle cx="544" cy="121.22152811148486" r="3.5" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="1"/><text x="544" y="114.22152811148486" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">1681</text><text x="544" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">F</text><circle cx="618" cy="102.0" r="3.5" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="1"/><text x="618" y="95.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">2081</text><text x="618" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">Ne</text><line x1="70" y1="202" x2="650" y2="202" stroke="#CBD2D9" stroke-width="1.2"/><text x="260" y="185.50888995675155" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#C53030" font-weight="400" text-anchor="start">B &lt; Be: new p subshell</text><text x="482" y="160.85728015377222" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#C53030" font-weight="400" text-anchor="start">O &lt; N: pairing repulsion</text><text x="40" y="236" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">Period 3｜第三周期</text><polyline points="100,324 174,308 248,318 322,304 396,290 470,291 544,274 618,256" fill="none" stroke="#2F855A" stroke-width="2"/><circle cx="100" cy="323.5180091683039" r="3.5" fill="#2F855A" stroke="#2F855A" stroke-width="1"/><text x="100" y="316.51