<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440"><rect width="680" height="440" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">The Ionization Staircase and Its Dips｜电离能的台阶与回落</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">IE climbs across each period — except at two predictable spots (circled).</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">电离能沿周期爬升——只有两处规律性回落（红圈处）。</text><text x="40" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">Period 2｜第二周期</text><polyline points="100,177 174,159 248,164 322,150 396,135 470,139 544,121 618,102" fill="none" stroke="#2B6CB0" stroke-width="2"/><circle cx="100" cy="177.01201345506968" r="3.5" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="1"/><text x="100" y="170.01201345506968" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">520</text><text x="100" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">Li</text><circle cx="174" cy="158.75156174915907" r="3.5" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="1"/><text x="174" y="151.75156174915907" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">900</text><text x="174" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" f