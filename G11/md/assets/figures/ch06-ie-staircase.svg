ily="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">1012</text><text x="396" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">P</text><circle cx="470" cy="290.5121152586771" r="3.5" fill="#C53030" stroke="#C53030" stroke-width="1"/><text x="470" y="283.5121152586771" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">1000</text><circle cx="470" cy="290.5121152586771" r="9" fill="none" stroke="#C53030" stroke-width="1.6"/><text x="470" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">S</text><circle cx="544" cy="274.0746561886051" r="3.5" fill="#2F855A" stroke="#2F855A" stroke-width="1"/><text x="544" y="267.0746561886051" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">1251</text><text x="544" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">Cl</text><circle cx="618" cy="256.0" r="3.5" fill="#2F855A" stroke="#2F855A" stroke-width="1"/><text x="618" y="249.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="8.5" fill="#52606D" font-weight="600" text-anchor="middle">1527</text><text x="618" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="middle">Ar</text><line x1="70" y1="356" x2="650" y2="356" stroke="#CBD2D9" stroke-width="1.2"/><text x="260" y="342.1480026195154" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#C53030" font-weight="400" text-anchor="start">Al &lt; Mg: new p subshell</text><text x="482" y="314.5121152586771" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#C53030" font-weight="400" text-anchor="start">S &lt; P: pairing repulsion</text><text x="40" y="392" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">B/Al：新电子进入 p 亚层，能量略高、更易失去。</text><text x="40" y="407" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">O/S：第 4 个 p 电子开始配对，成对排斥使它更易失去。</text><text x="40" y="422" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="600" text-anchor="start">两处回落都能用电子排布预言——这是模型威力的最好证据。</text></svg>