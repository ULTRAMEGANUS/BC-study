<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 472" width="680" height="472"><rect width="680" height="472" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">The Yield Trio｜产量三兄弟</text><rect x="55" y="58" width="570" height="84" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/><text x="80" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2B6CB0" font-weight="700" text-anchor="start">Theoretical yield｜理论产量</text><text x="80" y="110" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">from stoichiometry (limiting reagent)</text><text x="80" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">纸上最大值 — 纯算出来</text><rect x="55" y="156" width="570" height="84" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="80" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2F855A" font-weight="700" text-anchor="start">Actual yield｜实际产量</text><text x="80" y="208" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">measured in the lab after the experiment</text><text x="80" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">实验称出来 — 总是更小</text><rect x="55" y="254" width="570" height="84" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="80" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#B7791F" font-weight="700" text-anchor="start">Percent yield｜百分产率</text><text x="80" y="306" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">= actual ÷ theoretical × 100%</text><text x="80" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">效率指标 — 永远 ≤ 100%</text><rect x="55" y="356" width="570" height="96" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="75" y="382" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="start">Worked example｜算例</text><text x="75" y="406" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">theoretical = 8.50 g ; actual = 7.65 g  →  % yield = 7.65 / 8.50 × 100% = 90.0 %</text><text x="75" y="430" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">If you get &gt; 100%: wet product, impurities, or weighing error — check before celebrating.</text></svg>