<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 453" width="680" height="453"><rect width="680" height="453" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Four Steps to Any Lewis Structure｜路易斯结构四步法</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Works for molecules and for polyatomic ions (add or remove electrons for the charge first).</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">分子和多原子离子通用（若是离子，第一步先按电荷加减电子）。</text><rect x="40" y="88" width="300" height="66" rx="6" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.0"/><text x="50" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="start">1 · Count｜数价电子</text><text x="50" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">Sum valence electrons of every atom.</text><text x="50" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="600" text-anchor="start">NH₃: 5 + 3×1 = 8</text><rect x="40" y="164" width="300" height="66" rx="6" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.0"/><text x="50" y="183" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">2 · Skeleton｜摆骨架</text><text x="50" y="200" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">Least electronegative atom in the centre; H never central.</text><text x="50" y="217" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="600" text-anchor="start">N in the middle, 3 H around</text><rect x="40" y="240" width="300" height="66" rx="6" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.0"/><text x="50" y="259" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">3 · Octets｜补八隅</text><text x="50" y="276" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">Bond outer atoms to centre, then finish their octets.</text><text x="50" y="293" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="600" text-anchor="start">3 bonds use 6 e⁻; give each H its duet</text><rect x="40" y="316" width="300" height="66" rx="6" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.0"/><text x="50" y="335" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B46C1" font-weight="700" text-anchor="start">4 · Leftovers｜余电子</text><text x="50" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">Leftover electrons go on the central atom.</text><text x="50" y="369" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="600" text-anchor="start">8 − 6 = 2 left → one lone pair on N</text><rect x="356" y="88" width="284" height="300" rx="8" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="498.0" y="110" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">NH₃ — the answer｜结果</text><text x="432.0" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#C53030" font-weight="700" text-anchor="start">..</text><text x="498.0" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#1F2933" font-weight="700" text-anchor="middle">N</text><text x="436.0" y="189" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="600" text-anchor="start">H</text><text x="560.0" y="189" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="600" text-anchor="start">H</text><text x="498.0" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="600" text-anchor="start">H</text><line x1="484.0" y1="182" x2="448.0" y2="186" stroke="#1F2933" stroke-width="1.6"/><line x1="512.0" y1="182" x2="548.0" y2="186" stroke="#1F2933" stroke-width="1.6"/><line x1="498.0" y1="196" x2="498.0" y2="216" stroke="#1F2933" stroke-width="1.6"/><text x="498.0" y="372" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">lone pair（孤对）留在中心原子 N 上</text><text x="40" y="404" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">If the central atom still lacks an octet, move a lone pair into a bonding position —</text><text x="40" y="419" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">that is how double and triple bonds appear (see CO₂ in Fig. 7-3).</text><text x="40" y="435" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">若中心原子凑不满八隅，把外层孤对推进成键位置——双键、三键就是这么来的。</text></svg>