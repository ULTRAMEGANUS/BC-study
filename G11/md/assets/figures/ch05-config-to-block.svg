<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 315" width="680" height="315"><rect width="680" height="315" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Configuration Maps onto the Periodic Table｜排布就是周期表的地图</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">The block of an element is simply the subshell that receives its last electron.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">元素的区块，就是「最后填入的电子」所在的那个亚层。</text><rect x="40" y="88" width="600" height="26" rx="6" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="55" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Block｜区</text><text x="165" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">General form｜通式</text><text x="350" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Where it sits｜所在族</text><text x="550" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Example｜例</text><rect x="40" y="114" width="600" height="34" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="start">s 区</text><text x="165" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">ns¹⁻²</text><text x="350" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Groups 1–2｜第 1–2 族</text><text x="550" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Na: [Ne]3s¹</text><rect x="40" y="148" width="600" height="34" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">p 区</text><text x="165" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">ns²np¹⁻⁶</text><text x="350" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Groups 13–18｜第 13–18 族</text><text x="550" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Cl: [Ne]3s²3p⁵</text><rect x="40" y="182" width="600" height="34" rx="4" fill="#FFFBEB" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">d 区·过渡金属</text><text x="165" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">(n−1)d¹⁻¹⁰ns¹⁻²</text><text x="350" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Groups 3–12｜第 3–12 族</text><text x="550" y="204" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Fe: [Ar]3d⁶4s²</text><rect x="40" y="216" width="600" height="34" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B46C1" font-weight="700" text-anchor="start">f 区·镧系锕系</text><text x="165" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">(n−2)f¹⁻¹⁴ns²</text><text x="350" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Below the table｜排在表外</text><text x="550" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">U: [Rn]5f³6d¹7s²</text><text x="40" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Read the block from the last electrons added —</text><text x="40" y="281" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">it tells you which subshell is being filled.</text><text x="40" y="297" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">看最后填入的电子落在哪个亚层——那个亚层就决定了区块。</text></svg>