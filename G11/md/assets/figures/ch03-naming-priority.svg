<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 485" width="680" height="485"><rect width="680" height="485" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Naming Priority｜命名优先级</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#52606D" font-weight="400" text-anchor="start">Rule 1 — the parent chain must CONTAIN the functional group.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">规则一：主链必须「包含」官能团——不是单纯的「最长链」。</text><text x="40" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#52606D" font-weight="400" text-anchor="start">Rule 2 — number so the functional group gets the LOWEST locant.</text><text x="40" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">规则二：编号要让官能团位次「最小」——它比取代基优先。</text><rect x="40" y="125" width="291.0" height="150" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="58" y="151" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">SUFFIX groups｜用后缀（吃编号）</text><text x="58" y="177" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-anol  alcohol 醇</text><text x="58" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-anal  aldehyde 醛</text><text x="58" y="211" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-anone  ketone 酮</text><text x="58" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-anoic acid  羧酸</text><text x="58" y="245" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-anamine  amine 胺</text><text x="58" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-anamide  amide 酰胺</text><rect x="349.0" y="125" width="291.0" height="150" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="367.0" y="151" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">PREFIX groups｜用前缀（不吃编号）</text><text x="367.0" y="177" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-chloro-  卤代</text><text x="367.0" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-bromo-   卤代</text><text x="367.0" y="211" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">-methoxy-  醚</text><text x="367.0" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">R–O–R′  醚（无编号）</text><text x="367.0" y="255" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">只有这两族降级为前缀。</text><rect x="40" y="291" width="600" height="104" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="58" y="317" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">Worked example｜实例：CH₃—CH(OH)—CH₃</text><text x="58" y="341" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#C53030" font-weight="400" text-anchor="start">✗ propan-1-ol  ← numbering from the wrong end</text><text x="58" y="363" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="400" text-anchor="start">✓ propan-2-ol  ← –OH sits at C2, the lowest possible locant</text><text x="58" y="385" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">–OH 在 2 位；从右端编号得到 2，从左端得到 3——取 2。</text><rect x="40" y="411" width="600" height="58" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="58" y="435" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#C53030" font-weight="600" text-anchor="start">⚠ The suffix position number CANNOT be omitted for C₃ and above.</text><text x="58" y="455" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">3 个碳起，官能团位次必须写出来：ethANOL 只有一个位置所以可省，但 propan-2-ol 的「2」不能省。</text></svg>