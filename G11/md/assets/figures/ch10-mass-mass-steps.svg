<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 394" width="680" height="394"><rect width="680" height="394" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Mass-to-Mass: The Four-Step Road｜质量对质量四步路</text><text x="340" y="56" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Example: what mass of H₂ forms when 6.0 g Mg reacts with excess HCl?</text><text x="340" y="74" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">Mg + 2 HCl → MgCl₂ + H₂</text><rect x="40" y="92" width="140" height="74" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.5"/><text x="110.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Mass A</text><text x="110.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">6.0 g Mg</text><rect x="200" y="92" width="140" height="74" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.5"/><text x="270.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="middle">Mol A</text><text x="270.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">0.247 mol Mg</text><rect x="360" y="92" width="140" height="74" rx="10" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.5"/><text x="430.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="middle">Mol B</text><text x="430.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">0.247 mol H₂</text><rect x="520" y="92" width="140" height="74" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.5"/><text x="590.0" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="middle">Mass B</text><text x="590.0" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">0.50 g H₂</text><line x1="184" y1="129.0" x2="196" y2="129.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><text x="190.0" y="111.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="700" text-anchor="middle">÷ molar mass</text><text x="190.0" y="159.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">24.3 g/mol</text><line x1="344" y1="129.0" x2="356" y2="129.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><text x="350.0" y="111.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="700" text-anchor="middle">× mole ratio</text><text x="350.0" y="159.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">1 : 1</text><line x1="504" y1="129.0" x2="516" y2="129.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><text x="510.0" y="111.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="700" text-anchor="middle">× molar mass</text><text x="510.0" y="159.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">2.016 g/mol</text><rect x="40" y="192" width="600" height="112" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="60" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">① Balance first — all ratios come from the balanced equation. 先配平。</text><text x="60" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">② grams A → mol A:   6.0 g ÷ 24.3 g/mol = 0.247 mol</text><text x="60" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">③ mol A → mol B:     0.247 mol × (1 mol H₂ / 1 mol Mg) = 0.247 mol</text><text x="60" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">④ mol B → grams B:   0.247 mol × 2.016 g/mol = 0.499 → 0.50 g (2 s.f.)</text><rect x="40" y="328" width="600" height="46" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="60" y="347" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#C53030" font-weight="700" text-anchor="start">⛔ No shortcut: mass A → mass B directly is the #1 exam error.</text><text x="60" y="365" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">质量直接换质量是第一大扣分点——必须绕道摩尔。</text></svg>