<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 492" width="680" height="492"><rect width="680" height="492" fill="#FFFFFF"/><text x="340" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Percent Composition｜百分组成 — worked example: NH₃</text><text x="340" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="middle">Question: what percent by mass of ammonia is nitrogen?</text><rect x="55" y="86" width="570" height="84" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/><text x="75" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="start">Step 1｜定式量</text><text x="75" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">M(NH₃) = 14.01 + 3 × 1.008 = 17.03 g/mol</text><text x="75" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">one N plus three H — count every atom in the formula</text><rect x="55" y="184" width="570" height="84" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="75" y="210" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="start">Step 2｜各元素质量</text><text x="75" y="234" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">mass N = 14.01 g ; mass H = 3.024 g  (per 1 mol)</text><text x="75" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">multiply each element's molar mass by its subscript</text><rect x="55" y="282" width="570" height="84" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="75" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#B7791F" font-weight="700" text-anchor="start">Step 3｜算百分比</text><text x="75" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">%N = 14.01 / 17.03 × 100% = 82.3 %</text><text x="75" y="352" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">%H = 3.024 / 17.03 × 100% = 17.8 %</text><text x="340" y="386" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">Check: the parts must sum to 100%｜自检：各部分之和必须是 100%</text><rect x="55" y="400" width="469.10999999999996" height="38" rx="0" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="289.55499999999995" y="424.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="middle">N  82.3 %</text><rect x="524.1099999999999" y="400" width="100.89000000000004" height="38" rx="0" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="574.555" y="424.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="middle">H 17.8%</text><text x="340" y="464" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">82.3 + 17.8 = 100.1 % ✔ (rounding) — 不等于 100% 就先停下检查</text></svg>