<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" width="680" height="442"><rect width="680" height="442" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Intramolecular vs Intermolecular｜分子内 vs 分子间</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Boiling water breaks the forces BETWEEN molecules — the O–H bonds survive.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">水沸腾断的是分子之间的力——分子内的 O–H 共价键完好无损。</text><rect x="40" y="88" width="290" height="108" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="185.0" y="110" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Intramolecular｜分子内</text><text x="185.0" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">O–H covalent bond inside one molecule</text><text x="185.0" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">O–H 共价键（分子内部）</text><text x="185.0" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">≈ 463 kJ/mol · survives boiling｜沸腾不断</text><rect x="350" y="88" width="290" height="108" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="495.0" y="110" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="middle">Intermolecular｜分子间</text><text x="495.0" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">hydrogen bond between two molecules</text><text x="495.0" y="150" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">分子之间的氢键</text><text x="495.0" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="middle">≈ 20 kJ/mol · broken at boiling｜沸腾即断</text><text x="40" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">That ~20× gap is why water boils at 100 °C instead of decomposing.</text><text x="40" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">约 20 倍的差距，就是水烧到 100 °C 只汽化、不分解的原因。</text><text x="40" y="244" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">The IMF ladder, weakest to strongest｜分子间作用力阶梯（由弱到强）</text><rect x="40" y="258" width="230" height="30" rx="5" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="0.9"/><text x="50" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">London dispersion｜色散力</text><rect x="286" y="258" width="150" height="30" rx="5" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.0"/><text x="296" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">all molecules; grows with electron count｜所有分子都有，随电子数增大</text><rect x="40" y="296" width="230" height="30" rx="5" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="0.9"/><text x="50" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">Dipole-dipole｜偶极-偶极</text><rect x="286" y="296" width="250" height="30" rx="5" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.0"/><text x="296" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">polar molecules only｜只存在于极性分子之间</text><rect x="40" y="334" width="230" height="30" rx="5" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="0.9"/><text x="50" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">Hydrogen bonding｜氢键</text><rect x="286" y="334" width="350" height="30" rx="5" fill="#FFF5F5" stroke="#C53030" stroke-width="1.0"/><text x="296" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">H bonded to N, O or F｜H 直接连在 N、O、F 上</text><text x="40" y="378" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">All three are weak next to covalent bonds — that is why molecular compounds</text><text x="40" y="392" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">melt and boil so easily.</text><text x="40" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">三类作用力都远弱于共价键——这正是分子型物质熔沸点低的原因。</text><text x="40" y="424" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="600" text-anchor="start">溶解看「相似相溶」：极性溶剂抓极性/能氢键的溶质，非极性溶剂抓非极性溶质。</text></svg>