<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 394" width="680" height="394"><rect width="680" height="394" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Combustion: Oxygen Supply Decides｜供氧决定产物</text><text x="340" y="56" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">Same fuel, different amount of O₂, different products — and different danger.</text><rect x="250" y="74" width="180" height="44" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.3"/><text x="340" y="101" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">Fuel 燃料  CH₄</text><line x1="300" y1="118" x2="190" y2="140" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="118" x2="490" y2="140" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><text x="210" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">O₂ PLENTY｜充足</text><text x="415" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="start">O₂ LIMITED｜不足</text><rect x="60" y="140" width="260" height="150" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="190" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="middle">Complete combustion｜完全燃烧</text><text x="190" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">CH₄ + 2 O₂ → CO₂ + 2 H₂O</text><text x="190" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Products: CO₂ + H₂O</text><text x="190" y="240" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="400" text-anchor="middle">Blue flame｜蓝色火焰</text><text x="190" y="260" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="middle">Releases the MOST energy</text><rect x="360" y="140" width="260" height="150" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.4"/><text x="490" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="middle">Incomplete combustion｜不完全燃烧</text><text x="490" y="192" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">2 CH₄ + 3 O₂ → 2 CO + 4 H₂O</text><text x="490" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Products: CO (or C) + H₂O</text><text x="490" y="240" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="400" text-anchor="middle">Yellow/orange flame｜黄色火焰</text><text x="490" y="260" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="middle">CO is a silent poison｜CO 无色无味有毒</text><rect x="60" y="314" width="560" height="58" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="80" y="337" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="start">Safety link｜安全链接: faulty water heaters &amp; idling cars in garages can produce CO.</text><text x="80" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">燃气热水器故障、车库怠速暖车都可能产生 CO——冬季事故高发场景。</text></svg>