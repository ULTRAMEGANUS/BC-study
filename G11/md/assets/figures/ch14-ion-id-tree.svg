<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 346" width="680" height="346"><rect width="680" height="346" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Identifying an Unknown Solution｜未知溶液鉴定流程</text><rect x="240" y="52" width="200" height="40" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.3"/><text x="340" y="77" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="700" text-anchor="middle">unknown solution 未知液</text><line x1="300" y1="92" x2="170" y2="112" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><line x1="380" y1="92" x2="510" y2="112" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><text x="200" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="start">clean wire loop</text><text x="430" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="start">add a few drops of test reagent</text><rect x="60" y="112" width="220" height="46" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="170" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#B7791F" font-weight="700" text-anchor="middle">Flame test 焰色试验</text><text x="170" y="149" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">(Ch.5 electron jumps)</text><text x="110" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">Na⁺</text><text x="170" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="400" text-anchor="start">yellow 黄</text><text x="110" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">K⁺</text><text x="170" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="400" text-anchor="start">lilac 紫</text><text x="110" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">Ca²⁺</text><text x="170" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="400" text-anchor="start">orange-red 橙红</text><text x="110" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="start">Cu²⁺</text><text x="170" y="238" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="400" text-anchor="start">green 绿</text><rect x="400" y="112" width="220" height="46" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="510" y="132" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="middle">Precipitation tests 沉淀检验</text><text x="510" y="149" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">(Ch.12 solubility rules)</text><text x="415" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="start">add Cl⁻(aq)</text><text x="520" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">ppt → Ag⁺ or Pb²⁺</text><text x="415" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="start">add SO₄²⁻(aq)</text><text x="520" y="194" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">ppt → Ba²⁺ or Pb²⁺</text><text x="415" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="start">add OH⁻(aq)</text><text x="520" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">ppt → many metal ions</text><rect x="60" y="268" width="560" height="56" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="80" y="291" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">Combine with titration (Ch.13) for amounts → full analysis 完成定量</text><text x="80" y="311" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">操作规范就是数据可信度：铂丝先洗净、火焰颜色对比钴玻璃看钾。</text></svg>