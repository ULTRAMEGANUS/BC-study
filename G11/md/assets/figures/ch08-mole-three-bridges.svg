<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440"><rect width="680" height="440" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">The Three Bridges｜三桥换算图</text><text x="340" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Everything goes through the mole — never particle-to-mass directly.</text><rect x="40" y="100" width="150" height="92" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.6"/><text x="115.0" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#2B6CB0" font-weight="700" text-anchor="middle">Particles｜粒子</text><text x="115.0" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">atoms, molecules, ions</text><rect x="265" y="100" width="150" height="92" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.6"/><text x="340.0" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#2F855A" font-weight="700" text-anchor="middle">Mole｜摩尔</text><text x="340.0" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">mol</text><rect x="490" y="100" width="150" height="92" rx="10" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.6"/><text x="565.0" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#B7791F" font-weight="700" text-anchor="middle">Mass｜质量</text><text x="565.0" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">grams (g)</text><line x1="194" y1="146.0" x2="261" y2="146.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="227" y="132.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="middle">÷6.02×10²³</text><text x="227" y="178.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">×6.02×10²³</text><line x1="419" y1="146.0" x2="486" y2="146.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="452" y="132.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="middle">× molar mass</text><text x="452" y="178.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">÷ molar mass</text><text x="452" y="194.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">(g/mol)</text><rect x="60" y="226" width="560" height="118" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="80" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">Worked example｜算例：9.6 g of magnesium, how many atoms?</text><text x="80" y="276" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">①  9.6 g Mg × (1 mol Mg / 24.3 g Mg) = 0.395 mol Mg        ← Bridge 2 (÷ molar mass)</text><text x="80" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="start">②  0.395 mol × (6.02×10²³ atoms / 1 mol) = 2.4×10²³ atoms  ← Bridge 1 (× N_A)</text><text x="80" y="324" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="400" text-anchor="start">③  sig figs: 9.6 has 2 s.f. → answer 2.4×10²³ (2 s.f.) ✔</text><rect x="60" y="374" width="560" height="46" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="80" y="393" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#C53030" font-weight="700" text-anchor="start">⛔ Trap：particles ⇄ mass must pass through the mole. There is no direct bridge.</text><text x="80" y="411" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">陷阱：粒子与质量之间必须经过摩尔中转，不存在直达桥。</text></svg>