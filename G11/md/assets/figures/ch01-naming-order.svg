<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 414" width="680" height="414"><rect width="680" height="414" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Naming Order: Inorganic vs Organic｜命名语序对照</text><rect x="40" y="50" width="600" height="128" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="58" y="76" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#C53030" font-weight="700" text-anchor="start">INORGANIC｜无机：语序相反 (reversed)</text><text x="58" y="104" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">NaCl →  English:  sodium chloride     (metal → non-metal-ide)</text><text x="58" y="126" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">            中文：    氯化钠              (非金属 + 化 + 金属)</text><text x="58" y="154" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#C53030" font-weight="600" text-anchor="start">⛔ Wrong｜错误：钠化氯 / sodium monochloride</text><rect x="40" y="194" width="600" height="128" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="58" y="220" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="start">ORGANIC｜有机：语序基本对应 (same order)</text><text x="58" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">CH₃CH₂CH₃ →  English:  propane</text><text x="58" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">                     中文：    丙烷</text><text x="58" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="600" text-anchor="start">2-methylbutane → 2-甲基丁烷　(prefix 位置与中文一致)</text><rect x="40" y="340" width="600" height="58" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="58" y="364" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">📏 Why it differs｜为什么不同</text><text x="58" y="384" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">无机看「二元组成」→ 中英习惯相反；有机看「碳链 + 编号」→ 中英都按位置读。</text></svg>