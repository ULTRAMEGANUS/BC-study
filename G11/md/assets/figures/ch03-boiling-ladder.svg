<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 449" width="680" height="449"><rect width="680" height="449" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Boiling Point Across Families｜同碳数沸点阶梯</text><text x="40" y="46" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">All five compounds below have TWO carbons. Only the functional group changes.</text><text x="40" y="63" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">下面五种化合物都只有 2 个碳——唯一变量是官能团。沸点差异全部来自分子间作用力。</text><rect x="40" y="89" width="600" height="44" rx="6" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.0"/><text x="56" y="109" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">ethane｜乙烷</text><text x="56" y="125" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CH₃CH₃</text><rect x="250" y="99" width="15.782608695652174" height="14" rx="3" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="0"/><text x="273.7826086956522" y="110" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">-89 °C</text><text x="250" y="127" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">dispersion only｜只有色散力</text><rect x="40" y="141" width="600" height="44" rx="6" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.0"/><text x="56" y="161" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">methoxymethane｜甲氧基甲烷</text><text x="56" y="177" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CH₃OCH₃</text><rect x="250" y="151" width="107.6086956521739" height="14" rx="3" fill="#2B6CB0" stroke="#2B6CB0" stroke-width="0"/><text x="365.6086956521739" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">-25 °C</text><text x="250" y="179" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">weak dipole｜弱偶极</text><rect x="40" y="193" width="600" height="44" rx="6" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.0"/><text x="56" y="213" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="700" text-anchor="start">ethanal｜乙醛</text><text x="56" y="229" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CH₃CHO</text><rect x="250" y="203" width="172.17391304347825" height="14" rx="3" fill="#B7791F" stroke="#B7791F" stroke-width="0"/><text x="430.17391304347825" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="700" text-anchor="start">20 °C</text><text x="250" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">strong dipole｜强偶极</text><rect x="40" y="245" width="600" height="44" rx="6" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.0"/><text x="56" y="265" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">ethanol｜乙醇</text><text x="56" y="281" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CH₃CH₂OH</text><rect x="250" y="255" width="255.3913043478261" height="14" rx="3" fill="#2F855A" stroke="#2F855A" stroke-width="0"/><text x="513.3913043478261" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">78 °C</text><text x="250" y="283" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">hydrogen bonding｜氢键</text><rect x="40" y="297" width="600" height="44" rx="6" fill="#FFF5F5" stroke="#C53030" stroke-width="1.0"/><text x="56" y="317" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="start">ethanoic acid｜乙酸</text><text x="56" y="333" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">CH₃COOH</text><rect x="250" y="307" width="312.7826086956522" height="14" rx="3" fill="#C53030" stroke="#C53030" stroke-width="0"/><text x="570.7826086956522" y="318" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="start">118 °C</text><text x="250" y="335" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">H-bond dimers｜氢键二聚体</text><rect x="40" y="355" width="600" height="78" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.2"/><text x="58" y="379" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B46C1" font-weight="700" text-anchor="start">📏 Same carbons, rising boiling point: alkane &lt; ether &lt; aldehyde ≈ ketone &lt; alcohol &lt; acid</text><text x="58" y="401" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">分子间作用力越强，越难把分子拉开 → 沸点越高。氢键（O–H）是这里的转折点：</text><text x="58" y="419" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">从乙醛到乙醇，多了 O–H，沸点从 20 °C 跳到 78 °C。</text></svg>