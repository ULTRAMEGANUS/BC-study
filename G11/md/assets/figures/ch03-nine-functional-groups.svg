<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 461" width="680" height="461"><rect width="680" height="461" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Nine Functional Groups｜九大官能团</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">A functional group is the atom cluster that names the family and sets its properties.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">官能团既决定「叫什么」（后缀/前缀），也决定「什么性质」（极性、氢键、沸点）。</text><rect x="40" y="89" width="600" height="26" rx="6" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="50" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Family｜类别</text><text x="196" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Structure｜结构</text><text x="300" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Naming｜名尾</text><text x="420" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Example｜例</text><rect x="40" y="115" width="600" height="28" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">卤代 halogen</text><text x="196" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–X</text><text x="300" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">chloro- bromo- (prefix)</text><text x="420" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">chloroethane 氯乙烷</text><rect x="40" y="143" width="600" height="28" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">醇 alcohol</text><text x="196" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–OH</text><text x="300" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">-anol (suffix)</text><text x="420" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">ethanol 乙醇</text><rect x="40" y="171" width="600" height="28" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">醚 ether</text><text x="196" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–O–R′</text><text x="300" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">alkoxy- (prefix)</text><text x="420" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">methoxyethane 甲氧基乙烷</text><rect x="40" y="199" width="600" height="28" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="700" text-anchor="start">醛 aldehyde</text><text x="196" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–CHO</text><text x="300" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">-anal (suffix)</text><text x="420" y="218" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">ethanal 乙醛</text><rect x="40" y="227" width="600" height="28" rx="4" fill="#FFFBEB" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="700" text-anchor="start">酮 ketone</text><text x="196" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–CO–R′</text><text x="300" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">-anone (suffix)</text><text x="420" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">propanone 丙酮</text><rect x="40" y="255" width="600" height="28" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="start">羧酸 acid</text><text x="196" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–COOH</text><text x="300" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">-anoic acid (suffix)</text><text x="420" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">ethanoic acid 乙酸</text><rect x="40" y="283" width="600" height="28" rx="4" fill="#F5F0FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#6B46C1" font-weight="700" text-anchor="start">酯 ester</text><text x="196" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–COO–R′</text><text x="300" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">alkyl alkanoate</text><text x="420" y="302" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">methyl ethanoate 乙酸甲酯</text><rect x="40" y="311" width="600" height="28" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">胺 amine</text><text x="196" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–NH₂</text><text x="300" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">-anamine (suffix)</text><text x="420" y="330" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">ethanamine 乙胺</text><rect x="40" y="339" width="600" height="28" rx="4" fill="#F0FFF4" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">酰胺 amide</text><text x="196" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">R–CONH₂</text><text x="300" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">-anamide (suffix)</text><text x="420" y="358" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">ethanamide 乙酰胺</text><rect x="40" y="383" width="600" height="62" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="407" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="600" text-anchor="start">💡 R = any carbon chain｜R 代表任意碳链；R′ = a second, possibly different chain</text><text x="58" y="427" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">记住这条分水岭：拿到名尾定家族，拿到前缀只是「挂件」。</text></svg>