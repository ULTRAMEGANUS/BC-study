<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374"><rect width="680" height="374" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Five Periodic Trends｜五大周期性趋势</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Same map for every trend: what happens across a period, and what happens down a group.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">每条趋势都用同一张地图读：横着（同周期）怎样，竖着（同主族）怎样。</text><rect x="40" y="88" width="600" height="26" rx="6" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="55" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Trend｜趋势</text><text x="250" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Across (L→R)｜横向（左→右）</text><text x="460" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="700" text-anchor="start">Down (T→B)｜纵向（上→下）</text><rect x="40" y="114" width="600" height="32" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="135" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="start">Atomic radius｜原子半径</text><text x="250" y="135" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Decreases｜减小</text><text x="460" y="135" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Increases｜增大</text><rect x="40" y="146" width="600" height="32" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="167" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">Ionization energy｜第一电离能</text><text x="250" y="167" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Increases｜增大</text><text x="460" y="167" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Decreases｜减小</text><rect x="40" y="178" width="600" height="32" rx="4" fill="#F0FFF4" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="199" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2F855A" font-weight="700" text-anchor="start">Electronegativity｜电负性</text><text x="250" y="199" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Increases｜增大</text><text x="460" y="199" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Decreases｜减小</text><rect x="40" y="210" width="600" height="32" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">Metallic character｜金属性</text><text x="250" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Decreases｜减小</text><text x="460" y="231" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Increases｜增大</text><rect x="40" y="242" width="600" height="32" rx="4" fill="#F5F0FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="55" y="263" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#6B46C1" font-weight="700" text-anchor="start">Ionic radius｜离子半径</text><text x="250" y="263" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Cation &lt; atom｜阳离子&lt;原子</text><text x="460" y="263" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Anion &gt; atom｜阴离子&gt;原子</text><text x="40" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Across: same shells, more protons — the pull on outer electrons grows.</text><text x="40" y="308" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Down: new shells added — outer electrons sit farther and are shielded.</text><text x="40" y="324" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">横向：层数不变、核电荷增大 → 对最外层电子的引力增强。</text><text x="40" y="340" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">纵向：层数增多、内层电子把核挡住 → 外层电子被拉得松。</text><text x="40" y="356" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">离子半径一行比较的是「离子 vs 它自己的原子」，不是左右趋势。</text></svg>