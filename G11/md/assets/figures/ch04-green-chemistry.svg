<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 555" width="680" height="555"><rect width="680" height="555" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14.5" fill="#1F2933" font-weight="600" text-anchor="middle">Green Chemistry: Prevention First｜绿色化学：源头预防优先</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">Green chemistry is a DESIGN approach — it starts long before the waste exists.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">绿色化学是一种「设计」思路：在废物产生之前就把它消灭掉，而不是产生后再处理。</text><text x="40" y="91" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">The waste hierarchy｜废物处理优先级（越靠上越好）</text><rect x="40" y="109" width="330" height="34" rx="6" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="56" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="700" text-anchor="start">PREVENT｜预防</text><text x="56" y="138" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">design it out｜从设计上消除</text><rect x="40" y="151" width="270" height="34" rx="6" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.2"/><text x="56" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">REUSE / RECYCLE｜回用</text><text x="56" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">loop the material back｜让材料回流</text><rect x="40" y="193" width="210" height="34" rx="6" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="56" y="208" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#B7791F" font-weight="700" text-anchor="start">TREAT｜处理</text><text x="56" y="222" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">neutralise before release｜排放前处理</text><rect x="40" y="235" width="150" height="34" rx="6" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="56" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="start">DISPOSE｜处置</text><text x="56" y="264" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="start">last resort｜最后手段</text><rect x="40" y="283" width="600" height="26" rx="6" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="50" y="301" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="start">Principle｜原则</text><text x="300" y="301" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="start">What it means in practice｜实际含义</text><rect x="40" y="309" width="600" height="26" rx="4" fill="#F0FFF4" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="327" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">Prevent waste｜预防废物</text><text x="300" y="327" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">design the process so no waste forms</text><rect x="40" y="335" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="353" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">Atom economy｜原子经济</text><text x="300" y="353" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">most reactant atoms end up in the product</text><rect x="40" y="361" width="600" height="26" rx="4" fill="#F0FFF4" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="379" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">Safer solvents｜安全溶剂</text><text x="300" y="379" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">avoid toxic or volatile solvents</text><rect x="40" y="387" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="405" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">Renewable feedstocks｜可再生原料</text><text x="300" y="405" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">start from plants, not petroleum</text><rect x="40" y="413" width="600" height="26" rx="4" fill="#F0FFF4" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="431" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">Catalysis｜催化</text><text x="300" y="431" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">lower energy demand per unit product</text><rect x="40" y="439" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="457" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">Design for degradation｜可降解设计</text><text x="300" y="457" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">the product breaks down after use</text><rect x="40" y="481" width="600" height="58" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="58" y="505" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="600" text-anchor="start">⚠ "Green" is not the same as "recyclable". Prevention beats recycling.</text><text x="58" y="525" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">回收只是第二选择；能在源头不产生废物，才是绿色化学的第一原则。</text></svg>