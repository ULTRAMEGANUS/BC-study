<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540"><rect width="680" height="540" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">From % to Formula｜从百分组成到化学式</text><rect x="70" y="62" width="540" height="58" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/><text x="90" y="86" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="start">1  Assume 100 g sample｜设样品 100 g</text><text x="90" y="107" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="400" text-anchor="start">% → grams directly：27.3 % C → 27.3 g C</text><line x1="340" y1="120" x2="340" y2="142" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="142" width="540" height="58" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="90" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="start">2  Convert each mass to moles｜各质量换摩尔</text><text x="90" y="187" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="400" text-anchor="start">g ÷ molar mass = mol（C: 27.3/12.01 = 2.27）</text><line x1="340" y1="200" x2="340" y2="222" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="222" width="540" height="58" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="90" y="246" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#B7791F" font-weight="700" text-anchor="start">3  Divide by the smallest｜除以最小值</text><text x="90" y="267" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="400" text-anchor="start">2.27 / 2.27 = 1 ; 5.44 / 2.27 = 2.4</text><line x1="340" y1="280" x2="340" y2="302" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="302" width="540" height="58" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.4"/><text x="90" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#6B46C1" font-weight="700" text-anchor="start">4  Clear fractions to whole numbers｜清分数</text><text x="90" y="347" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="400" text-anchor="start">×5 → 5 : 12 → empirical formula C₅H₁₂</text><line x1="340" y1="364" x2="340" y2="394" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><line x1="200" y1="394" x2="480" y2="394" stroke="#52606D" stroke-width="1.6"/><line x1="200" y1="394" x2="200" y2="416" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><line x1="480" y1="394" x2="480" y2="416" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><rect x="70" y="416" width="260" height="74" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="200" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="middle">Empirical formula｜实验式</text><text x="200" y="464" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">simplest whole-number ratio</text><text x="200" y="480" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">C₅H₁₂</text><rect x="350" y="416" width="260" height="74" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="480" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="middle">Molecular formula｜分子式</text><text x="480" y="464" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">= empirical × n   (n = M / M_empirical)</text><text x="480" y="480" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="700" text-anchor="middle">M = 72 → n = 72/72 = 1 → C₅H₁₂</text><text x="340" y="516" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Example chain: CH₂ (empirical) × 6 → C₆H₁₂ (molecular, if M = 84)</text></svg>