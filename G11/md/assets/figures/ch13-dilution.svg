<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 374" width="680" height="374"><rect width="680" height="374" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Dilution: Add Water, Not Molecules｜稀释：加水不加分子</text><rect x="70" y="58" width="120" height="110" rx="4" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.6"/><rect x="73" y="80.0" width="114" height="85.0" rx="2" fill="#EBF4FF" stroke="none" stroke-width="0"/><circle cx="90" cy="95.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="115" cy="110.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="140" cy="98.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="100" cy="122.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="130" cy="128.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="155" cy="115.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="165" cy="95.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="85" cy="115.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="120" cy="92.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="150" cy="135.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="95" cy="135.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="135" cy="105.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><text x="130.0" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">Stock 储备液</text><text x="130.0" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">C₁ = 1.0 mol/L, V₁ = 100 mL</text><rect x="470" y="58" width="120" height="110" rx="4" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.6"/><rect x="473" y="80.0" width="114" height="85.0" rx="2" fill="#FEF3E0" stroke="none" stroke-width="0"/><circle cx="490" cy="95.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="515" cy="110.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="540" cy="98.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="500" cy="122.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="530" cy="128.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="555" cy="115.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="565" cy="95.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="485" cy="115.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="520" cy="92.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="550" cy="135.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="495" cy="135.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><circle cx="535" cy="105.0" r="3.2" fill="#1F2933" stroke="#1F2933" stroke-width="0.8"/><text x="530.0" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">Diluted 稀释液</text><text x="530.0" y="206" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">C₂ = 0.25 mol/L, V₂ = 400 mL</text><line x1="210" y1="113" x2="450" y2="113" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)"/><text x="330" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">+ water 加水</text><text x="330" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">400 mL total</text><rect x="55" y="224" width="570" height="70" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="75" y="250" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="start">C₁V₁ = C₂V₂      →      V₂ = C₁V₁ / C₂ = (1.0)(100) / 0.25 = 400 mL</text><text x="75" y="274" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">Units just have to match on both sides (mL with mL) — no need to convert to L.</text><rect x="55" y="310" width="570" height="44" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="75" y="329" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#C53030" font-weight="700" text-anchor="start">Same molecules, bigger volume → lower concentration. Diluting never destroys solute.</text><text x="75" y="347" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">分子数不变、体积变大 → 浓度变小。稀释前后溶质的量（mol）恒等。</text></svg>