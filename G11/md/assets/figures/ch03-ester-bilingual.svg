<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 501" width="680" height="501"><rect width="680" height="501" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14.5" fill="#1F2933" font-weight="600" text-anchor="middle">Ester Naming: Two Languages, Two Orders｜酯的英中语序陷阱</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">This is the ONE place in organic chemistry where English and Chinese run in opposite directions.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">这是有机化学里唯一一处英中语序「相反」的地方——其余官能团都是同向的。</text><rect x="40" y="91" width="600" height="60" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="58" y="117" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2B6CB0" font-weight="700" text-anchor="start">English order｜英文语序</text><text x="58" y="139" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="600" text-anchor="start">ALCOHOL part  +  ACID part</text><text x="622" y="131" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="end">→  methyl ethanoate</text><rect x="40" y="163" width="600" height="60" rx="10" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="58" y="189" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#C53030" font-weight="700" text-anchor="start">Chinese order｜中文语序</text><text x="58" y="211" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="600" text-anchor="start">ACID part  +  ALCOHOL part</text><text x="622" y="203" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="700" text-anchor="end">→  乙酸甲酯</text><rect x="40" y="235" width="600" height="158" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="58" y="261" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">Decoding｜逐词拆解</text><text x="58" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">methyl ethanoate</text><text x="230" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">methyl = 甲（醇部分）</text><text x="400" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">ethanoate = 乙酸（酸部分）</text><text x="622" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#6B46C1" font-weight="700" text-anchor="end">乙酸甲酯</text><line x1="58" y1="297" x2="622" y2="297" stroke="#D6BCFA" stroke-width="1.0" stroke-dasharray="3,3"/><text x="58" y="319" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">ethyl methanoate</text><text x="230" y="319" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">ethyl = 乙（醇部分）</text><text x="400" y="319" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">methanoate = 甲酸（酸部分）</text><text x="622" y="319" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#6B46C1" font-weight="700" text-anchor="end">甲酸乙酯</text><text x="58" y="359" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">换成中文：把两部分**颠倒**过来念——acid first, then alcohol.</text><rect x="40" y="409" width="600" height="76" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="433" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">🔭 Extension｜超纲【Extension → Chemistry 12】</text><text x="58" y="453" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Esters form from an acid + an alcohol (esterification). The REACTION belongs to Chemistry 12 —</text><text x="58" y="471" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">this chapter only names and recognises them.  本章只做命名与识别，不写酯化反应式。</text></svg>