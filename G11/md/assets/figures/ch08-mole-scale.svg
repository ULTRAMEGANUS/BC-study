<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 482" width="680" height="482"><rect width="680" height="482" fill="#FFFFFF"/><text x="340" y="34" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">One Mole on the Lab Bench｜一摩尔的分量</text><text x="340" y="60" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">All five samples contain 6.02×10²³ particles — only the masses differ.</text><rect x="55" y="80" width="570" height="52" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="80" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="start">1 mol</text><text x="140" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">C (graphite)｜碳</text><text x="360" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">12.01 g</text><text x="455" y="106" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">a small spoonful</text><rect x="55" y="142" width="570" height="52" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="80" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="start">1 mol</text><text x="140" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">H₂O｜水</text><text x="360" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">18.02 g</text><text x="455" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">18 mL — one large gulp</text><rect x="55" y="204" width="570" height="52" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="80" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#B7791F" font-weight="700" text-anchor="start">1 mol</text><text x="140" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">NaCl｜氯化钠</text><text x="360" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">58.44 g</text><text x="455" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">about 3 tablespoons</text><rect x="55" y="266" width="570" height="52" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="80" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#6B46C1" font-weight="700" text-anchor="start">1 mol</text><text x="140" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">S (sulfur)｜硫</text><text x="360" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">32.06 g</text><text x="455" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">a heaped teaspoon</text><rect x="55" y="328" width="570" height="52" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.3"/><text x="80" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#C53030" font-weight="700" text-anchor="start">1 mol</text><text x="140" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">Cu (copper)｜铜</text><text x="360" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">63.55 g</text><text x="455" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">a short cube, 2.3 cm</text><rect x="55" y="398" width="570" height="64" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="75" y="422" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="start">Same count, different mass｜数量相同、质量不同</text><text x="75" y="443" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">1 mol of anything = 6.02×10²³ particles. Its mass in grams = its molar mass.</text></svg>