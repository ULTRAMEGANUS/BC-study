<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320"><rect width="680" height="320" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Percent Purity｜百分纯度</text><text x="340" y="56" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Real samples are never 100% pure. Only the pure part reacts.</text><rect x="55" y="76" width="490.2" height="44" rx="0" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="300.1" y="103.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="middle">pure substance 纯物质  86%</text><rect x="545.2" y="76" width="79.80000000000001" height="44" rx="0" fill="#FFF5F5" stroke="#C53030" stroke-width="1.4"/><text x="585.1" y="103.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#C53030" font-weight="700" text-anchor="middle">impurity</text><text x="340" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">sample total mass 样品总质量 = 100%</text><text x="340" y="164" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">% purity = mass of pure substance / mass of sample × 100%</text><text x="340" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="400" text-anchor="middle">stoichiometry uses ONLY the pure part:  mass pure = % purity × sample mass</text><text x="340" y="216" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">Example: 5.00 g ore at 86.0% → 4.30 g real Zn → 4.30 / 65.38 = 0.0658 mol Zn</text><rect x="55" y="254" width="570" height="46" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="75" y="273" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#B7791F" font-weight="700" text-anchor="start">Purity ≠ concentration ≠ yield — three different ratios, keep them straight.</text><text x="75" y="291" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">纯度、浓度、产率是三个不同的比值，考试最易混。</text></svg>