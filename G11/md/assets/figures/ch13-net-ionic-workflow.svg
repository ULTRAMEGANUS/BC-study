<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464"><rect width="680" height="464" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Net Ionic Equations in 4 Steps｜净离子方程式四步</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">AgNO₃(aq) + NaCl(aq) → AgCl(s) + NaNO₃(aq)</text><rect x="50" y="78" width="580" height="60" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="70" y="102" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">1  Balance the formula equation</text><text x="70" y="123" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">先配平分子方程式（此处已平）</text><rect x="50" y="148" width="580" height="60" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="70" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2F855A" font-weight="700" text-anchor="start">2  Split ONLY strong aqueous electrolytes into ions</text><text x="70" y="193" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ag⁺ + NO₃⁻ + Na⁺ + Cl⁻ → AgCl(s) + Na⁺ + NO₃⁻   (AgCl 固体不拆)</text><rect x="50" y="218" width="580" height="60" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="70" y="242" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="start">3  Cancel spectator ions appearing on both sides</text><text x="70" y="263" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Na⁺ 与 NO₃⁻ 两边都在 → 划掉（spectator ions 旁观离子）</text><rect x="50" y="288" width="580" height="60" rx="8" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="70" y="312" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#6B46C1" font-weight="700" text-anchor="start">4  Check atoms AND charge</text><text x="70" y="333" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="400" text-anchor="start">Ag⁺(aq) + Cl⁻(aq) → AgCl(s)   charge +1 + (−1) = 0 ✔</text><rect x="50" y="362" width="580" height="62" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="70" y="386" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">The net ionic equation shows the actual chemistry: only Ag⁺ meets Cl⁻.</text><text x="70" y="408" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">Na⁺ 和 NO₃⁻ 只是“围观群众”——换一对旁观离子，反应照样发生。</text><text x="340" y="442" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">Charge check catches most errors: left +1 + (−1) = 0 = right. 电荷守恒自查。</text></svg>