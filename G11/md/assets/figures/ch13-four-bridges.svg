<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340"><rect width="680" height="340" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker></defs><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">The Solution Four Bridges｜溶液版四桥图</text><rect x="40" y="58" width="130" height="84" rx="10" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.5"/><text x="105.0" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#B7791F" font-weight="700" text-anchor="middle">Mass｜质量</text><text x="105.0" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">grams</text><rect x="205" y="58" width="130" height="84" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.5"/><text x="270.0" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2F855A" font-weight="700" text-anchor="middle">Mole｜摩尔</text><text x="270.0" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">mol</text><rect x="375" y="58" width="130" height="84" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.5"/><text x="440.0" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Molarity｜浓度</text><text x="440.0" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">mol/L</text><rect x="535" y="58" width="130" height="84" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.5"/><text x="600.0" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#6B46C1" font-weight="700" text-anchor="middle">Volume｜体积</text><text x="600.0" y="116" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="middle">L (or mL)</text><line x1="174" y1="100.0" x2="201" y2="100.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="187" y="88.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="700" text-anchor="middle">×M</text><text x="187" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">÷M</text><line x1="339" y1="100.0" x2="371" y2="100.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="355" y="88.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#1F2933" font-weight="700" text-anchor="middle">×V</text><text x="355" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">÷V</text><line x1="509" y1="100.0" x2="531" y2="100.0" stroke="#52606D" stroke-width="1.6" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="520" y="88.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#1F2933" font-weight="700" text-anchor="middle">×1000</text><text x="520" y="124.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9" fill="#52606D" font-weight="400" text-anchor="middle">÷1000</text><rect x="40" y="162" width="600" height="74" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.2"/><text x="60" y="186" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="start">M = mol ÷ V(L)   ↔   mol = M × V(L)</text><text x="60" y="210" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">Everything you did in Ch.8–10 still works — you just reach the mole through M×V now.</text><rect x="40" y="254" width="600" height="64" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="60" y="278" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#2F855A" font-weight="700" text-anchor="start">Solution stoichiometry:  M·V of A → mol A → mole ratio → mol B → M·V of B</text><text x="60" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">与 Ch.10 四步完全同构，只是上下桥换成了浓度与体积。</text></svg>