<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 444" width="680" height="444"><rect width="680" height="444" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Structural Isomers｜结构异构体</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#52606D" font-weight="400" text-anchor="start">Same molecular formula, different connectivity — so different properties.</text><text x="40" y="68" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">分子式相同、连接方式不同——因此性质也不同（沸点、熔点、反应性都会有差异）。</text><rect x="40" y="96" width="600" height="118" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="58" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="start">C₄H₁₀  →  TWO isomers｜两种</text><text x="58" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="600" text-anchor="start">butane｜正丁烷</text><text x="58" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">CH₃CH₂CH₂CH₃</text><text x="58" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">bp −0.5 °C</text><text x="370" y="146" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="600" text-anchor="start">2-methylpropane (isobutane)｜异丁烷</text><text x="370" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">CH₃CH(CH₃)CH₃</text><text x="370" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">bp −11.7 °C</text><rect x="40" y="226" width="600" height="128" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="58" y="252" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="start">C₅H₁₂  →  THREE isomers｜三种</text><text x="58" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">pentane｜正戊烷</text><text x="58" y="304" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="start">CH₃CH₂CH₂CH₂CH₃</text><text x="58" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">bp 36 °C</text><text x="258" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">2-methylbutane｜异戊烷</text><text x="258" y="304" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="start">CH₃CH(CH₃)CH₂CH₃</text><text x="258" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">bp 28 °C</text><text x="458" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="600" text-anchor="start">2,2-dimethylpropane｜新戊烷</text><text x="458" y="304" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="500" text-anchor="start">C(CH₃)₄</text><text x="458" y="326" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">bp 10 °C</text><rect x="40" y="370" width="600" height="58" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.2"/><text x="58" y="394" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="600" text-anchor="start">📏 As branching increases, boiling point DECREASES.</text><text x="58" y="414" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">支链越多，分子越「圆」、接触面越小 → 色散力越弱 → 沸点越低（预埋 Ch.7）。</text></svg>