<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390"><rect width="680" height="390" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">Limiting Reagent: Run Both Assumptions｜限量试剂：双假设法</text><text x="340" y="54" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="middle">4.0 g H₂ + 32.0 g O₂ burn to water. Which runs out first?  (2 H₂ + O₂ → 2 H₂O)</text><rect x="45" y="74" width="285" height="130" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.4"/><text x="187" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Assume ALL the H₂ reacts</text><text x="187" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="middle">4.0 g ÷ 2.016 = 1.98 mol H₂</text><text x="187" y="144" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">→ 1.98 mol H₂O</text><text x="187" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">(ratio 2 : 2 = 1)</text><text x="187" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">product possible: 1.98 mol</text><rect x="350" y="74" width="285" height="130" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.4"/><text x="492" y="98" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#B7791F" font-weight="700" text-anchor="middle">Assume ALL the O₂ reacts</text><text x="492" y="122" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#1F2933" font-weight="400" text-anchor="middle">32.0 g ÷ 32.00 = 1.00 mol O₂</text><text x="492" y="144" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="700" text-anchor="middle">→ 2.00 mol H₂O</text><text x="492" y="168" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#52606D" font-weight="400" text-anchor="middle">(ratio 1 : 2)</text><text x="492" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="700" text-anchor="middle">product possible: 2.00 mol</text><rect x="45" y="224" width="590" height="78" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.4"/><text x="340" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13.5" fill="#2F855A" font-weight="700" text-anchor="middle">SMALLER product wins → H₂ is limiting｜取小值 → H₂ 限量</text><text x="340" y="272" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="middle">Theoretical yield = 1.98 mol H₂O × 18.02 g/mol = 35.7 g H₂O (3 s.f.)</text><text x="340" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">Leftover O₂: 1.00 − 1.98/2 = 0.01 mol unused｜O₂ 剩 0.01 mol</text><rect x="45" y="324" width="590" height="46" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="65" y="343" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#C53030" font-weight="700" text-anchor="start">⛔ Whichever reactant makes LESS product is limiting — compute yield from IT only.</text><text x="65" y="361" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">产量算小的那个（限量试剂）；过量试剂的量只能用来算剩余。</text></svg>