<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 398" width="680" height="398"><rect width="680" height="398" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Three Ways to Write the Same Molecule｜同一个分子的三种写法</text><rect x="40" y="52" width="600" height="78" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="58" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="start">Molecular｜分子式</text><text x="58" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="600" text-anchor="start">C₄H₁₀</text><text x="320" y="80" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">只给原子种类与个数；看不出结构</text><text x="560" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">C=4  H=10</text><rect x="40" y="142" width="600" height="78" rx="10" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="58" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2F855A" font-weight="700" text-anchor="start">Condensed｜凝聚结构式</text><text x="58" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="600" text-anchor="start">CH₃CH₂CH₂CH₃</text><text x="320" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">按连接顺序写出各基团</text><text x="520" y="198" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#1F2933" font-weight="500" text-anchor="start">CH₃-CH₂-CH₂-CH₃</text><rect x="40" y="232" width="600" height="78" rx="10" fill="#F5F0FF" stroke="#6B46C1" stroke-width="1.3"/><text x="58" y="260" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#6B46C1" font-weight="700" text-anchor="start">Skeletal｜骨架式</text><text x="58" y="288" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="600" text-anchor="start">(zig-zag line)</text><text x="320" y="260" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">只画碳骨架，顶点=碳，氢省略</text><line x1="500" y1="288" x2="535" y2="262" stroke="#1F2933" stroke-width="2"/><line x1="535" y1="262" x2="570" y2="288" stroke="#1F2933" stroke-width="2"/><line x1="570" y1="288" x2="605" y2="262" stroke="#1F2933" stroke-width="2"/><line x1="605" y1="262" x2="640" y2="288" stroke="#1F2933" stroke-width="2"/><circle cx="500" cy="288" r="3" fill="#1F2933" stroke="#1F2933" stroke-width="1"/><circle cx="535" cy="262" r="3" fill="#1F2933" stroke="#1F2933" stroke-width="1"/><circle cx="570" cy="288" r="3" fill="#1F2933" stroke="#1F2933" stroke-width="1"/><circle cx="605" cy="262" r="3" fill="#1F2933" stroke="#1F2933" stroke-width="1"/><circle cx="640" cy="288" r="3" fill="#1F2933" stroke="#1F2933" stroke-width="1"/><rect x="40" y="322" width="600" height="60" rx="8" fill="#FFF5F5" stroke="#C53030" stroke-width="1.2"/><text x="58" y="346" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#C53030" font-weight="600" text-anchor="start">⚠ Molecular formula alone is NOT enough to identify a compound.</text><text x="58" y="366" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">只看分子式认不出物质——C₄H₁₀ 有两种不同的结构（见后页异构体）。</text></svg>