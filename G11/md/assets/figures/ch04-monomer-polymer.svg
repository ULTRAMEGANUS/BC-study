<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 507" width="680" height="507"><rect width="680" height="507" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Monomer → Polymer｜单体 → 聚合物</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#52606D" font-weight="400" text-anchor="start">A monomer is one small building unit; a polymer is many of them joined into a chain.</text><text x="40" y="65" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">单体是小单元，聚合物是成千上万个单体连成的长链——链越长，塑料越强韧。</text><rect x="40" y="91" width="600" height="128" rx="10" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="58" y="117" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12.5" fill="#2B6CB0" font-weight="700" text-anchor="start">ethene｜乙烯  →  polyethene (PE)｜聚乙烯</text><text x="58" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">CH₂=CH₂</text><text x="140" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#52606D" font-weight="700" text-anchor="start">+</text><text x="160" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">CH₂=CH₂</text><text x="250" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#52606D" font-weight="700" text-anchor="start">+</text><text x="270" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="12" fill="#1F2933" font-weight="700" text-anchor="start">CH₂=CH₂</text><text x="360" y="141" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#52606D" font-weight="700" text-anchor="start">…</text><text x="58" y="167" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">↓  the C=C opens, each carbon links to the next ｜C=C 打开，逐个相连</text><text x="58" y="191" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="600" text-anchor="start">—CH₂—CH₂—CH₂—CH₂—CH₂—CH₂—CH₂—CH₂—   (a very long chain)</text><text x="58" y="211" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">n 个单体重复 → 一条链；n 可以到几万。</text><rect x="40" y="235" width="600" height="26" rx="6" fill="#F0F4F8" stroke="#CBD2D9" stroke-width="1.0"/><text x="50" y="253" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="start">Code｜编号</text><text x="150" y="253" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="start">Polymer｜聚合物</text><text x="300" y="253" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="start">Made from｜单体</text><text x="460" y="253" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="start">Typical use｜常见用途</text><rect x="40" y="261" width="600" height="26" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="279" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">1 PET</text><text x="150" y="279" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">polyethene terephthalate</text><text x="460" y="279" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">饮料瓶、涤纶纤维</text><rect x="40" y="287" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="305" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">2 HDPE</text><text x="150" y="305" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">high-density polyethene</text><text x="460" y="305" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">牛奶桶、洗涤剂瓶</text><rect x="40" y="313" width="600" height="26" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">3 PVC</text><text x="150" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">polyvinyl chloride</text><text x="460" y="331" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">管道、电缆绝缘</text><rect x="40" y="339" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="357" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">4 LDPE</text><text x="150" y="357" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">low-density polyethene</text><text x="460" y="357" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">保鲜膜、塑料袋</text><rect x="40" y="365" width="600" height="26" rx="4" fill="#EBF4FF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="383" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">5 PP</text><text x="150" y="383" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">polypropene</text><text x="460" y="383" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">餐盒、绳、汽车部件</text><rect x="40" y="391" width="600" height="26" rx="4" fill="#FFFFFF" stroke="#E1E7EC" stroke-width="0.8"/><text x="50" y="409" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2B6CB0" font-weight="700" text-anchor="start">6 PS</text><text x="150" y="409" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="start">polystyrene</text><text x="460" y="409" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">泡沫塑料、杯</text><rect x="40" y="433" width="600" height="58" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.2"/><text x="58" y="457" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#2F855A" font-weight="600" text-anchor="start">📏 A polymer's properties come from chain length, branching and the forces BETWEEN chains.</text><text x="58" y="477" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="start">链间作用力（Ch.7 的分子间力）决定熔点、硬度与可回收性——不是靠分子内共价键。</text></svg>