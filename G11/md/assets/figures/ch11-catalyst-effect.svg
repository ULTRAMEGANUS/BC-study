<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 378" width="680" height="378"><rect width="680" height="378" fill="#FFFFFF"/><text x="340" y="32" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#1F2933" font-weight="700" text-anchor="middle">What a Catalyst Changes｜催化剂改变了什么</text><line x1="70" y1="54" x2="70" y2="238" stroke="#52606D" stroke-width="1.4"/><line x1="70" y1="238" x2="610" y2="238" stroke="#52606D" stroke-width="1.4"/><text x="62" y="66" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="700" text-anchor="end">E</text><text x="606" y="254" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="end">reaction progress 反应进程</text><path d="M 70,118 L 210,118 L 320,70 L 430,168 L 610,168" fill="none" stroke="#C53030" stroke-width="2.2"/><path d="M 70,118 L 210,118 L 320,110 L 430,168 L 610,168" fill="none" stroke="#2F855A" stroke-width="2.2"/><text x="320" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#C53030" font-weight="700" text-anchor="middle">no catalyst</text><text x="390" y="124" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="start">with catalyst</text><text x="76" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="start">reactants</text><text x="604" y="184" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10" fill="#1F2933" font-weight="700" text-anchor="end">products</text><line x1="570" y1="118" x2="570" y2="168" stroke="#1F2933" stroke-width="1.6"/><text x="564" y="147.0" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="700" text-anchor="end">ΔH same｜ΔH 不变</text><rect x="45" y="274" width="186" height="58" rx="8" fill="#F0FFF4" stroke="#2F855A" stroke-width="1.3"/><text x="138.0" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2F855A" font-weight="700" text-anchor="middle">Lowers activation energy</text><text x="138.0" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">降低活化能</text><rect x="243" y="274" width="186" height="58" rx="8" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.3"/><text x="336.0" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">Does NOT change ΔH</text><text x="336.0" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">不改变始末能量差</text><rect x="441" y="274" width="186" height="58" rx="8" fill="#FFFBEB" stroke="#B7791F" stroke-width="1.3"/><text x="534.0" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#B7791F" font-weight="700" text-anchor="middle">Speeds the reaction, not the yield</text><text x="534.0" y="316" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#1F2933" font-weight="400" text-anchor="middle">只加速，不加产</text><text x="340" y="354" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="10.5" fill="#52606D" font-weight="400" text-anchor="middle">A tunnel through the mountain is still the same mountain — start and end are identical.</text></svg>