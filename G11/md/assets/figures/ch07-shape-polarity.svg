<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316"><rect width="680" height="316" fill="#FFFFFF"/><text x="340.0" y="26" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#1F2933" font-weight="600" text-anchor="middle">Shape Decides Polarity｜形状决定分子极性</text><text x="40" y="48" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">Bond dipoles are arrows. If the shape is symmetric, the arrows cancel.</text><text x="40" y="64" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11.5" fill="#52606D" font-weight="400" text-anchor="start">键偶极是箭头：形状对称则互相抵消，不对称则留下净偶极。</text><text x="130" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="700" text-anchor="middle">CO₂</text><text x="295" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="700" text-anchor="middle">H₂O</text><text x="465" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="700" text-anchor="middle">CH₄</text><text x="618" y="94" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#1F2933" font-weight="700" text-anchor="middle">NH₃</text><text x="68" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">O</text><text x="130" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">C</text><text x="192" y="156" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">O</text><line x1="76" y1="152" x2="118" y2="152" stroke="#1F2933" stroke-width="1.6"/><line x1="142" y1="152" x2="184" y2="152" stroke="#1F2933" stroke-width="1.6"/><text x="40" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="middle">←</text><text x="220" y="130" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#2B6CB0" font-weight="700" text-anchor="middle">→</text><text x="130" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">arrows cancel｜抵消</text><text x="295" y="134" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">O</text><text x="249" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="341" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><line x1="283" y1="140" x2="255" y2="166" stroke="#1F2933" stroke-width="1.6"/><line x1="307" y1="140" x2="335" y2="166" stroke="#1F2933" stroke-width="1.6"/><text x="295" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#C53030" font-weight="600" text-anchor="middle">↑ net dipole｜净偶极朝 O</text><text x="295" y="190" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">bent｜角形，不对称</text><text x="465" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="415" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="515" y="166" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="479" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="465" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">C</text><line x1="459" y1="152" x2="421" y2="162" stroke="#1F2933" stroke-width="1.6"/><line x1="471" y1="152" x2="509" y2="162" stroke="#1F2933" stroke-width="1.6"/><line x1="465" y1="148" x2="465" y2="146" stroke="#1F2933" stroke-width="1.6"/><line x1="471" y1="166" x2="477" y2="186" stroke="#1F2933" stroke-width="1.6"/><text x="465" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">tetrahedral｜四面体对称</text><text x="618" y="136" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="700" text-anchor="middle">N</text><text x="578" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="658" y="174" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><text x="618" y="196" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="13" fill="#1F2933" font-weight="600" text-anchor="middle">H</text><line x1="606" y1="142" x2="584" y2="168" stroke="#1F2933" stroke-width="1.6"/><line x1="630" y1="142" x2="652" y2="168" stroke="#1F2933" stroke-width="1.6"/><line x1="618" y1="148" x2="618" y2="186" stroke="#1F2933" stroke-width="1.6"/><text x="618" y="114" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#C53030" font-weight="600" text-anchor="middle">.. ｜净偶极朝 N</text><text x="618" y="214" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#52606D" font-weight="400" text-anchor="middle">pyramidal｜三角锥</text><rect x="68" y="232" width="124" height="22" rx="11" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.0"/><text x="130" y="247" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">NON-POLAR｜非极性</text><rect x="233" y="232" width="124" height="22" rx="11" fill="#FFF5F5" stroke="#C53030" stroke-width="1.0"/><text x="295" y="247" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#C53030" font-weight="700" text-anchor="middle">POLAR｜极性</text><rect x="403" y="232" width="124" height="22" rx="11" fill="#EBF4FF" stroke="#2B6CB0" stroke-width="1.0"/><text x="465" y="247" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#2B6CB0" font-weight="700" text-anchor="middle">NON-POLAR｜非极性</text><rect x="556" y="232" width="124" height="22" rx="11" fill="#FFF5F5" stroke="#C53030" stroke-width="1.0"/><text x="618" y="247" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="9.5" fill="#C53030" font-weight="700" text-anchor="middle">POLAR｜极性</text><text x="40" y="266" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">Bond polarity is necessary but not sufficient — a symmetric shape can cancel it.</text><text x="40" y="282" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#52606D" font-weight="400" text-anchor="start">键有极性是必要条件，不是充分条件——对称形状可以把它整个抵消掉。</text><text x="40" y="298" font-family="'Segoe UI','Helvetica Neue',Arial,'Microsoft YaHei',sans-serif" font-size="11" fill="#1F2933" font-weight="600" text-anchor="start">先判键（ΔEN），再判形（VSEPR），最后合成分子极性——三步缺一不可。</text></svg>