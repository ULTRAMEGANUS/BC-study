<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 506" width="900"
     height="506" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 8-3　WHMIS Pictograms at a Glance｜WHMIS 安全标识速览</title>
  <rect width="900" height="506" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 8-3　WHMIS Pictograms at a Glance｜WHMIS 安全标识速览</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">know before you enter｜进实验室前先认全</text>
  <rect x="24" y="54" width="852" height="32" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="70" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">WHMIS 2015 (GHS) — 8 pictograms on every chemical container｜八种标识，看到就要知道它警告什么</text>
  <rect x="23" y="98" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M123.0 110.0 L161.0 148.0 L123.0 186.0 L85.0 148.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <path d="M123.0 126.0 C129.0 137.0 135.0 143.0 135.0 151.0 C135.0 159.0 129.0 165.0 123.0 165.0 C117.0 165.0 111.0 159.0 111.0 151.0 C111.0 145.0 118.0 139.0 123.0 126.0 Z" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
  <path d="M123.0 161.0 C117.0 156.0 118.0 149.0 123.0 142.0 C128.0 149.0 129.0 156.0 123.0 161.0 Z" fill="none" stroke="#2C2C2A" stroke-width="1.0"/>
  <text x="123.0" y="206" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Flammable</text>
  <text x="123.0" y="224" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">易燃</text>
  <text x="123.0" y="242" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">catches fire easily｜易着火</text>
  <rect x="241" y="98" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M341.0 110.0 L379.0 148.0 L341.0 186.0 L303.0 148.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <path d="M324.0 130.0 L335.0 144.0 L341.0 139.0 L330.0 125.0 Z" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <circle cx="339.0" cy="149" r="2.6" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.5"/>
  <circle cx="342.0" cy="155" r="2.2" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.5"/>
  <line x1="323.0" y1="160" x2="359.0" y2="160" stroke="#2C2C2A" stroke-width="1.8"/>
  <path d="M338.0 160.0 L340.0 165.0 L343.0 161.0 L345.0 165.0" fill="none" stroke="#2C2C2A" stroke-width="1.2"/>
  <text x="341.0" y="206" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Corrosive</text>
  <text x="341.0" y="224" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">腐蚀</text>
  <text x="341.0" y="242" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">eats skin and metal｜伤皮肤、蚀金属</text>
  <rect x="459" y="98" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M559.0 110.0 L597.0 148.0 L559.0 186.0 L521.0 148.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <line x1="544.0" y1="161" x2="574.0" y2="137" stroke="#2C2C2A" stroke-width="2.0"/>
  <line x1="544.0" y1="137" x2="574.0" y2="161" stroke="#2C2C2A" stroke-width="2.0"/>
  <circle cx="559.0" cy="145" r="12" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.8"/>
  <circle cx="554.0" cy="143" r="2.8" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.3"/>
  <circle cx="564.0" cy="143" r="2.8" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.3"/>
  <path d="M552.0 157.0 V165.0 H566.0 V157.0 H562.0 V165.0 H556.0 V157.0" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <text x="559.0" y="206" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Toxic</text>
  <text x="559.0" y="224" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">有毒</text>
  <text x="559.0" y="242" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">can kill at low dose｜少量即致命</text>
  <rect x="677" y="98" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M777.0 110.0 L815.0 148.0 L777.0 186.0 L739.0 148.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <circle cx="777.0" cy="154" r="13" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M777.0 124.0 C781.0 132.0 784.0 136.0 784.0 140.0 C784.0 144.0 781.0 146.0 777.0 146.0 C773.0 146.0 770.0 144.0 770.0 140.0 C770.0 137.0 774.0 133.0 777.0 124.0 Z" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <text x="777.0" y="206" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Oxidizing</text>
  <text x="777.0" y="224" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">氧化性</text>
  <text x="777.0" y="242" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">feeds fire, no flame needed｜助燃</text>
  <rect x="23" y="276" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M123.0 288.0 L161.0 326.0 L123.0 364.0 L85.0 326.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <rect x="113.0" y="312" width="20" height="32" rx="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.8"/>
  <rect x="119.0" y="305" width="8" height="7" rx="2" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.5"/>
  <line x1="113.0" y1="324" x2="133.0" y2="324" stroke="#2C2C2A" stroke-width="1.0"/>
  <text x="123.0" y="384" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Compressed Gas</text>
  <text x="123.0" y="402" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">压缩气体</text>
  <text x="123.0" y="420" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">cylinder under pressure｜高压钢瓶</text>
  <rect x="241" y="276" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M341.0 288.0 L379.0 326.0 L341.0 364.0 L303.0 326.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <circle cx="331.0" cy="319" r="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.6"/>
  <circle cx="331.0" cy="319" r="2.4" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.3"/>
  <circle cx="351.0" cy="319" r="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.6"/>
  <circle cx="351.0" cy="319" r="2.4" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.3"/>
  <circle cx="341.0" cy="338" r="7" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.6"/>
  <circle cx="341.0" cy="338" r="2.4" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.3"/>
  <circle cx="341.0" cy="327" r="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="341.0" y="384" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Biohazard</text>
  <text x="341.0" y="402" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">生物危害</text>
  <text x="341.0" y="420" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">infectious material｜可致病生物材料</text>
  <rect x="459" y="276" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M559.0 288.0 L597.0 326.0 L559.0 364.0 L521.0 326.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <line x1="559.0" y1="342" x2="559.0" y2="324" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M559.0 306.0 L568.0 320.0 L563.0 320.0 L571.0 331.0 L547.0 331.0 L555.0 320.0 Z" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
  <path d="M541.0 344.0 Q547.0 339.0 553.0 344.0 T565.0 344.0" fill="none" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="559.0" y="384" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Environmental Hazard</text>
  <text x="559.0" y="402" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">环境危害</text>
  <text x="559.0" y="420" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">harmful to water life｜危害水生生物</text>
  <rect x="677" y="276" width="200" height="158" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M777.0 288.0 L815.0 326.0 L777.0 364.0 L739.0 326.0 Z" fill="none" stroke="#A32D2D" stroke-width="3.2"/>
  <line x1="777.0" y1="308" x2="777.0" y2="332" stroke="#2C2C2A" stroke-width="4.2"/>
  <circle cx="777.0" cy="340" r="3.0" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0.3"/>
  <text x="777.0" y="384" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Exclamation Mark</text>
  <text x="777.0" y="402" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">刺激 / 警示</text>
  <text x="777.0" y="420" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">irritant, low toxicity｜刺激、低毒</text>
  <rect x="24" y="448" width="852" height="44" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="462" font-size="10" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">A pictogram tells you the hazard, not the procedure｜标识只告诉你「危险是什么」，不告诉你「怎么做」</text>
  <text x="450" y="480" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Read it before you pour: goggles on, tray under, waste in the labelled container｜倒之前先看标识：戴护目镜、放托盘、废液进指定桶</text>
</svg>
