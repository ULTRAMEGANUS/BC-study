  <title>Fig. 7-1　The pH Scale 0–14｜pH 标度 0–14</title>
  <rect width="900" height="436" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 7-1　The pH Scale 0–14｜pH 标度 0–14</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">each step = 10×｜每差 1 等于 10 倍</text>
  <rect x="40.0" y="50" width="382.6669" height="26" rx="8" fill="#F7E3E3" stroke="#A32D2D" stroke-width="1.1"/>
