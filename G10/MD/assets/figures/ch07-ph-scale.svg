  <rect x="477.3336" y="100" width="54.6667" height="58" rx="0" fill="#8FC0D8" stroke="#8FC0D8" stroke-width="0.8"/>
  <text x="504.66695" y="86" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">8</text>
  <rect x="532.0002999999999" y="100" width="54.6667" height="58" rx="0" fill="#6FA8C8" stroke="#6FA8C8" stroke-width="0.8"/>
