<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900"
     height="384" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 5-1　Six Types of Chemical Reactions｜六类反应总览</title>
  <rect width="900" height="384" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 5-1　Six Types of Chemical Reactions｜六类反应总览</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">each card = one pattern｜一张卡一条模具</text>
  <rect x="20" y="54" width="272" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="156" y="69" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">1  Synthesis｜合成</text>
  <rect x="20" y="84" width="272" height="102" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="156" y="110" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">A + B → AB</text>
  <text x="156" y="138" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2 Mg + O₂ → 2 MgO</text>
  <text x="156" y="164" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">many reactants → one product｜多变一</text>
  <rect x="308" y="54" width="272" height="30" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="444" y="69" font-size="11.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">2  Decomposition｜分解</text>
  <rect x="308" y="84" width="272" height="102" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="444" y="110" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">AB → A + B</text>
  <text x="444" y="138" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">CaCO₃ → CaO + CO₂</text>
  <text x="444" y="164" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">one reactant → many products｜一变多（需加热）</text>
  <rect x="596" y="54" width="272" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="732" y="69" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">3  Single Replacement｜单置换</text>
  <rect x="596" y="84" width="272" height="102" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="732" y="110" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">A + BC → AC + B</text>
  <text x="732" y="138" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Zn + 2 HCl → ZnCl₂ + H₂</text>
  <text x="732" y="164" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">check the activity series first｜先查活动性</text>
  <rect x="20" y="194" width="272" height="30" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="156" y="209" font-size="11.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">4  Double Replacement｜双置换</text>
  <rect x="20" y="224" width="272" height="102" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="156" y="250" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">AB + CD → AD + CB</text>
  <text x="156" y="278" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">AgNO₃ + NaCl → AgCl↓ + NaNO₃</text>
  <text x="156" y="304" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">check solubility first｜先查溶解性</text>
  <rect x="308" y="194" width="272" height="30" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="444" y="209" font-size="11.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">5  Neutralization｜中和</text>
  <rect x="308" y="224" width="272" height="102" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="444" y="250" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">acid + base → salt + water</text>
  <text x="444" y="278" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">HCl + NaOH → NaCl + H₂O</text>
  <text x="444" y="304" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">a double replacement in disguise｜其实是双置换</text>
  <rect x="596" y="194" width="272" height="30" rx="8" fill="#F7E3E3" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="732" y="209" font-size="11.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">6  Combustion｜燃烧</text>
  <rect x="596" y="224" width="272" height="102" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="732" y="250" font-size="12.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">fuel + O₂ → CO₂ + H₂O</text>
  <text x="732" y="278" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">CH₄ + 2 O₂ → CO₂ + 2 H₂O</text>
  <text x="732" y="304" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">O₂ is always a reactant｜必须有 O₂</text>
  <rect x="20" y="336" width="860" height="36" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="354" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Six patterns every year: count the reactants, then check the two tables｜每年都考这六条：先数反应物，再查两张表</text>
</svg>
