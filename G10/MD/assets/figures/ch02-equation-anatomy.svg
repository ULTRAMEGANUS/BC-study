<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900"
     height="460" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 2-4　Anatomy of a Chemical Equation｜化学方程式六个零件</title>
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 2-4　Anatomy of a Chemical Equation｜化学方程式六个零件</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">every position has a rule｜每一处都有规矩</text>
  <rect x="24" y="54" width="852" height="88" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="258" y="98" font-size="24" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="292" y="98" font-size="24" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂</text>
  <text x="332" y="98" font-size="17" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(g)</text>
  <text x="366" y="98" font-size="20" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">+</text>
  <text x="400" y="98" font-size="24" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O₂</text>
  <text x="440" y="98" font-size="17" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(g)</text>
  <text x="482" y="98" font-size="24" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <text x="528" y="98" font-size="24" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="568" y="98" font-size="24" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <text x="620" y="98" font-size="17" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(l)</text>
  <rect x="24" y="152" width="852" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="170" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Read: 2 hydrogen molecules + 1 oxygen molecule → 2 water molecules｜2 个氢分子 + 1 个氧分子 → 2 个水分子</text>
  <text x="450" y="190" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Coefficients count molecules; subscripts count atoms within one molecule｜系数数分子、下标数原子，位置与含义完全不同</text>
  <rect x="20" y="216" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="156" y="236" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">① Coefficient 系数</text>
  <text x="156" y="260" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">the number IN FRONT of a formula｜写在化学式前面</text>
  <text x="156" y="278" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">the only thing you may change: 2 H₂O = 2 molecules</text>
  <rect x="308" y="216" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="444" y="236" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② Subscript 下标</text>
  <text x="444" y="260" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">bottom-right of a symbol｜元素符号右下角</text>
  <text x="444" y="278" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O has 2 H — never change it｜配平绝不能改</text>
  <rect x="596" y="216" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="732" y="236" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">③ Formula 化学式</text>
  <text x="732" y="260" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">every formula must be correct (Ch.1)｜每种物质写对</text>
  <text x="732" y="278" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">diatomic: H₂ / O₂ / N₂ / Cl₂</text>
  <rect x="20" y="304" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="156" y="324" font-size="11" font-weight="700" fill="#185FA5" text-anchor="middle" dominant-baseline="central">④ State symbol 状态符号</text>
  <text x="156" y="348" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">(s) solid (l) liquid (g) gas (aq) aqueous｜固液气水溶液</text>
  <text x="156" y="366" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">salt water is NaCl(aq), not NaCl(l)｜不是 NaCl(l)</text>
  <rect x="308" y="304" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="444" y="324" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">⑤ Arrow 箭头</text>
  <text x="444" y="348" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">means yields — never an equals sign｜读作生成，不写等号</text>
  <text x="444" y="366" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">reversible reactions use ⇌ (extension)｜可逆用 ⇌</text>
  <rect x="596" y="304" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="732" y="324" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">⑥ Condition 反应条件</text>
  <text x="732" y="348" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">written above / below the arrow｜写在箭头上或下</text>
  <text x="732" y="366" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Δ heat · catalyst 催化剂 · light 光照</text>
  <rect x="20" y="398" width="860" height="50" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="415" font-size="10.5" font-weight="600" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">⛔ Balance by coefficients only, never subscripts — changing a subscript changes the substance（CO₂ → CO 不再是二氧化碳）</text>
  <text x="450" y="433" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Verification (Ch.3): count atoms on both sides — all equal = balanced｜验算见 Ch.3</text>
</svg>
