<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900"
     height="460" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 2-4　化学方程式的六个零件｜Anatomy of a Chemical Equation</title>
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 2-4　化学方程式的六个零件｜Anatomy of a Chemical Equation</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 10 · 每一处都有规矩</text>
  <rect x="24" y="54" width="852" height="88" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="258" y="98" font-size="24" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="292" y="98" font-size="24" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂</text>
  <text x="332" y="98" font-size="17" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(g)</text>
  <text x="366" y="98" font-size="20" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">+</text>
  <text x="400" y="98" font-size="24" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O₂</text>
  <text x="440" y="98" font-size="17" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(g)</text>
  <text x="482" y="98" font-size="24" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <text x="528" y="98" font-size="24" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="568" y="98" font-size="24" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <text x="620" y="98" font-size="17" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(l)</text>
  <rect x="24" y="152" width="852" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="170" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">读作：2 个氢分子 + 1 个氧分子　生成　2 个水分子</text>
  <text x="450" y="190" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">系数读「几个分子」，下标读「一个分子里有几个原子」—— 两者位置与含义完全不同</text>
  <rect x="20" y="216" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="156" y="236" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">① 系数 Coefficient</text>
  <text x="156" y="260" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">写在化学式前面的数字，</text>
  <text x="156" y="278" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">配平时只能改它：2 H₂O = 2 个水分子</text>
  <rect x="308" y="216" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="444" y="236" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② 下标 Subscript</text>
  <text x="444" y="260" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">写在元素符号右下角，</text>
  <text x="444" y="278" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O 里有 2 个 H —— 配平时绝不能改</text>
  <rect x="596" y="216" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="732" y="236" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">③ 化学式 Formula</text>
  <text x="732" y="260" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">每种物质必须写对（Ch.1）；</text>
  <text x="732" y="278" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">双原子分子写 H₂ / O₂ / N₂ / Cl₂</text>
  <rect x="20" y="304" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="156" y="324" font-size="11" font-weight="700" fill="#185FA5" text-anchor="middle" dominant-baseline="central">④ 状态符号 State symbol</text>
  <text x="156" y="348" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">(s) 固　(l) 液　(g) 气　(aq) 水溶液</text>
  <text x="156" y="366" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">食盐水是 NaCl(aq)，不是 NaCl(l)</text>
  <rect x="308" y="304" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="444" y="324" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">⑤ 箭头 Arrow</text>
  <text x="444" y="348" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">读作「生成 / 变成」，不能写成等号 =</text>
  <text x="444" y="366" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">方向不能反；可逆反应用 ⇌【Ext.】</text>
  <rect x="596" y="304" width="272" height="78" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="732" y="324" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">⑥ 反应条件 Condition</text>
  <text x="732" y="348" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">写在箭头上 / 下，表示反应条件</text>
  <text x="732" y="366" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Δ 加热 · catalyst 催化剂 · light 光照</text>
  <rect x="20" y="398" width="860" height="50" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="415" font-size="10.5" font-weight="600" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">⛔ 配平只动系数，绝不动下标 —— 改下标就是改物质本身（CO₂ 改成 CO 就不再是二氧化碳）</text>
  <text x="450" y="433" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">验算方法见 Ch.3：列一张左右原子计数表，两边全等才算配平完成</text>
</svg>
