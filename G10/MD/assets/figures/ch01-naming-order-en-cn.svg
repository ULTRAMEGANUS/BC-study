<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900"
     height="380" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 1-3　英中命名顺序相反｜English vs Chinese Naming Order</title>
  <rect width="900" height="380" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 1-3　英中命名顺序相反｜English vs Chinese Naming Order</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 10 · 英文 metal 在前，中文 非金属 在前</text>
  <rect x="24" y="58" width="414" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="231" y="74" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ENGLISH — metal 在前</text>
  <rect x="462" y="58" width="414" height="32" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="669" y="74" font-size="12" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">中文 — 非金属 在前（顺序相反）</text>
  <rect x="54" y="104" width="152" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.1"/>
  <text x="130" y="124" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">sodium</text>
  <text x="130" y="142" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">metal 金属</text>
  <text x="219" y="130" font-size="16" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <rect x="232" y="104" width="176" height="52" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.1"/>
  <text x="320" y="124" font-size="14" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">chloride</text>
  <text x="320" y="142" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">non-metal + -ide</text>
  <rect x="507" y="104" width="120" height="52" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.1"/>
  <text x="567" y="124" font-size="14" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">氯</text>
  <text x="567" y="142" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">非金属</text>
  <rect x="637" y="104" width="64" height="52" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.1"/>
  <text x="669" y="130" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">化</text>
  <rect x="711" y="104" width="120" height="52" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.1"/>
  <text x="771" y="124" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">钠</text>
  <text x="771" y="142" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">金属</text>
  <rect x="40" y="174" width="390" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="235" y="196" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">MgF₂　→　magnesium fluoride</text>
  <text x="235" y="216" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">金属名 + 非金属-ide</text>
  <rect x="470" y="174" width="390" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="665" y="196" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">MgF₂　→　氟化镁</text>
  <text x="665" y="216" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">非金属 + 化 + 金属</text>
  <rect x="40" y="236" width="390" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="235" y="258" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Fe₂S₃　→　iron(III) sulfide</text>
  <text x="235" y="278" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">多变价金属必须写罗马数字</text>
  <rect x="470" y="236" width="390" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="665" y="258" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Fe₂S₃　→　硫化铁（Ⅲ）</text>
  <text x="665" y="278" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">中文可写「(Ⅲ)」或沿用旧称「高铁/亚铁」</text>
  <rect x="24" y="312" width="852" height="52" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="329" font-size="11.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">常见错误 Common errors</text>
  <text x="450" y="349" font-size="10.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">sodium monochloride（离子化合物不加希腊前缀）　钠化氯（中文顺序写反）　copper chloride（多变价漏罗马数字）</text>
</svg>
