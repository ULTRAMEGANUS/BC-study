<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900"
     height="546" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 8-1　The Inquiry Cycle: 8 Steps｜科学探究八步循环</title>
  <rect width="900" height="546" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 8-1　The Inquiry Cycle: 8 Steps｜科学探究八步循环</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">one loop, eight steps｜八步一循环</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#888780"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M 517.9 158.8 L 571.0 171.2" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 661.8 215.9 L 697.9 265.0" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 699.1 323.4 L 663.0 372.5" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 573.0 418.3 L 519.9 430.7" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 382.1 431.2 L 329.0 418.8" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 238.2 374.1 L 202.1 325.0" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 200.9 266.6 L 237.0 217.5" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M 327.0 171.7 L 380.1 159.3" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="385.0" y="117.0" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="450.0" y="134.0" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">1  Question</text>
  <text x="450.0" y="155.0" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">提出问题</text>
  <rect x="575.9188309203678" y="161.51976925964476" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="640.9188309203678" y="178.51976925964476" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">2  Hypothesis</text>
  <text x="640.9188309203678" y="199.51976925964476" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">假设 If…then…</text>
  <rect x="655.0" y="269.0" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="720.0" y="286.0" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">3  Prediction</text>
  <text x="720.0" y="307.0" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">预测测什么</text>
  <rect x="575.9188309203678" y="376.48023074035524" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="640.9188309203678" y="393.48023074035524" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">4  Procedure</text>
  <text x="640.9188309203678" y="414.48023074035524" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">步骤 · 控制变量</text>
  <rect x="385.0" y="421.0" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="450.0" y="438.0" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">5  Data</text>
  <text x="450.0" y="459.0" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">数据（含单位）</text>
  <rect x="194.08116907963222" y="376.48023074035524" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="259.0811690796322" y="393.48023074035524" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">6  Analysis</text>
  <text x="259.0811690796322" y="414.48023074035524" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">分析 · 作图</text>
  <rect x="115.0" y="269.0" width="130" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="180.0" y="286.0" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">7  Conclusion</text>
  <text x="180.0" y="307.0" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">结论</text>
  <rect x="194.0811690796321" y="161.5197692596448" width="130" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="259.0811690796321" y="178.5197692596448" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">8  Communication</text>
  <text x="259.0811690796321" y="199.5197692596448" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">交流 · 报告</text>
  <circle cx="450" cy="295" r="78" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2"/>
  <text x="450" y="275" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Scientific Inquiry</text>
  <text x="450" y="297" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">科学探究</text>
  <text x="450" y="319" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">8 steps · 1 loop</text>
  <text x="450" y="335" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">走完一圈再问下一个问题</text>
  <rect x="24" y="492" width="852" height="42" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="506" font-size="10" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Hypothesis（假设）: If … then … — a testable statement, not a guess｜是可检验的陈述，不是「我觉得」</text>
  <text x="450" y="524" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Prediction（预测）: the measured result you expect if the hypothesis is right｜预测 = 预期测到的具体数值或现象</text>
</svg>
