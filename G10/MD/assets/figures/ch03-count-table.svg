<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 404" width="900"
     height="404" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 3-2　Atom Count Check｜原子计数验算表</title>
  <rect width="900" height="404" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 3-2　Atom Count Check｜原子计数验算表</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">count both sides｜左右各数一遍</text>
  <rect x="24" y="54" width="852" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="450" y="82" font-size="20" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">CH₄ + 2 O₂ → CO₂ + 2 H₂O</text>
  <text x="450" y="105" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">methane burns in oxygen｜甲烷在氧气中燃烧</text>
  <rect x="24" y="134" width="852" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <line x1="24" y1="134" x2="24" y2="270" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="104.0" y="148" font-size="9.8" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Element｜元素</text>
  <line x1="184" y1="134" x2="184" y2="270" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="324.0" y="148" font-size="9.8" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Left — reactants｜左（反应物）</text>
  <line x1="464" y1="134" x2="464" y2="270" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="604.0" y="148" font-size="9.8" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Right — products｜右（生成物）</text>
  <line x1="744" y1="134" x2="744" y2="270" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="810.0" y="148" font-size="9.8" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Equal?｜相等？</text>
  <line x1="876" y1="134" x2="876" y2="270" stroke="#B4B2A9" stroke-width="0.9"/>
  <rect x="24" y="162" width="852" height="36" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="58" y="180" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">C</text>
  <text x="204" y="180" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">1 CH₄ → 1 C</text>
  <text x="484" y="180" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">1 CO₂ → 1 C</text>
  <text x="810" y="180" font-size="10.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓ 1 = 1</text>
  <rect x="24" y="198" width="852" height="36" rx="0" fill="#FBFAF5" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="58" y="216" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="204" y="216" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">1 CH₄ → 4 H</text>
  <text x="484" y="216" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">2 H₂O → 4 H</text>
  <text x="810" y="216" font-size="10.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓ 4 = 4</text>
  <rect x="24" y="234" width="852" height="36" rx="0" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="58" y="252" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="204" y="252" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">2 O₂ → 4 O</text>
  <text x="484" y="252" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">CO₂ 2 + 2 H₂O 2 = 4 O</text>
  <text x="810" y="252" font-size="10.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓ 4 = 4</text>
  <rect x="24" y="282" width="852" height="52" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="450" y="300" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">All three elements match → the equation is balanced｜三种元素左右全等 = 配平完成</text>
  <text x="450" y="320" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">If one row differs, change one coefficient and count the whole table again｜差一行就改系数、整表重数</text>
  <rect x="24" y="346" width="852" height="44" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="362" font-size="10.2" font-weight="600" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">⛔ Never fix a mismatch by editing a subscript — that creates a different substance</text>
  <text x="450" y="379" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">下标是化学式的一部分，改了下标就不是原来的物质了</text>
</svg>
