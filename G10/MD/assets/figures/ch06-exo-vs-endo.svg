<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900"
     height="440" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 6-1　Exothermic vs Endothermic｜放热与吸热能量图</title>
  <rect width="900" height="440" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 6-1　Exothermic vs Endothermic｜放热与吸热能量图</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">higher → lower = heat out｜高→低 = 放热</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#888780"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="24" y="52" width="414" height="30" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="231" y="67" font-size="13" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">EXOTHERMIC｜放热反应</text>
  <rect x="462" y="52" width="414" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="669" y="67" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ENDOTHERMIC｜吸热反应</text>
  <path d="M64 300 V126" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M64 300 H430" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="74" y="140" font-size="9.5" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Energy｜能量</text>
  <line x1="96" y1="175" x2="215" y2="175" stroke="#185FA5" stroke-width="2.4"/>
  <text x="155" y="157" font-size="9.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">reactants｜反应物</text>
  <path d="M215 176 V246" fill="none" stroke="#0C447C" stroke-width="2.0" marker-end="url(#ar)"/>
  <line x1="215" y1="250" x2="340" y2="250" stroke="#BA7517" stroke-width="2.4"/>
  <text x="277" y="268" font-size="9.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">products｜生成物</text>
  <text x="312" y="202" font-size="9.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">energy released｜放出能量</text>
  <text x="312" y="218" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">→ surroundings warm｜环境变暖</text>
  <path d="M502 300 V126" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M502 300 H868" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="512" y="140" font-size="9.5" font-weight="600" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Energy｜能量</text>
  <line x1="534" y1="250" x2="653" y2="250" stroke="#185FA5" stroke-width="2.4"/>
  <text x="593" y="268" font-size="9.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">reactants｜反应物</text>
  <path d="M653 244 V178" fill="none" stroke="#0C447C" stroke-width="2.0" marker-end="url(#ar)"/>
  <line x1="653" y1="175" x2="778" y2="175" stroke="#BA7517" stroke-width="2.4"/>
  <text x="715" y="157" font-size="9.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">products｜生成物</text>
  <text x="750" y="208" font-size="9.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">energy absorbed｜吸收能量</text>
  <text x="750" y="224" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">← surroundings cool｜环境变冷</text>
  <rect x="24" y="330" width="414" height="54" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.1"/>
  <text x="231" y="348" font-size="11.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Surroundings get WARMER｜环境变暖</text>
  <text x="231" y="368" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">products end LOWER than reactants｜生成物能量更低</text>
  <rect x="462" y="330" width="414" height="54" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.1"/>
  <text x="669" y="348" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Surroundings get COOLER｜环境变冷</text>
  <text x="669" y="368" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">products end HIGHER than reactants｜生成物能量更高</text>
  <rect x="24" y="398" width="852" height="30" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="413" font-size="10" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Read the two plateaus, not the hill: the height of the products decides the sign｜只看两个台阶的高低，别看山丘</text>
</svg>
