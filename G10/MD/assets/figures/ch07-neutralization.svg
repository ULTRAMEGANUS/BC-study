<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 458" width="900"
     height="458" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 7-4　Neutralization Anatomy｜中和反应解剖</title>
  <rect width="900" height="458" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 7-4　Neutralization Anatomy｜中和反应解剖</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">H⁺ + OH⁻ → H₂O｜本质就这一步</text>
  <rect x="24" y="50" width="852" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="450" y="84" font-size="21" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="alphabetic">HCl + NaOH → NaCl + H₂O</text>
  <text x="349.4099999999999" y="98" font-size="9" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">acid｜酸</text>
  <text x="413.145" y="98" font-size="9" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">base｜碱</text>
  <text x="486.85499999999996" y="98" font-size="9" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">salt｜盐</text>
  <text x="550.59" y="98" font-size="9" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">water｜水</text>
  <rect x="24" y="120" width="320" height="180" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="184" y="138" font-size="10.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Reactant ions｜反应物离子</text>
  <circle cx="86" cy="182" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="86" y="182" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H⁺</text>
  <circle cx="150" cy="182" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="150" y="182" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Cl⁻</text>
  <text x="236" y="182" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">from HCl｜来自盐酸</text>
  <circle cx="86" cy="244" r="20" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="86" y="244" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Na⁺</text>
  <circle cx="150" cy="244" r="20" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="150" y="244" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">OH⁻</text>
  <text x="236" y="244" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">from NaOH｜来自氢氧化钠</text>
  <text x="184" y="286" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">four ions floating in water｜四种离子都在水里</text>
  <rect x="356" y="120" width="170" height="180" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="441" y="138" font-size="10" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Net change｜净变化</text>
  <text x="441" y="178" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H⁺ + OH⁻</text>
  <text x="441" y="206" font-size="16" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <text x="441" y="234" font-size="14" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <text x="441" y="268" font-size="8" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">the only real step｜唯一真正发生的一步</text>
  <text x="441" y="284" font-size="8" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">the rest just watch｜其余只是旁观</text>
  <rect x="538" y="120" width="322" height="180" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="699" y="138" font-size="10.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Product ions｜生成物离子</text>
  <circle cx="624" cy="182" r="20" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="624" y="182" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Na⁺</text>
  <circle cx="688" cy="182" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="688" y="182" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Cl⁻</text>
  <text x="774" y="182" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">spectators｜旁观</text>
  <circle cx="624" cy="250" r="24" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="624" y="250" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <text x="699" y="250" font-size="9" fill="#3B6D11" text-anchor="start" dominant-baseline="central">water｜水</text>
  <text x="699" y="286" font-size="8.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Na⁺ and Cl⁻ become the salt｜Na⁺ 与 Cl⁻ 就是盐</text>
  <rect x="24" y="316" width="852" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="336" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">acid + base → salt + water; the water comes only from H⁺ + OH⁻｜酸 + 碱 → 盐 + 水，水只来自 H⁺ + OH⁻</text>
  <text x="450" y="356" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">The salt is whatever ions are left over: Na⁺ + Cl⁻ → NaCl｜盐就是剩下的那对离子：Na⁺ + Cl⁻ → NaCl</text>
  <rect x="24" y="384" width="852" height="62" rx="8" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.1"/>
  <text x="450" y="403" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">A base with two OH⁻ needs two acids:  2 HCl + Ca(OH)₂ → CaCl₂ + 2 H₂O</text>
  <text x="450" y="424" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Check: H 4 = 4 · Cl 2 = 2 · Ca 1 = 1 · O 2 = 2 ✓ — two hydroxides, two waters｜两个 OH⁻ 就生成两个水</text>
</svg>
