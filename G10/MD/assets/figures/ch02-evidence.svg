<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" width="900"
     height="322" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>Fig. 2-2　Evidence of Chemical Change｜化学变化的六大证据</title>
  <rect width="900" height="322" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 2-2　Evidence of Chemical Change｜化学变化的六大证据</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">several cues together｜多证据同现</text>
  <rect x="20" y="58" width="272" height="82" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="156" y="78" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">① Colour change 变色</text>
  <text x="156" y="104" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">iron rusts; a cut apple browns</text>
  <text x="156" y="122" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">石蕊遇酸变红</text>
  <rect x="308" y="58" width="272" height="82" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="444" y="78" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② Gas produced 产气</text>
  <text x="444" y="104" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">bubbles: Zn + HCl,</text>
  <text x="444" y="122" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NaHCO₃ + CH₃COOH</text>
  <rect x="596" y="58" width="272" height="82" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="732" y="78" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">③ Precipitate 沉淀</text>
  <text x="732" y="104" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">two clear solutions turn cloudy:</text>
  <text x="732" y="122" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Pb(NO₃)₂ + KI → PbI₂↓</text>
  <rect x="20" y="152" width="272" height="82" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="156" y="172" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">④ Temperature change 温度变化</text>
  <text x="156" y="198" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">rises: burning, CaO + H₂O</text>
  <text x="156" y="216" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">or drops: cold pack 吸热降温</text>
  <rect x="308" y="152" width="272" height="82" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="444" y="172" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">⑤ Light given off 发光</text>
  <text x="444" y="198" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">burning Mg gives a dazzling</text>
  <text x="444" y="216" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">white light 耀眼白光</text>
  <rect x="596" y="152" width="272" height="82" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="732" y="172" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">⑥ New odour 新气味</text>
  <text x="732" y="198" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">rotten-egg smell (H₂S);</text>
  <text x="732" y="216" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">fruity ester smell 水果香</text>
  <rect x="20" y="250" width="860" height="58" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="268" font-size="11" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">⚠️ One piece of evidence ≠ chemical change｜单一证据 ≠ 化学变化</text>
  <text x="450" y="286" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Melting ice and dissolving sugar are physical changes — the test is whether a NEW substance forms｜判据是有没有新物质生成，</text>
  <text x="450" y="301" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">i.e. whether atoms have rearranged (Ch.4 explains why)｜本质是原子有没有重排（Ch.4）</text>
</svg>
