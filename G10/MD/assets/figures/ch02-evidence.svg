<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 322" width="900"
     height="322" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 2-2　化学变化的六大证据｜Evidence of Change</title>
  <rect width="900" height="322" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 2-2　化学变化的六大证据｜Evidence of Change</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 10 · 多类证据同时出现，才更可能是化学变化</text>
  <rect x="20" y="58" width="272" height="82" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="156" y="78" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">① 变色 Colour change</text>
  <text x="156" y="104" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">铁生锈、切开的苹果变褐、</text>
  <text x="156" y="122" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">石蕊遇酸变红</text>
  <rect x="308" y="58" width="272" height="82" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="444" y="78" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② 产气 Gas produced</text>
  <text x="444" y="104" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">气泡冒出：Zn + HCl、</text>
  <text x="444" y="122" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">NaHCO₃ + CH₃COOH</text>
  <rect x="596" y="58" width="272" height="82" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="732" y="78" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">③ 沉淀 Precipitate</text>
  <text x="732" y="104" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">两瓶澄清溶液一混就变浑浊：</text>
  <text x="732" y="122" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Pb(NO₃)₂ + KI → PbI₂↓</text>
  <rect x="20" y="152" width="272" height="82" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="156" y="172" font-size="11" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">④ 温度变化 Temperature</text>
  <text x="156" y="198" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">放热升温（燃烧、生石灰加水）</text>
  <text x="156" y="216" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">或吸热降温（冰袋）</text>
  <rect x="308" y="152" width="272" height="82" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="444" y="172" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">⑤ 发光 Light given off</text>
  <text x="444" y="198" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">镁条燃烧发出耀眼白光、</text>
  <text x="444" y="216" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">火焰、火星四溅</text>
  <rect x="596" y="152" width="272" height="82" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="732" y="172" font-size="11" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">⑥ 新气味 New odour</text>
  <text x="732" y="198" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">腐败的臭鸡蛋味（H₂S）、</text>
  <text x="732" y="216" font-size="9.5" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">酯类的水果香味</text>
  <rect x="20" y="250" width="860" height="58" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="268" font-size="11" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">⚠️ 单一证据 ≠ 化学变化</text>
  <text x="450" y="286" font-size="10" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">冰熔化是状态变化、糖溶于水也会让温度变 —— 都属物理变化。判据要看有没有新物质生成，</text>
  <text x="450" y="301" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">本质是原子有没有重新组合（Ch.4 会给出原子层面的解释）</text>
</svg>
