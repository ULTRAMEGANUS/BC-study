<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 344" width="900"
     height="344" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 2-1　化学反应 = 原子重排｜Atoms Rearrange</title>
  <rect width="900" height="344" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 2-1　化学反应 = 原子重排｜Atoms Rearrange</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 10 · 旧键断裂、新键形成，原子一个不多一个不少</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="#888780"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="24" y="58" width="340" height="176" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="194" y="78" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">反应前 BEFORE（反应物 reactants）</text>
  <circle cx="82" cy="132" r="21" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="82" y="132" font-size="15" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <circle cx="122" cy="132" r="21" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="122" y="132" font-size="15" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="102" y="166" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">H₂ 氢</text>
  <text x="176" y="132" font-size="18" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">+</text>
  <circle cx="228" cy="132" r="21" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="228" y="132" font-size="15" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">O</text>
  <circle cx="268" cy="132" r="21" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="268" y="132" font-size="15" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="248" y="166" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">O₂ 氧</text>
  <text x="194" y="206" font-size="10.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">共 4 个 H 原子　2 个 O 原子</text>
  <line x1="386" y1="132" x2="508" y2="132" stroke="#888780" stroke-width="2.0"/>
  <path d="M508 125 L522 132 L508 139 Z" fill="#888780"/>
  <text x="450" y="108" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">原子重排</text>
  <text x="450" y="156" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">rearrange</text>
  <rect x="536" y="58" width="340" height="176" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="706" y="78" font-size="11.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">反应后 AFTER（生成物 products）</text>
  <circle cx="600" cy="132" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="600" y="132" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <circle cx="638" cy="132" r="24" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="638" y="132" font-size="16" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">O</text>
  <circle cx="676" cy="132" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="676" y="132" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="638" y="168" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">H₂O 水</text>
  <circle cx="746" cy="132" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="746" y="132" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <circle cx="784" cy="132" r="24" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="784" y="132" font-size="16" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">O</text>
  <circle cx="822" cy="132" r="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="822" y="132" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="784" y="168" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">H₂O 水</text>
  <rect x="24" y="252" width="852" height="74" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="272" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">原子计数 Atom count</text>
  <text x="450" y="294" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H：4 → 4　　O：2 → 2　　—— 种类不变、数目不变，只有「搭档」换了</text>
  <text x="450" y="314" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">这就是 Big Idea 中 atoms rearrange（原子重排）的字面含义，也是 Ch.4 质量守恒定律的微观依据</text>
</svg>
