  <title>Fig. 7-3　Indicator Colours｜指示剂颜色卡</title>
  <rect width="900" height="428" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">Fig. 7-3　Indicator Colours｜指示剂颜色卡</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">colour is the signal｜看颜色下结论</text>
  <rect x="40" y="52" width="260" height="32" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="170.0" y="68" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Indicator｜指示剂</text>
  <rect x="300" y="52" width="180" height="32" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="390" y="68" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Acid｜酸性</text>
  <rect x="486" y="52" width="180" height="32" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="576" y="68" font-size="11.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Neutral｜中性</text>
  <rect x="672" y="52" width="180" height="32" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="762" y="68" font-size="11.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Base｜碱性</text>
  <rect x="40" y="88" width="260" height="54" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="54" y="106" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Litmus</text>
  <text x="54" y="122" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">red / blue paper｜红蓝试纸</text>
  <rect x="300" y="88" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="312" y="102" width="26" height="26" rx="4" fill="#B23A3A" stroke="#B23A3A" stroke-width="1.0"/>
  <text x="346" y="115.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">red 红</text>
  <rect x="486" y="88" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="498" y="102" width="26" height="26" rx="4" fill="#7B5EA7" stroke="#7B5EA7" stroke-width="1.0"/>
  <text x="532" y="115.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">purple 紫</text>
  <rect x="672" y="88" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="684" y="102" width="26" height="26" rx="4" fill="#1F5FA5" stroke="#1F5FA5" stroke-width="1.0"/>
  <text x="718" y="115.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">blue 蓝</text>
  <rect x="40" y="142" width="260" height="54" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="54" y="160" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Phenolphthalein</text>
  <text x="54" y="176" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">colourless solution｜无色溶液</text>
  <rect x="300" y="142" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="312" y="156" width="26" height="26" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="346" y="169.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">colourless 无色</text>
  <rect x="486" y="142" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="498" y="156" width="26" height="26" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="532" y="169.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">colourless 无色</text>
  <rect x="672" y="142" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="684" y="156" width="26" height="26" rx="4" fill="#E06A9B" stroke="#E06A9B" stroke-width="1.0"/>
  <text x="718" y="169.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">pink 粉红</text>
  <rect x="40" y="196" width="260" height="54" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="54" y="214" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Bromothymol blue</text>
  <text x="54" y="230" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">BTB solution｜BTB 溶液</text>
  <rect x="300" y="196" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="312" y="210" width="26" height="26" rx="4" fill="#D4B23C" stroke="#D4B23C" stroke-width="1.0"/>
  <text x="346" y="223.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">yellow 黄</text>
  <rect x="486" y="196" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="498" y="210" width="26" height="26" rx="4" fill="#4E9A51" stroke="#4E9A51" stroke-width="1.0"/>
  <text x="532" y="223.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">green 绿</text>
  <rect x="672" y="196" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="684" y="210" width="26" height="26" rx="4" fill="#1F5FA5" stroke="#1F5FA5" stroke-width="1.0"/>
  <text x="718" y="223.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">blue 蓝</text>
  <rect x="40" y="250" width="260" height="54" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="54" y="268" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Universal indicator</text>
  <text x="54" y="284" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">paper or solution｜试纸 / 溶液</text>
  <rect x="300" y="250" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="312" y="264" width="26" height="26" rx="4" fill="#C0504D" stroke="#C0504D" stroke-width="1.0"/>
  <text x="346" y="277.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">red to orange 红至橙</text>
  <rect x="486" y="250" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="498" y="264" width="26" height="26" rx="4" fill="#4E9A51" stroke="#4E9A51" stroke-width="1.0"/>
  <text x="532" y="277.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">green 绿</text>
  <rect x="672" y="250" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="684" y="264" width="26" height="26" rx="4" fill="#4B3F8F" stroke="#4B3F8F" stroke-width="1.0"/>
  <text x="718" y="277.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">blue to purple 蓝紫</text>
  <rect x="40" y="304" width="260" height="54" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="54" y="322" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">pH meter</text>
  <text x="54" y="338" font-size="8.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">electronic reading｜电子读数</text>
  <rect x="300" y="304" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="312" y="318" width="26" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="346" y="331.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">reads 2 to 6 读数 2–6</text>
  <rect x="486" y="304" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="498" y="318" width="26" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="532" y="331.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">reads 7 读数 7</text>
  <rect x="672" y="304" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <rect x="684" y="318" width="26" height="26" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="718" y="331.0" font-size="9.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">reads 8 to 13 读数 8–13</text>
  <rect x="24" y="370" width="852" height="46" rx="8" fill="#FFFFFF" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="450" y="385" font-size="10.5" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">Phenolphthalein stays colourless in acid AND in neutral solution — pink means base only｜酚酞在酸性和中性都无色，粉红只代表碱</text>
  <text x="450" y="404" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Universal indicator covers the whole scale; a pH meter gives a number, not a colour｜通用指示剂覆盖全程，pH 计给数字不给颜色</text>
</svg>
