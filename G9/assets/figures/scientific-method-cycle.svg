<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
<title>科学方法流程｜The Scientific Method：Question → Hypothesis → Prediction → Experiment → Data → Analysis → Conclusion → Communication</title>
<rect width="900" height="690" fill="#FFFFFF"/>
<text x="30" y="33" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="600">科学方法流程｜The Scientific Method（8 步 + 返回线）</text>
<text x="870" y="33" font-size="10.5" fill="#5F5E5A" text-anchor="end">BC Science 9 · Ch.10 ｜ 英中对照</text>
<text x="30" y="50" font-size="10" fill="#888780" text-anchor="start">这不是一张必须一步步走完的死板清单：结论常常会引出新的问题，于是回到步骤 1 重新开始（见底部返回线）。</text>
<rect x="58" y="64" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="78" cy="85" r="11" fill="#185FA5"/>
<text x="78" y="89" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">1</text>
<text x="95" y="83" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Question</text>
<text x="95" y="98" font-size="11.5" fill="#5F5E5A" text-anchor="start">提出问题</text>
<text x="70" y="120" font-size="9.5" fill="#5F5E5A" text-anchor="start">必须可探究 testable：</text>
<text x="70" y="134" font-size="9.5" fill="#5F5E5A" text-anchor="start">能用实验回答，而不是</text>
<text x="70" y="148" font-size="9.5" fill="#5F5E5A" text-anchor="start">“哪个更好看”这种偏好</text>
<text x="70" y="176" font-size="9" fill="#888780" text-anchor="start">Questioning &amp; predicting</text>
<rect x="267" y="64" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="287" cy="85" r="11" fill="#185FA5"/>
<text x="287" y="89" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">2</text>
<text x="304" y="83" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Hypothesis</text>
<text x="304" y="98" font-size="11.5" fill="#5F5E5A" text-anchor="start">提出假设</text>
<text x="279" y="120" font-size="9.5" fill="#5F5E5A" text-anchor="start">对结果的解释性猜测；</text>
<text x="279" y="134" font-size="9.5" fill="#5F5E5A" text-anchor="start">格式 If…then…because…</text>
<text x="279" y="176" font-size="9" fill="#888780" text-anchor="start">Questioning &amp; predicting</text>
<rect x="476" y="64" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="496" cy="85" r="11" fill="#185FA5"/>
<text x="496" y="89" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">3</text>
<text x="513" y="83" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Prediction</text>
<text x="513" y="98" font-size="11.5" fill="#5F5E5A" text-anchor="start">作出预测</text>
<text x="488" y="120" font-size="9.5" fill="#5F5E5A" text-anchor="start">对具体观测值的预期，</text>
<text x="488" y="134" font-size="9.5" fill="#5F5E5A" text-anchor="start">含数字：60 ℃ 时少于 30 s</text>
<text x="488" y="176" font-size="9" fill="#888780" text-anchor="start">Questioning &amp; predicting</text>
<rect x="685" y="64" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="705" cy="85" r="11" fill="#185FA5"/>
<text x="705" y="89" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">4</text>
<text x="722" y="83" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Experiment</text>
<text x="722" y="98" font-size="11.5" fill="#5F5E5A" text-anchor="start">计划与实施</text>
<text x="697" y="120" font-size="9.5" fill="#5F5E5A" text-anchor="start">设计 fair test 公平实验，</text>
<text x="697" y="134" font-size="9.5" fill="#5F5E5A" text-anchor="start">控制变量并多次重复</text>
<text x="697" y="176" font-size="9" fill="#888780" text-anchor="start">Planning &amp; conducting</text>
<rect x="58" y="210" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="78" cy="231" r="11" fill="#185FA5"/>
<text x="78" y="235" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">5</text>
<text x="95" y="229" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Observation &amp; Data</text>
<text x="95" y="244" font-size="11.5" fill="#5F5E5A" text-anchor="start">观察与收集数据</text>
<text x="70" y="266" font-size="9.5" fill="#5F5E5A" text-anchor="start">定性 + 定量，列表记录，</text>
<text x="70" y="280" font-size="9.5" fill="#5F5E5A" text-anchor="start">数据必须带单位</text>
<text x="70" y="322" font-size="9" fill="#888780" text-anchor="start">Processing &amp; analyzing</text>
<rect x="267" y="210" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="287" cy="231" r="11" fill="#185FA5"/>
<text x="287" y="235" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">6</text>
<text x="304" y="229" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Analysis</text>
<text x="304" y="244" font-size="11.5" fill="#5F5E5A" text-anchor="start">分析</text>
<text x="279" y="266" font-size="9.5" fill="#5F5E5A" text-anchor="start">作图、算平均值，</text>
<text x="279" y="280" font-size="9.5" fill="#5F5E5A" text-anchor="start">找规律 pattern 与趋势 trend</text>
<text x="279" y="322" font-size="9" fill="#888780" text-anchor="start">Processing &amp; analyzing</text>
<rect x="476" y="210" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="496" cy="231" r="11" fill="#185FA5"/>
<text x="496" y="235" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">7</text>
<text x="513" y="229" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Conclusion</text>
<text x="513" y="244" font-size="11.5" fill="#5F5E5A" text-anchor="start">得出结论</text>
<text x="488" y="266" font-size="9.5" fill="#5F5E5A" text-anchor="start">回答研究问题，说明数据</text>
<text x="488" y="280" font-size="9.5" fill="#5F5E5A" text-anchor="start">是否支持假设并引用证据</text>
<text x="488" y="322" font-size="9" fill="#888780" text-anchor="start">Evaluating</text>
<rect x="685" y="210" width="185" height="124" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
<circle cx="705" cy="231" r="11" fill="#185FA5"/>
<text x="705" y="235" font-size="11.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">8</text>
<text x="722" y="229" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">Communication</text>
<text x="722" y="244" font-size="11.5" fill="#5F5E5A" text-anchor="start">交流分享</text>
<text x="697" y="266" font-size="9.5" fill="#5F5E5A" text-anchor="start">实验报告 / 海报 / 汇报，</text>
<text x="697" y="280" font-size="9.5" fill="#5F5E5A" text-anchor="start">说明误差来源与改进</text>
<text x="697" y="322" font-size="9" fill="#888780" text-anchor="start">Communicating</text>
<line x1="245" y1="126.0" x2="265" y2="126.0" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="265,126.0 256,130.0 256,122.0" fill="#5F5E5A"/>
<line x1="454" y1="126.0" x2="474" y2="126.0" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="474,126.0 465,130.0 465,122.0" fill="#5F5E5A"/>
<line x1="663" y1="126.0" x2="683" y2="126.0" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="683,126.0 674,130.0 674,122.0" fill="#5F5E5A"/>
<line x1="245" y1="272.0" x2="265" y2="272.0" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="265,272.0 256,276.0 256,268.0" fill="#5F5E5A"/>
<line x1="454" y1="272.0" x2="474" y2="272.0" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="474,272.0 465,276.0 465,268.0" fill="#5F5E5A"/>
<line x1="663" y1="272.0" x2="683" y2="272.0" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="683,272.0 674,276.0 674,268.0" fill="#5F5E5A"/>
<path d="M 777.5 188 V 193 Q 777.5 199 771.5 199 H 156.5 Q 150.5 199 150.5 205 V 208" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
<polygon points="150.5,210 146.5,201 154.5,201" fill="#5F5E5A"/>
<path d="M 777.5 334 V 366 Q 777.5 372 771.5 372 H 42 Q 36 372 36 366 V 132 Q 36 126 42 126 H 54" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="7 4"/>
<polygon points="58,126 49,122 49,130" fill="#5F5E5A"/>
<rect x="238" y="350" width="350" height="21" rx="6" fill="#FFFFFF"/>
<text x="413" y="365" font-size="10.5" fill="#5F5E5A" text-anchor="middle">结论引发新问题 → 回到步骤 1（不是简单循环）</text>
<text x="30" y="408" font-size="12.5" fill="#2C2C2A" text-anchor="start" font-weight="600">变量 Variables —— 设计公平实验的关键</text>
<rect x="30" y="420" width="270" height="86" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="44" y="444" font-size="12.5" fill="#0C447C" text-anchor="start" font-weight="600">Independent variable 自变量</text>
<text x="44" y="464" font-size="10.5" fill="#2C2C2A" text-anchor="start">我主动改变的量（I change it）</text>
<text x="44" y="482" font-size="9.5" fill="#5F5E5A" text-anchor="start">例：水温 20 / 40 / 60 ℃</text>
<text x="44" y="498" font-size="9.5" fill="#888780" text-anchor="start">画在图的 x 轴</text>
<rect x="315" y="420" width="270" height="86" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="329" y="444" font-size="12.5" fill="#3B6D11" text-anchor="start" font-weight="600">Dependent variable 因变量</text>
<text x="329" y="464" font-size="10.5" fill="#2C2C2A" text-anchor="start">我测量、随之变化的量（I measure it）</text>
<text x="329" y="482" font-size="9.5" fill="#5F5E5A" text-anchor="start">例：糖完全溶解所需时间 (s)</text>
<text x="329" y="498" font-size="9.5" fill="#888780" text-anchor="start">画在图的 y 轴</text>
<rect x="600" y="420" width="270" height="86" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="614" y="444" font-size="12.5" fill="#854F0B" text-anchor="start" font-weight="600">Controlled variable 控制变量</text>
<text x="614" y="464" font-size="10.5" fill="#2C2C2A" text-anchor="start">必须保持不变的量（I keep it the same）</text>
<text x="614" y="482" font-size="9.5" fill="#5F5E5A" text-anchor="start">例：糖 5 g、水 100 mL、颗粒大小、是否搅拌</text>
<text x="614" y="498" font-size="9.5" fill="#888780" text-anchor="start">必须写成带数值的清单</text>
<rect x="30" y="518" width="840" height="42" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.0"/>
<text x="46" y="538" font-size="11.5" fill="#3C3489" text-anchor="start" font-weight="600">Fair test 公平实验：一次只改变一个自变量，其余全部列入控制变量清单并逐项固定（每条都要有具体数值或做法）。</text>
<text x="46" y="554" font-size="10" fill="#5F5E5A" text-anchor="start">口诀：我改的是自变量，我测的是因变量，我固定的是控制变量，我漏掉的是干扰变量 confounding variable。</text>
<rect x="30" y="572" width="840" height="78" rx="8" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1.0"/>
<text x="46" y="592" font-size="11.5" fill="#2C2C2A" text-anchor="start" font-weight="600">对应 BC Curricular Competencies 课程能力</text>
<text x="46" y="610" font-size="9.5" fill="#2C2C2A" text-anchor="start">① Questioning and predicting 提问与预测＝步骤 1–3　｜　② Planning and conducting 计划与实施＝步骤 4–5</text>
<text x="46" y="626" font-size="9.5" fill="#2C2C2A" text-anchor="start">③ Processing and analyzing 数据处理与分析＝步骤 5–6　｜　④ Evaluating 评估＝步骤 7</text>
<text x="46" y="642" font-size="9.5" fill="#2C2C2A" text-anchor="start">⑤ Applying and innovating 应用与创新＝把结论用到新情境　｜　⑥ Communicating 交流分享＝步骤 8</text>
</svg>