<text x="286" y="360" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="600">七</text>
<text x="340" y="360" font-size="11.5" fill="#2C2C2A">dichlorine <tspan font-weight="700" fill="#3B6D11">hept</tspan>oxide</text>
