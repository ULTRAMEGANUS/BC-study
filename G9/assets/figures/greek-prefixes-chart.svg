<text x="63" y="400" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">8</text>
<text x="171" y="400" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="600">octa-</text>
<text x="286" y="400" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="600">八</text>
<text x="340" y="400" font-size="11.5" fill="#2C2C2A"><tspan font-weight="700" fill="#3B6D11">octa</tspan>sulfur</text>
<text x="505" y="400" font-size="9" fill="#888780" text-anchor="start">变体 octo-</text>
<text x="600" y="400" font-size="11.5" fill="#2C2C2A" text-anchor="start">八硫</text>
<text x="856" y="400" font-size="12.5" fill="#2C2C2A" text-anchor="end" font-weight="600">S₈</text>
<line x1="30" y1="414" x2="870" y2="414" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="96" y1="66" x2="96" y2="494" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="246" y1="66" x2="246" y2="494" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="326" y1="66" x2="326" y2="494" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="578" y1="94" x2="578" y2="494" stroke="#DEDCD4" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="792" y1="94" x2="792" y2="494" stroke="#DEDCD4" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="63" y="440" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">9</text>
<text x="171" y="440" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="600">nona-</text>
<text x="286" y="440" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="600">九</text>
<text x="340" y="440" font-size="11.5" fill="#2C2C2A">tetraiodine <tspan font-weight="700" fill="#3B6D11">non</tspan>oxide</text>
<text x="505" y="440" font-size="9" fill="#888780" text-anchor="start">也作 ennea-</text>
<text x="600" y="440" font-size="11.5" fill="#2C2C2A" text-anchor="start">九氧化四碘</text>
<text x="856" y="440" font-size="12.5" fill="#2C2C2A" text-anchor="end" font-weight="600">I₄O₉</text>
<rect x="31" y="454" width="838" height="40" fill="#FBFAF7"/>
<line x1="30" y1="454" x2="870" y2="454" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="96" y1="66" x2="96" y2="494" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="246" y1="66" x2="246" y2="494" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="326" y1="66" x2="326" y2="494" stroke="#B4B2A9" stroke-width="0.7"/>
<line x1="578" y1="94" x2="578" y2="494" stroke="#DEDCD4" stroke-width="0.7" stroke-dasharray="3 3"/>
<line x1="792" y1="94" x2="792" y2="494" stroke="#DEDCD4" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="63" y="480" font-size="14" fill="#2C2C2A" text-anchor="middle" font-weight="600">10</text>
<text x="171" y="480" font-size="13" fill="#0C447C" text-anchor="middle" font-weight="600">deca-</text>
<text x="286" y="480" font-size="13" fill="#2C2C2A" text-anchor="middle" font-weight="600">十</text>
<text x="340" y="480" font-size="11.5" fill="#2C2C2A">tetraphosphorus <tspan font-weight="700" fill="#3B6D11">dec</tspan>oxide</text>
<text x="600" y="480" font-size="11.5" fill="#2C2C2A" text-anchor="start">十氧化四磷</text>
<text x="856" y="480" font-size="12.5" fill="#2C2C2A" text-anchor="end" font-weight="600">P₄O₁₀</text>
<rect x="30" y="510" width="268" height="104" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
<text x="44" y="534" font-size="11.5" fill="#0C447C" text-anchor="start" font-weight="600">Rule 1　第一元素：只有数目 > 1 才加前缀</text>
<text x="44" y="556" font-size="10" fill="#2C2C2A" text-anchor="start">数目 = 1 → 什么都不加（carbon）</text>
<text x="44" y="573" font-size="10" fill="#2C2C2A" text-anchor="start">数目 > 1 → di- / tri- / tetra- …</text>
<text x="44" y="590" font-size="10" fill="#2C2C2A" text-anchor="start">例：dinitrogen、tetraphosphorus</text>
<text x="44" y="607" font-size="10" fill="#2C2C2A" text-anchor="start">第一元素 = 写在前面、电负性较小的那个</text>
<rect x="316" y="510" width="268" height="104" rx="8" fill="#FCECEC" stroke="#A32D2D" stroke-width="1.1"/>
<text x="330" y="534" font-size="11.5" fill="#A32D2D" text-anchor="start" font-weight="600">Rule 2　第一元素永不用 mono-</text>
<text x="330" y="556" font-size="10" fill="#2C2C2A" text-anchor="start">CO = carbon monoxide 一氧化碳</text>
<text x="330" y="573" font-size="10" fill="#2C2C2A" text-anchor="start">× monocarbon monoxide（错）</text>
<text x="330" y="590" font-size="10" fill="#2C2C2A" text-anchor="start">× 一碳化一氧（错，第一元素要省“一”）</text>
<text x="330" y="607" font-size="10" fill="#2C2C2A" text-anchor="start">mono- 只可能出现在第二个元素上</text>
<rect x="602" y="510" width="268" height="104" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
<text x="616" y="534" font-size="11.5" fill="#3B6D11" text-anchor="start" font-weight="600">Rule 3　第二元素：必须加前缀 + 改 -ide</text>
<text x="616" y="556" font-size="10" fill="#2C2C2A" text-anchor="start">即使数目 = 1 也必须加前缀</text>
<text x="616" y="573" font-size="10" fill="#2C2C2A" text-anchor="start">CO → mon- + oxide = monoxide</text>
<text x="616" y="590" font-size="10" fill="#2C2C2A" text-anchor="start">元素名尾改 -ide：chlorine → chloride</text>
<text x="616" y="607" font-size="10" fill="#2C2C2A" text-anchor="start">oxide / chloride / fluoride / sulfide</text>
<rect x="30" y="630" width="840" height="62" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
<text x="46" y="654" font-size="11.5" fill="#854F0B" text-anchor="start" font-weight="600">元音省略 Vowel drop —— 前缀以 a / o 结尾、元素名以 o 开头（oxide）时，去掉前缀末尾元音</text>
<text x="46" y="674" font-size="10.5" fill="#2C2C2A" text-anchor="start">mono- + oxide → monoxide　｜　tetra- + oxide → tetroxide　｜　penta- + oxide → pentoxide　｜　hexa- + oxide → hexoxide</text>
<text x="46" y="688" font-size="9.5" fill="#A32D2D" text-anchor="start">× monooxide　× tetraoxide　× pentaoxide　（全是错拼，考试必扣分）</text>
<rect x="30" y="706" width="840" height="66" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.0"/>
<text x="46" y="730" font-size="11.5" fill="#3C3489" text-anchor="start" font-weight="600">中文命名对照 CN naming order —— 顺序与英文相反</text>
<text x="46" y="749" font-size="10.5" fill="#2C2C2A" text-anchor="start">公式：第二元素数目 + 化 + 第一元素数目 + 第一元素名　　例：CO₂ → 二氧化碳　｜　N₂O₄ → 四氧化二氮　｜　CO → 一氧化碳</text>
<text x="46" y="765" font-size="9.5" fill="#5F5E5A" text-anchor="start">第一元素数目为 1 时中文也省略“一碳”的“一”（CO 不是“一碳化一氧”）；对比：离子化合物不用前缀，NaCl = 氯化钠。</text>
<text x="30" y="792" font-size="9.5" fill="#888780" text-anchor="start">口诀：mono 一 · di 二 · tri 三 · tetra 四 · penta 五 · hexa 六 · hepta 七 · octa 八 · nona 九 · deca 十</text>
</svg>