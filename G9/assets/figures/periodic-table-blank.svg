  <text x="30" y="330" font-size="10.5" fill="#5F5E5A">填写：元素符号 symbol ／ 中文名 ／ 英文名　（格子左下角数字为原子序数）</text>
  <text x="30" y="352" font-size="10" fill="#888780">自测方式：先默符号，再默中文名，最后默英文名；三遍全对才算过关。</text>
  <text x="30" y="370" font-size="10" fill="#888780">提示：Na 钠 nà ／ Cl 氯 lǜ ／ Al 铝 lǚ —— 拼音读错，符号就容易写错。</text>
