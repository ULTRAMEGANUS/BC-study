<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1008" width="900" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <title>WHMIS 危险标识图鉴｜WHMIS Hazard Pictograms（1988 圆形 + 2015 菱形）</title>
  <rect width="900" height="1008" fill="#FFFFFF"/>

  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">WHMIS 危险标识图鉴｜WHMIS Hazard Pictograms</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A" text-anchor="end">BC Science 9 · Ch.10 实验室安全｜圆 = 1988 版 · 菱 = 2015 版</text>
  <line x1="30" y1="48" x2="870" y2="48" stroke="#B4B2A9" stroke-width="0.8"/>

  <text x="30" y="72" font-size="13" font-weight="600" fill="#2C2C2A">① WHMIS 1988（旧版，BC 教室仍常见）— 红色圆形边框 + 黑色象形符号</text>
  <text x="30" y="87" font-size="9.5" fill="#888780">共 8 个标识：Class A / B / C / D-1 / D-2 / D-3 / E / F｜red circular border + black pictogram</text>

  <!-- ===== 行 1：A 压缩气体 / B 易燃 / C 氧化性 / D-1 剧毒 ===== -->

  <text x="135" y="97" font-size="9.5" fill="#888780" text-anchor="middle">Class A</text>
  <circle cx="135" cy="155" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(135,155)" fill="#2C2C2A">
    <rect x="-9" y="-33" width="18" height="4.5" rx="2"/>
    <rect x="-5.5" y="-30" width="11" height="10" rx="1.5"/>
    <path d="M -13,-16 C -13,-25 -8,-27 -5,-27 L 5,-27 C 8,-27 13,-25 13,-16 Z"/>
    <rect x="-13" y="-18" width="26" height="42" rx="3"/>
    <rect x="-16" y="22" width="32" height="4.5" rx="2"/>
  </g>
  <text x="135" y="216" font-size="12" fill="#2C2C2A" text-anchor="middle">Compressed gas</text>
  <text x="135" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">压缩气体（钢瓶）</text>

  <text x="345" y="97" font-size="9.5" fill="#888780" text-anchor="middle">Class B</text>
  <circle cx="345" cy="155" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(345,155)">
    <path d="M 0,-34 C 8,-20 16,-17 21,-8 C 26,1 22,12 12,20 C 7,24 4,26 0,28 C -4,26 -7,24 -12,20 C -22,12 -26,1 -21,-8 C -16,-17 -8,-20 0,-34 Z" fill="#2C2C2A"/>
    <path d="M 0,-6 C 4,1 8,3 10,8 C 12,13 8,18 4,20 C 2,21 -2,21 -4,20 C -8,18 -12,13 -10,8 C -8,3 -4,1 0,-6 Z" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="-21" y1="32" x2="21" y2="32" stroke="#2C2C2A" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="345" y="216" font-size="12" fill="#2C2C2A" text-anchor="middle">Flammable &amp; combustible</text>
  <text x="345" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">易燃物（火焰）</text>

  <text x="555" y="97" font-size="9.5" fill="#888780" text-anchor="middle">Class C</text>
  <circle cx="555" cy="155" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(555,155)">
    <g transform="translate(0,-23) scale(0.45)">
      <path d="M 0,-34 C 8,-20 16,-17 21,-8 C 26,1 22,12 12,20 C 7,24 4,26 0,28 C -4,26 -7,24 -12,20 C -22,12 -26,1 -21,-8 C -16,-17 -8,-20 0,-34 Z" fill="#2C2C2A"/>
      <path d="M 0,-6 C 4,1 8,3 10,8 C 12,13 8,18 4,20 C 2,21 -2,21 -4,20 C -8,18 -12,13 -10,8 C -8,3 -4,1 0,-6 Z" fill="none" stroke="#FFFFFF" stroke-width="5.4" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="11" r="15" fill="none" stroke="#2C2C2A" stroke-width="5"/>
  </g>
  <text x="555" y="216" font-size="12" fill="#2C2C2A" text-anchor="middle">Oxidizing material</text>
  <text x="555" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">氧化性物质（O 上托火焰）</text>

  <text x="765" y="97" font-size="9.5" fill="#888780" text-anchor="middle">Class D-1</text>
  <circle cx="765" cy="155" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(765,155) scale(0.88)">
    <g transform="translate(0,13) rotate(30)" fill="#2C2C2A">
      <rect x="-21" y="-3.2" width="42" height="6.4"/>
      <circle cx="-21" cy="-4" r="4.4"/><circle cx="-21" cy="4" r="4.4"/>
      <circle cx="21" cy="-4" r="4.4"/><circle cx="21" cy="4" r="4.4"/>
    </g>
    <g transform="translate(0,13) rotate(-30)" fill="#2C2C2A">
      <rect x="-21" y="-3.2" width="42" height="6.4"/>
      <circle cx="-21" cy="-4" r="4.4"/><circle cx="-21" cy="4" r="4.4"/>
      <circle cx="21" cy="-4" r="4.4"/><circle cx="21" cy="4" r="4.4"/>
    </g>
    <path d="M 0,-39 C 12,-39 19,-30 19,-19 C 19,-12 15,-7 11,-5 L 10,1 C 10,4 7,5 4,5 L -4,5 C -7,5 -10,4 -10,1 L -11,-5 C -15,-7 -19,-12 -19,-19 C -19,-30 -12,-39 0,-39 Z" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2.4"/>
    <ellipse cx="-7.5" cy="-20" rx="5.2" ry="6.2" fill="#2C2C2A"/>
    <ellipse cx="7.5" cy="-20" rx="5.2" ry="6.2" fill="#2C2C2A"/>
    <path d="M 0,-11 L 4.2,-4.5 L -4.2,-4.5 Z" fill="#2C2C2A"/>
    <path d="M -7,1 L 7,1" stroke="#2C2C2A" stroke-width="1.8" fill="none"/>
    <path d="M -3.5,-1.5 L -3.5,5 M 3.5,-1.5 L 3.5,5" stroke="#2C2C2A" stroke-width="1.6" fill="none"/>
  </g>
  <text x="765" y="216" font-size="12" fill="#2C2C2A" text-anchor="middle">Poisonous · immediate &amp; serious</text>
  <text x="765" y="232" font-size="12" fill="#5F5E5A" text-anchor="middle">剧毒（骷髅 + 交叉骨）</text>

  <!-- ===== 行 2：D-2 有毒 / D-3 生物危害 / E 腐蚀性 / F 危险反应性 ===== -->

  <text x="135" y="262" font-size="9.5" fill="#888780" text-anchor="middle">Class D-2</text>
  <circle cx="135" cy="320" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(135,320)" fill="#2C2C2A">
    <rect x="-22" y="-32" width="44" height="11" rx="2"/>
    <rect x="-6.5" y="-21" width="13" height="32" rx="2"/>
    <rect x="-3.5" y="15" width="7" height="12" rx="1.6"/>
    <circle cx="0" cy="31" r="3.2"/>
  </g>
  <text x="135" y="381" font-size="12" fill="#2C2C2A" text-anchor="middle">Poisonous · other toxic effects</text>
  <text x="135" y="397" font-size="12" fill="#5F5E5A" text-anchor="middle">有毒（T + 感叹号）</text>

  <text x="345" y="262" font-size="9.5" fill="#888780" text-anchor="middle">Class D-3</text>
  <circle cx="345" cy="320" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(345,320)" fill="none" stroke="#2C2C2A" stroke-width="5" stroke-linecap="round">
    <path transform="rotate(0) translate(0,-17)" d="M -9.64,11.49 A 15,15 0 1 1 9.64,11.49"/>
    <path transform="rotate(120) translate(0,-17)" d="M -9.64,11.49 A 15,15 0 1 1 9.64,11.49"/>
    <path transform="rotate(240) translate(0,-17)" d="M -9.64,11.49 A 15,15 0 1 1 9.64,11.49"/>
    <circle cx="0" cy="0" r="3.5" stroke-width="2.5"/>
  </g>
  <text x="345" y="381" font-size="12" fill="#2C2C2A" text-anchor="middle">Biohazardous infectious</text>
  <text x="345" y="397" font-size="12" fill="#5F5E5A" text-anchor="middle">生物危害（三叶环）</text>

  <text x="555" y="262" font-size="9.5" fill="#888780" text-anchor="middle">Class E</text>
  <circle cx="555" cy="320" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(555,320)">
    <g transform="translate(-17,-15) rotate(145)" fill="none" stroke="#2C2C2A" stroke-width="2.6" stroke-linecap="round">
      <path d="M -6,-14 L -6,4 A 6,6 0 0 0 6,4 L 6,-14"/>
      <path d="M -8.5,-14 L 8.5,-14"/>
    </g>
    <g transform="translate(12,-16) rotate(125)" fill="none" stroke="#2C2C2A" stroke-width="2.6" stroke-linecap="round">
      <path d="M -6,-14 L -6,4 A 6,6 0 0 0 6,4 L 6,-14"/>
      <path d="M -8.5,-14 L 8.5,-14"/>
    </g>
    <g transform="translate(-9,0) scale(0.65)" fill="#2C2C2A">
      <path d="M 0,-5 C 3,-1.5 5,1 5,3 C 5,5.5 3,7 0,7 C -3,7 -5,5.5 -5,3 C -5,1 -3,-1.5 0,-5 Z"/>
    </g>
    <g transform="translate(21,4) scale(0.65)" fill="#2C2C2A">
      <path d="M 0,-5 C 3,-1.5 5,1 5,3 C 5,5.5 3,7 0,7 C -3,7 -5,5.5 -5,3 C -5,1 -3,-1.5 0,-5 Z"/>
    </g>
    <g fill="none" stroke="#2C2C2A" stroke-width="2.4" stroke-linecap="round">
      <rect x="-30" y="14" width="24" height="12" rx="1.5"/>
      <path d="M -28,14 L -28,6 M -22,14 L -22,6 M -16,14 L -16,6"/>
    </g>
    <circle cx="-18" cy="20" r="4" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2"/>
    <rect x="2" y="14" width="26" height="8" rx="1.5" fill="#2C2C2A"/>
    <circle cx="15" cy="18" r="3.5" fill="#FFFFFF"/>
    <g stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round">
      <path d="M -22,28 L -22,33 M -18,28 L -18,33 M -14,28 L -14,33"/>
      <path d="M 11,24 L 11,29 M 15,24 L 15,29 M 19,24 L 19,29"/>
    </g>
  </g>
  <text x="555" y="381" font-size="12" fill="#2C2C2A" text-anchor="middle">Corrosive material</text>
  <text x="555" y="397" font-size="12" fill="#5F5E5A" text-anchor="middle">腐蚀性物质（滴液蚀穿手与金属板）</text>

  <text x="765" y="262" font-size="9.5" fill="#888780" text-anchor="middle">Class F</text>
  <circle cx="765" cy="320" r="42" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(765,320)">
    <g fill="none" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -20,30 L -20,-30"/>
      <path d="M -20,-30 L 0,-30 C 12,-30 18,-24 18,-17 C 18,-10 12,-5 0,-5 L -20,-5"/>
      <path d="M -9,-5 L 17,30"/>
    </g>
    <g transform="translate(5,7) rotate(20) scale(1.15)" fill="none" stroke-linecap="round">
      <path d="M -6.5,-16 L -6.5,6 A 6.5,6.5 0 0 0 6.5,6 L 6.5,-16" stroke="#2C2C2A" stroke-width="2.6"/>
      <path d="M -9,-16 L 9,-16" stroke="#2C2C2A" stroke-width="2.6"/>
    </g>
    <g stroke="#2C2C2A" stroke-width="2.2" stroke-linecap="round" fill="none">
      <path d="M 9.6,-15.0 L 6.9,-22.5"/>
      <path d="M 11.3,-15.3 L 11.3,-23.3"/>
      <path d="M 13.0,-15.0 L 15.7,-22.5"/>
      <path d="M 14.5,-14.1 L 19.7,-20.3"/>
      <path d="M 15.6,-12.8 L 22.6,-16.8"/>
    </g>
  </g>
  <text x="765" y="381" font-size="12" fill="#2C2C2A" text-anchor="middle">Dangerously reactive</text>
  <text x="765" y="397" font-size="12" fill="#5F5E5A" text-anchor="middle">危险反应性（R 内试管迸裂）</text>

  <!-- ===== 第 2 部分：WHMIS 2015 菱形标识 ===== -->

  <line x1="30" y1="437" x2="870" y2="437" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="30" y="461" font-size="13" font-weight="600" fill="#2C2C2A">② WHMIS 2015（现行 GHS 体系）— 红色菱形边框 + 黑色象形符号</text>
  <text x="30" y="476" font-size="9.5" fill="#888780">共 9 个 pictogram｜red diamond border（square rotated 45°）+ black pictogram｜生物危害仍沿用黑色圆形</text>

  <!-- ===== 2015 行 1：火焰 / 氧化 / 爆炸 ===== -->

  <path d="M 170,508 L 220,558 L 170,608 L 120,558 Z" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(170,558) scale(0.86)">
    <path d="M 0,-34 C 8,-20 16,-17 21,-8 C 26,1 22,12 12,20 C 7,24 4,26 0,28 C -4,26 -7,24 -12,20 C -22,12 -26,1 -21,-8 C -16,-17 -8,-20 0,-34 Z" fill="#2C2C2A"/>
    <path d="M 0,-6 C 4,1 8,3 10,8 C 12,13 8,18 4,20 C 2,21 -2,21 -4,20 C -8,18 -12,13 -10,8 C -8,3 -4,1 0,-6 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="170" y="626" font-size="12" fill="#2C2C2A" text-anchor="middle">Flame 火焰</text>
  <text x="170" y="642" font-size="12" fill="#5F5E5A" text-anchor="middle">Flammable 易燃</text>

  <path d="M 450,508 L 500,558 L 450,608 L 400,558 Z" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(450,558) scale(0.86)">
    <g transform="translate(0,-23) scale(0.45)">
      <path d="M 0,-34 C 8,-20 16,-17 21,-8 C 26,1 22,12 12,20 C 7,24 4,26 0,28 C -4,26 -7,24 -12,20 C -22,12 -26,1 -21,-8 C -16,-17 -8,-20 0,-34 Z" fill="#2C2C2A"/>
      <path d="M 0,-6 C 4,1 8,3 10,8 C 12,13 8,18 4,20 C 2,21 -2,21 -4,20 C -8,18 -12,13 -10,8 C -8,3 -4,1 0,-6 Z" fill="none" stroke="#FFFFFF" stroke-width="5.4" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="11" r="15" fill="none" stroke="#2C2C2A" stroke-width="5"/>
  </g>
  <text x="450" y="626" font-size="12" fill="#2C2C2A" text-anchor="middle">Flame over circle 氧化火焰</text>
  <text x="450" y="642" font-size="12" fill="#5F5E5A" text-anchor="middle">Oxidizing 氧化性</text>

  <path d="M 730,508 L 780,558 L 730,608 L 680,558 Z" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(730,558) scale(0.86)">
    <circle cx="0" cy="8" r="15" fill="#2C2C2A"/>
    <g fill="none" stroke="#2C2C2A" stroke-width="2.6" stroke-linecap="round">
      <path d="M -10,-6 C -15,-11 -15,-16 -18,-20"/>
      <path d="M -18,-20 L -23,-25 M -18,-20 L -17,-27 M -18,-20 L -12,-25"/>
      <path d="M 20,8 L 27,8 M 10,25.3 L 13.5,31.4 M -10,25.3 L -13.5,31.4 M -20,8 L -27,8 M -10,-9.3 L -13.5,-15.4 M 10,-9.3 L 13.5,-15.4"/>
    </g>
    <g fill="#2C2C2A">
      <path d="M 26.9,34.9 L 17.3,30.3 L 22.3,25.3 Z"/>
      <path d="M -26.9,34.9 L -22.3,25.3 L -17.3,30.3 Z"/>
      <path d="M -26.9,-18.9 L -17.3,-14.3 L -22.3,-9.3 Z"/>
      <path d="M 26.9,-18.9 L 22.3,-9.3 L 17.3,-14.3 Z"/>
    </g>
  </g>
  <text x="730" y="626" font-size="12" fill="#2C2C2A" text-anchor="middle">Exploding bomb 爆炸炸弹</text>
  <text x="730" y="642" font-size="12" fill="#5F5E5A" text-anchor="middle">Explosive 爆炸性</text>

  <!-- ===== 2015 行 2：骷髅 / 腐蚀 / 气瓶 ===== -->

  <path d="M 170,656 L 220,706 L 170,756 L 120,706 Z" fill="#FFFFFF" stroke="#A32D2D" stroke-width="3.2"/>
  <g transform="translate(170,706) scale(0.78)">
