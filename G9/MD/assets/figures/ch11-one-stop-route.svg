<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 11-2　「一条龙」解题路径｜The One-Stop Problem Route</title>
  <rect width="900" height="536" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 11-2　「一条龙」解题路径｜The One-Stop Problem Route</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 七步固定顺序，跳步必错</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="70" y="64" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <circle cx="104" cy="81" r="12" fill="#0C447C"/>
  <text x="104" y="81.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="126" y="81" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">给元素 → 查周期表 → 得 atomic number 原子序数</text>
  <path d="M450 98 L450 104" fill="none" stroke="#888780" stroke-width="1.3"/>
  <rect x="70" y="104" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <circle cx="104" cy="121" r="12" fill="#0C447C"/>
  <text x="104" y="121.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="126" y="121" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">原子序数 = 质子数 = 中性原子电子数</text>
  <path d="M450 138 L450 144" fill="none" stroke="#888780" stroke-width="1.3"/>
  <rect x="70" y="144" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.0"/>
  <circle cx="104" cy="161" r="12" fill="#0C447C"/>
  <text x="104" y="161.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="126" y="161" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">按 2-8-8 画 Bohr 图 → 数最外层 → 得 价电子数</text>
  <path d="M450 178 L450 184" fill="none" stroke="#888780" stroke-width="1.3"/>
  <rect x="70" y="184" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <circle cx="104" cy="201" r="12" fill="#0C447C"/>
  <text x="104" y="201.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="126" y="201" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">价电子数 → 族 → 判断 失/得 电子 → 写 离子符号（含电荷）</text>
  <path d="M450 218 L450 224" fill="none" stroke="#888780" stroke-width="1.3"/>
  <rect x="70" y="224" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <circle cx="104" cy="241" r="12" fill="#0C447C"/>
  <text x="104" y="241.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="126" y="241" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">与另一元素的离子用 交叉法 配平总电荷 = 0 → 化学式</text>
  <path d="M450 258 L450 264" fill="none" stroke="#888780" stroke-width="1.3"/>
  <rect x="70" y="264" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.0"/>
  <circle cx="104" cy="281" r="12" fill="#0C447C"/>
  <text x="104" y="281.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="126" y="281" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">判断类型（金属+非金属?）→ 选命名规则 → 英文名 + 中文名</text>
  <path d="M450 298 L450 304" fill="none" stroke="#888780" stroke-width="1.3"/>
  <rect x="70" y="304" width="760" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <circle cx="104" cy="321" r="12" fill="#0C447C"/>
  <text x="104" y="321.5" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">7</text>
  <text x="126" y="321" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">由类型预测 性质（熔沸点 / 导电性 / 状态）</text>
  <rect x="70" y="352" width="760" height="160" rx="8" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.2"/>
  <text x="90" y="374" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">检查清单 Checklist（每题做完都过一遍）</text>
  <text x="100" y="396" font-size="11" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">□ 符号大小写正确？（Co 钴 ≠ CO 一氧化碳）</text>
  <text x="100" y="415" font-size="11" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">□ 化学式是否 最简比、总电荷为 0？</text>
  <text x="100" y="434" font-size="11" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">□ 多变价金属有没有写 罗马数字？</text>
  <text x="100" y="453" font-size="11" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">□ 英文命名：离子化合物没有前缀，分子化合物必须有？</text>
  <text x="100" y="472" font-size="11" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">□ 中文命名顺序是不是「负在前、正在后」？</text>
  <text x="100" y="491" font-size="11" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">□ 双原子分子（O₂ Cl₂ …）下标 2 写了没有？</text>
</svg>
