<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>导电性检测电路｜Conductivity Circuit</title>
  <rect width="900" height="356" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">导电性检测电路｜Conductivity Circuit</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">附录 E · 灯泡亮度 = 导电能力</text>
  <rect x="180" y="78" width="540" height="150" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M300 78 L300 130" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M300 130 L600 130" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M600 130 L600 78" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M180 78 L300 78" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M600 78 L720 78 L720 228" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M180 228 L180 78" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M420 130 A 26 26 0 0 1 472 130" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <path d="M396 130 L496 130" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <text x="560" y="118" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">( ◡ ) = bulb 小灯泡</text>
  <path d="M300 130 L300 176" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M600 130 L600 176" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <rect x="272" y="176" width="56" height="26" rx="3" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.0"/>
  <text x="300" y="189" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">电极 1</text>
  <rect x="572" y="176" width="56" height="26" rx="3" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.0"/>
  <text x="600" y="189" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">电极 2</text>
  <rect x="340" y="202" width="220" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="450" y="217" font-size="11" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">sample 样品（两电极同时插入/接触）</text>
  <path d="M180 228 L720 228" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <rect x="390" y="228" width="120" height="26" rx="3" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.0"/>
  <text x="450" y="241" font-size="10.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">battery 电池</text>
  <rect x="70" y="254" width="760" height="82" rx="8" fill="#FFF8E1" stroke="#BA7517" stroke-width="1.2"/>
  <text x="450" y="274" font-size="12" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Brightness scale 亮度等级</text>
  <rect x="130" y="288" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="195" y="300" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">0</text>
  <text x="195" y="315" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">不亮 dark</text>
  <rect x="300" y="288" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="365" y="300" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="365" y="315" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">微亮 dim</text>
  <rect x="470" y="288" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="535" y="300" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="535" y="315" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">较亮 bright</text>
  <rect x="640" y="288" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="705" y="300" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="705" y="315" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">最亮 very bright</text>
