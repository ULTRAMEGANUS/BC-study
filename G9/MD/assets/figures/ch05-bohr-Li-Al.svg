  <text x="450.0" y="298" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">自检：各层电子数之和必须等于 Z（中性原子）　Al 不能画成 2, 8, 8, 3</text>
