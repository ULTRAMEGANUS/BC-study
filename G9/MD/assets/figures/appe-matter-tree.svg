<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>物质分类树｜Matter Classification Tree</title>
  <rect width="900" height="356" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">物质分类树｜Matter Classification Tree</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">附录 E · 先分两大支，再往下细分</text>
  <rect x="370" y="62" width="160" height="40" rx="8" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.3"/>
  <text x="450" y="82" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">MATTER 物质</text>
  <path d="M450 102 L450 122" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <path d="M250 122 L650 122" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <path d="M250 122 L250 142" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <path d="M650 122 L650 142" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <rect x="150.0" y="142" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#0C447C" stroke-width="1.2"/>
  <text x="250" y="164" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">纯净物</text>
  <text x="250" y="184" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">pure substance</text>
  <rect x="550.0" y="142" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="650" y="164" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">混合物</text>
  <text x="650" y="184" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">mixture</text>
  <path d="M250 198 L250 204" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M650 198 L650 204" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M150 204 L350 204" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M550 204 L750 204" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M150 204 L150 216" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M350 204 L350 216" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M550 204 L550 216" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M750 204 L750 216" fill="none" stroke="#888780" stroke-width="1.4"/>
  <rect x="75.0" y="216" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="150" y="238" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">单质 / 元素</text>
  <text x="150" y="258" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">element</text>
  <rect x="275.0" y="216" width="150" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="350" y="238" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">化合物</text>
  <text x="350" y="258" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">compound</text>
  <rect x="470.0" y="216" width="160" height="56" rx="8" fill="#FFF8E1" stroke="#854F0B" stroke-width="1.2"/>
  <text x="550" y="238" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">均一混合物</text>
  <text x="550" y="258" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">homogeneous</text>
  <rect x="665.0" y="216" width="170" height="56" rx="8" fill="#FFF8E1" stroke="#854F0B" stroke-width="1.2"/>
  <text x="750" y="238" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">非均一混合物</text>
  <text x="750" y="258" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">heterogeneous</text>
  <rect x="70" y="296" width="760" height="40" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="450" y="316" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">关键词：纯净物 = fixed ratio 固定配比；混合物 = variable composition 组成可变</text>
</svg>
