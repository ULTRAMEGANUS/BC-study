  <line x1="91" y1="577" x2="129" y2="577" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="139" y="574" font-size="9.5" fill="#2C2C2A">电子排布</text>
  <line x1="181" y1="577" x2="223" y2="577" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="229" y="574" font-size="9.5" fill="#2C2C2A">价电子</text>
  <line x1="261" y1="577" x2="287" y2="577" stroke="#B4B2A9" stroke-width="0.8"/>

