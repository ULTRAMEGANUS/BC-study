  <line x1="461" y1="577" x2="503" y2="577" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="509" y="574" font-size="9.5" fill="#2C2C2A">价电子</text>
  <line x1="541" y1="577" x2="567" y2="577" stroke="#B4B2A9" stroke-width="0.8"/>

  <circle cx="730" cy="460" r="13" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
