  <line x1="30" y1="836" x2="870" y2="836" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="30" y="854" font-size="9.5" fill="#888780">提示 Hint：前 20 号元素按 2, 8, 8 填 —— 第 3 层最多只放 8 个，不要写成 18；第 4 层只有 K (2,8,8,1) 与 Ca (2,8,8,2) 用到，各 2 个。</text>
  <text x="30" y="870" font-size="9.5" fill="#888780">核内：质子数 = 原子序数 Z，中子数 = 质量数 A − Z；最外层有几个电子，价电子就是几（He 只有 2 个，属 duet rule 二重规则）。</text>
