<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 4-4　为什么稀有气体「什么都不做」｜Why Noble Gases Are Unreactive</title>
  <rect width="900" height="392" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 4-4　为什么稀有气体「什么都不做」｜Why Noble Gases Are Unreactive</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 满的价电子层 = 稳定 = 惰性</text>
  <rect x="60" y="62" width="780" height="176" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="450" y="88" font-size="14" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Noble gases 稀有气体：最外层已经是「满」的状态</text>
  <circle cx="110" cy="122" r="13" fill="#3B6D11"/>
  <text x="110" y="122.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="140" y="122" font-size="14" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">He</text>
  <text x="176" y="122" font-size="12" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">氦</text>
  <text x="300" y="122" font-size="12" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">只有第 1 层，2 个电子</text>
  <text x="520" y="122" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">→</text>
  <text x="560" y="122" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">该层已满（2/2）</text>
  <circle cx="110" cy="158" r="13" fill="#3B6D11"/>
  <text x="110" y="158.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="140" y="158" font-size="14" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">Ne</text>
  <text x="176" y="158" font-size="12" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">氖</text>
  <text x="300" y="158" font-size="12" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">最外层 8 个电子</text>
  <text x="520" y="158" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">→</text>
  <text x="560" y="158" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">已 满（8/8）</text>
  <circle cx="110" cy="194" r="13" fill="#3B6D11"/>
  <text x="110" y="194.5" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="140" y="194" font-size="14" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">Ar</text>
  <text x="176" y="194" font-size="12" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">氩</text>
  <text x="300" y="194" font-size="12" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">最外层 8 个电子</text>
  <text x="520" y="194" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">→</text>
  <text x="560" y="194" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">已 满（8/8）</text>
  <rect x="60" y="252" width="780" height="96" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="450" y="274" font-size="13" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">对比 People who are NOT satisfied：</text>
  <text x="92" y="300" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">第 1 族 Na</text>
  <text x="92" y="320" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">最外层 1 个 → 丢掉它最省事</text>
  <text x="282" y="310" font-size="13" font-weight="700" fill="#0C447C" text-anchor="end" dominant-baseline="central">Na⁺  (+1)</text>
  <text x="342" y="300" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">第 17 族 Cl</text>
  <text x="342" y="320" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">最外层 7 个 → 再补 1 个最省事</text>
  <text x="532" y="310" font-size="13" font-weight="700" fill="#854F0B" text-anchor="end" dominant-baseline="central">Cl⁻  (−1)</text>
  <text x="592" y="300" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">第 18 族 Ar</text>
  <text x="592" y="320" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">已满 → 既不想丢也不想补</text>
  <text x="782" y="310" font-size="13" font-weight="700" fill="#3B6D11" text-anchor="end" dominant-baseline="central">不变化 (0)</text>
  <rect x="60" y="358" width="780" height="26" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="450" y="371" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">⇒ full valence shell 满的价电子层 = stable 稳定 = inert 惰性</text>
</svg>
