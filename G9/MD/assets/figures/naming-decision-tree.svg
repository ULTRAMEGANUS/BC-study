<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>化合物命名决策树｜Naming Decision Tree</title>
  <rect width="900" height="840" fill="#FFFFFF"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="19" font-weight="600" fill="#2C2C2A">化合物命名决策树｜Naming Decision Tree</text>
  <text x="870" y="30" font-size="10.5" fill="#5F5E5A" text-anchor="end">BC Science 9 · 先判断类别，再套规则</text>

  <rect x="330" y="64" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.9"/>
  <text x="450" y="86" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">给定一个化学式</text>

  <path d="M450 108 L450 136" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="240" y="140" width="420" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.9"/>
  <text x="450" y="161" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">第一个元素是金属（或 NH₄⁺）吗？</text>
  <text x="450" y="180" font-size="10.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Is the first element a metal (or ammonium)?</text>

  <path d="M240 198 L240 221" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M660 198 L660 221" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="232" y="212" font-size="10.5" font-weight="600" fill="#3B6D11" text-anchor="end">是 Yes</text>
  <text x="668" y="212" font-size="10.5" font-weight="600" fill="#A32D2D">否 No</text>

  <rect x="60" y="225" width="360" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="240" y="243" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">离子化合物 ionic compound</text>
  <text x="240" y="262" font-size="10.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">金属 + 非金属，电子转移 transfer of electrons</text>

  <rect x="480" y="225" width="360" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="660" y="243" font-size="14" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">分子（共价）化合物 molecular compound</text>
  <text x="660" y="262" font-size="10.5" fill="#BA7517" text-anchor="middle" dominant-baseline="central">非金属 + 非金属，共用电子对 sharing of electrons</text>

  <rect x="60" y="295" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="74" y="315" font-size="12" font-weight="600" fill="#0C447C">① 含多原子离子 → 直接用离子名</text>
  <text x="74" y="334" font-size="10.5" fill="#5F5E5A">Na⁺ + OH⁻ → NaOH　sodium hydroxide 氢氧化钠</text>
  <text x="74" y="350" font-size="10.5" fill="#5F5E5A">Ca²⁺ + CO₃²⁻ → CaCO₃　calcium carbonate 碳酸钙</text>

  <rect x="60" y="371" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="74" y="391" font-size="12" font-weight="600" fill="#0C447C">② 多变价金属 → 加罗马数字标电荷</text>
  <text x="74" y="410" font-size="10.5" fill="#5F5E5A">FeCl₃ iron(III) chloride 氯化铁</text>
  <text x="74" y="426" font-size="10.5" fill="#5F5E5A">FeCl₂ iron(II) chloride 氯化亚铁</text>

  <rect x="60" y="447" width="360" height="66" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="74" y="467" font-size="12" font-weight="600" fill="#0C447C">③ 其余 → 金属名 + 非金属词根 -ide</text>
  <text x="74" y="486" font-size="10.5" fill="#5F5E5A">Mg²⁺ + F⁻ → MgF₂ magnesium fluoride 氟化镁</text>
  <text x="74" y="502" font-size="10.5" fill="#5F5E5A">交叉法：电荷数交叉成下标，再约成最简比</text>

  <rect x="60" y="523" width="360" height="76" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
  <text x="74" y="543" font-size="11.5" font-weight="600" fill="#0C447C">例题｜Worked example</text>
  <text x="74" y="562" font-size="10.5" fill="#2C2C2A">Al³⁺ + O²⁻ → Al₂O₃</text>
  <text x="74" y="578" font-size="10.5" fill="#185FA5">aluminium oxide ／ 氧化铝</text>
  <text x="74" y="593" font-size="9.5" fill="#3B6D11">验算：2×(+3) + 3×(−2) = 0 ✔</text>

  <rect x="480" y="295" width="360" height="62" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="494" y="312" font-size="12" font-weight="600" fill="#854F0B">希腊数字前缀｜Greek prefixes</text>
  <text x="494" y="331" font-size="10" fill="#5F5E5A">mono-1　di-2　tri-3　tetra-4　penta-5</text>
  <text x="494" y="347" font-size="10" fill="#5F5E5A">hexa-6　hepta-7　octa-8　nona-9　deca-10</text>

  <rect x="480" y="365" width="360" height="96" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="494" y="384" font-size="12" font-weight="600" fill="#854F0B">三条硬性规则</text>
  <text x="494" y="403" font-size="10.5" fill="#2C2C2A">1. 第一个元素仅当数目 &gt; 1 时才加前缀</text>
  <text x="494" y="421" font-size="10.5" fill="#2C2C2A">2. 第一个元素永不用 mono-</text>
  <text x="494" y="439" font-size="10.5" fill="#2C2C2A">3. 第二个元素必加前缀，词尾改为 -ide</text>
  <text x="494" y="454" font-size="9.5" fill="#888780">元音省略：monoxide / pentoxide / hexoxide（非 monooxide）</text>

  <rect x="480" y="471" width="360" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="494" y="490" font-size="12" font-weight="600" fill="#854F0B">中文命名顺序</text>
  <text x="494" y="509" font-size="10.5" fill="#2C2C2A">第二元素数目 + 化 + 第一元素数目 + 第一元素</text>
  <text x="494" y="522" font-size="9.5" fill="#888780">CO₂ 二氧化碳　N₂O₄ 四氧化二氮</text>

  <rect x="480" y="535" width="360" height="76" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
  <text x="494" y="555" font-size="11.5" font-weight="600" fill="#854F0B">例题｜Worked example</text>
  <text x="494" y="574" font-size="10.5" fill="#2C2C2A">N₂O₄ → dinitrogen tetroxide ／ 四氧化二氮</text>
  <text x="494" y="590" font-size="10.5" fill="#2C2C2A">CO → carbon monoxide ／ 一氧化碳</text>
  <text x="494" y="605" font-size="9.5" fill="#A32D2D">不是 monocarbon monoxide ✗</text>

  <rect x="60" y="616" width="780" height="62" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.9"/>
  <text x="74" y="636" font-size="12" font-weight="600" fill="#2C2C2A">俗名必须单独背｜Common names have no rule</text>
  <text x="74" y="655" font-size="10.5" fill="#5F5E5A">H₂O water 水　NH₃ ammonia 氨　CH₄ methane 甲烷　O₃ ozone 臭氧　H₂O₂ hydrogen peroxide 过氧化氢</text>
  <text x="74" y="670" font-size="9.5" fill="#888780">这些不按前缀规则命名，遇到就只能认。NH₃ 若按规则会是 nitrogen trihydride，但考试要求写 ammonia。</text>

  <rect x="60" y="694" width="780" height="76" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.2"/>
  <text x="74" y="715" font-size="12.5" font-weight="600" fill="#A32D2D">英中顺序相反｜The order is REVERSED in Chinese</text>
  <text x="74" y="736" font-size="11" fill="#2C2C2A">英文：metal + non-metal-ide（正离子在前）　→　sodium chloride</text>
  <text x="74" y="754" font-size="11" fill="#2C2C2A">中文：非金属 + 化 + 金属（负离子在前）　→　氯化钠</text>
  <text x="74" y="769" font-size="9.5" fill="#A32D2D">-ide 对应中文的「化」。写成「钠化氯」是错的 ✗</text>

  <text x="30" y="800" font-size="10" fill="#888780">顺读用这张图命名；倒读用这张图判断类别：看到罗马数字或碳酸根／氢氧根 → 离子化合物；看到希腊前缀 → 分子化合物。</text>
  <text x="30" y="818" font-size="10" fill="#888780">对应 BC Science 9 Content：The arrangement of electrons determines the compounds formed by elements.</text>
</svg>
