<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>例题 B　判断 ionic / molecular｜Judge the Type</title>
  <rect width="900" height="452" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">例题 B　判断 ionic / molecular｜Judge the Type</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 判据只有一个：有没有 metal 或 NH₄⁺</text>
  <rect x="50" y="58" width="800" height="28" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
  <text x="450" y="72" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">判据：有没有 metal 或 NH₄⁺？ 有 → ionic；全非金属 → molecular</text>
  <rect x="50" y="92" width="800" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="105" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">物质</text>
  <text x="122" y="105" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">元素组成</text>
  <text x="310" y="105" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">判定</text>
  <text x="520" y="105" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">英文 / 中文名</text>
  <rect x="50" y="118" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="138.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(a)</text>
  <rect x="112" y="118" width="188" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="122" y="138.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Mg 金属 + O</text>
  <rect x="300" y="118" width="210" height="40" rx="4" fill="#E6F1FB" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="310" y="138.0" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">IONIC</text>
  <rect x="510" y="118" width="340" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="520" y="138.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">magnesium oxide 氧化镁</text>
  <rect x="50" y="158" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="178.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(b)</text>
  <rect x="112" y="158" width="188" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="122" y="178.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">S + O 全非金属</text>
  <rect x="300" y="158" width="210" height="40" rx="4" fill="#EAF3DE" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="310" y="178.0" font-size="11.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">MOLECULAR</text>
  <rect x="510" y="158" width="340" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="520" y="178.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">sulfur dioxide 二氧化硫</text>
  <rect x="50" y="198" width="62" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="216.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(c)</text>
  <rect x="112" y="198" width="188" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="122" y="216.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">N, H, Cl 全非金属</text>
  <rect x="300" y="198" width="210" height="52" rx="4" fill="#E6F1FB" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="310" y="216.0" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">IONIC ★</text>
  <rect x="510" y="198" width="340" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="520" y="216.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">ammonium chloride 氯化铵</text>
  <text x="520" y="234" font-size="10" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">★ 含 NH₄⁺ 多原子阳离子——例外！</text>
  <rect x="50" y="238" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="258.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(d)</text>
  <rect x="112" y="238" width="188" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="122" y="258.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">C + H 全非金属</text>
  <rect x="300" y="238" width="210" height="40" rx="4" fill="#EAF3DE" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="310" y="258.0" font-size="11.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">MOLECULAR</text>
  <rect x="510" y="238" width="340" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="520" y="258.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">methane 甲烷（俗名，必背）</text>
  <rect x="50" y="278" width="62" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="296.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(e)</text>
  <rect x="112" y="278" width="188" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="122" y="296.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Si 类金属 + O</text>
  <rect x="300" y="278" width="210" height="52" rx="4" fill="#EAF3DE" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="310" y="296.0" font-size="11.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">MOLECULAR</text>
  <rect x="510" y="278" width="340" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="520" y="296.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">silicon dioxide 二氧化硅</text>
  <text x="520" y="314" font-size="10" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">★ Si 是 metalloid，按非金属处理</text>
  <rect x="50" y="318" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="60" y="338.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">(f)</text>
  <rect x="112" y="318" width="188" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="122" y="338.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">H + F 全非金属</text>
  <rect x="300" y="318" width="210" height="40" rx="4" fill="#EAF3DE" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="310" y="338.0" font-size="11.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">MOLECULAR</text>
  <rect x="510" y="318" width="340" height="40" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="520" y="338.0" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">hydrogen monofluoride 氟化氢</text>
  <rect x="50" y="370" width="800" height="84" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="66" y="390" font-size="12" font-weight="700" fill="#854F0B" text-anchor="start" dominant-baseline="central">再验证一轮（性质反推）：</text>
  <text x="66" y="412" font-size="11.5" fill="#854F0B" text-anchor="start" dominant-baseline="central">(a) MgO 熔点 2852 ℃、熔融导电 → IONIC ✓　　　(b) SO₂ 室温是气体、不导电 → MOLECULAR ✓</text>
  <text x="66" y="434" font-size="11.5" fill="#854F0B" text-anchor="start" dominant-baseline="central">(f) HF 溶于水会微弱导电【Extension → Science 10】；9 年级仍按「非金属+非金属 = molecular」判定。</text>
</svg>
