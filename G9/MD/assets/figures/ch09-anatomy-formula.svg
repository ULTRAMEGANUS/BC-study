<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 9-4　系数 vs 下标解剖图｜Anatomy of a Formula</title>
  <rect width="900" height="336" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 9-4　系数 vs 下标解剖图｜Anatomy of a Formula</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 系数可改，下标不可改</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="300" y="76" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">coefficient 系数（可改）</text>
  <path d="M300 90 L300 122" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="276" y="126" width="48" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
  <text x="300" y="146" font-size="22" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="360" y="146" font-size="30" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <path d="M368 166 L368 196" fill="none" stroke="#BA7517" stroke-width="1.6"/>
  <path d="M400 166 L400 196" fill="none" stroke="#BA7517" stroke-width="1.6"/>
  <path d="M368 196 L400 196" fill="none" stroke="#BA7517" stroke-width="1.6"/>
  <path d="M384 196 L384 210" fill="none" stroke="#BA7517" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="392" y="224" font-size="12" font-weight="700" fill="#854F0B" text-anchor="start" dominant-baseline="central">subscript 下标（不可改）</text>
  <text x="500" y="146" font-size="12" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">← 元素符号</text>
  <rect x="70" y="244" width="760" height="76" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="450" y="266" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2 H₂O = 2 个水分子 = 4 个 H 原子（2×2）+ 2 个 O 原子（2×1）</text>
  <text x="450" y="292" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">算原子总数公式：原子数 = 系数 × 下标</text>
  <text x="450" y="312" font-size="11.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">例：3Ca(OH)₂ → Ca = 3×1 = 3；O = 3×2 = 6；H = 3×2 = 6</text>
</svg>
