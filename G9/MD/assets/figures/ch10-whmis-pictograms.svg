  <text x="438" y="116" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">② CORROSIVE</text>
  <text x="438" y="136" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">腐蚀性</text>
  <text x="438" y="160" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">试管滴液腐蚀手和桌面 → 戴手套、大量水冲洗 15 min</text>
  <rect x="600" y="76" width="260" height="132" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
