  <path d="M660 140 L644 150" fill="none" stroke="#2C2C2A" stroke-width="2.6"/>
  <text x="708" y="116" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">③ TOXIC</text>
  <text x="708" y="136" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">有毒</text>
  <text x="708" y="160" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">骷髅 + 交叉骨 → 少量即可致命</text>
  <rect x="60" y="214" width="260" height="132" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <path d="M112 238 L146 272 L112 306 L78 272 Z" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.8"/>
