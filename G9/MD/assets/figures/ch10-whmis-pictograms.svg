  <path d="M129 416 L136 410 L136 422 Z" fill="#2C2C2A"/>
  <text x="168" y="392" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">⑦ ENVIRONMENT</text>
  <text x="168" y="412" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">环境危害</text>
  <text x="168" y="436" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">枯树 + 死鱼 → 对水生生物有毒</text>
