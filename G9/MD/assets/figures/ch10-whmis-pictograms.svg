  <path d="M378 250 L386 250" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <text x="438" y="254" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">⑤ COMPRESSED GAS</text>
  <text x="438" y="274" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">压缩气体</text>
  <text x="438" y="298" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">钢气瓶 → 固定存放、防撞击受热</text>
  <rect x="600" y="214" width="260" height="132" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
