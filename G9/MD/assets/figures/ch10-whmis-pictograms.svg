  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 10-3　WHMIS 标识图形卡｜WHMIS Pictogram Cards</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 菱形边框 + 黑色符号</text>
  <rect x="60" y="76" width="260" height="132" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <path d="M112 100 L146 134 L112 168 L78 134 Z" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.8"/>
  <path d="M112 118 C122 130 120 146 112 150 C104 146 102 130 112 118 Z" fill="#2C2C2A"/>
  <text x="168" y="116" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">① FLAMMABLE</text>
  <text x="168" y="136" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">易燃</text>
  <text x="168" y="160" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">火焰 flame → 远离明火，改用热水浴加热</text>
  <rect x="330" y="76" width="260" height="132" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
