  <circle cx="661.5" cy="277.5" r="6.5" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
  <circle cx="642.5" cy="277.5" r="6.5" fill="none" stroke="#2C2C2A" stroke-width="1.8"/>
  <circle cx="652" cy="272" r="3" fill="#2C2C2A"/>
  <text x="708" y="254" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">⑥ BIOHAZARD</text>
  <text x="708" y="274" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">生物危害</text>
  <text x="708" y="298" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">三叶环 trefoil → 生物材料，严禁带离</text>
