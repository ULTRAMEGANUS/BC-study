  <text x="438" y="392" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">⑧ EXPLOSIVE</text>
  <text x="438" y="412" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">爆炸性</text>
  <text x="438" y="436" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">炸弹 + 碎片 → 防震、防热、防摩擦</text>
  <rect x="600" y="352" width="260" height="132" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <path d="M652 376 L686 410 L652 444 L618 410 Z" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.8"/>
  <rect x="649" y="396" width="6" height="20" rx="8" fill="#2C2C2A" stroke="#2C2C2A" stroke-width="0"/>
