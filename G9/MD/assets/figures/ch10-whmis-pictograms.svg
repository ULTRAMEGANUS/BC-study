  <text x="168" y="274" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">氧化性</text>
  <text x="168" y="298" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">圆圈上托火焰 → 助燃，远离可燃物</text>
