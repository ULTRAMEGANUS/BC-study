  <path d="M388.5 402.4 L395.8 397.1" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
  <path d="M390.7 407.3 L399.5 405.4" fill="none" stroke="#2C2C2A" stroke-width="2.0"/>
