  <text x="708" y="392" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">⑨ IRRITANT</text>
  <text x="708" y="412" font-size="13" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">刺激性</text>
  <text x="708" y="436" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">感叹号 → 引起皮肤/呼吸道不适</text>
  <rect x="50" y="494" width="800" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="450" y="510" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">所有标识统一为：菱形边框（旋转 45° 的正方形）＋ 黑色符号；边框 ◇　底色白　符号黑</text>
