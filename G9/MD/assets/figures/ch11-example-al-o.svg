<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 541" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 11-5　一条龙示范 2：Al 与 O｜Worked Example — Aluminium + Oxygen</title>
  <rect width="900" height="541" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 11-5　一条龙示范 2：Al 与 O｜Worked Example — Aluminium + Oxygen</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 电荷不整除 → 用最小公倍数</text>
  <text x="229.0" y="70" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Al  铝  Z = 13</text>
  <text x="229.0" y="89" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">电子排布 = 2, 8, 3　　(A = 27)</text>
  <rect x="106" y="110" width="254" height="34" rx="4" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.1"/>
  <text x="98" y="127.0" font-size="10.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">第3层 (M)</text>
  <circle cx="124" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="146" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="168" cy="127.0" r="6.5" fill="#0C447C"/>
  <text x="350" y="127.0" font-size="13.5" font-weight="700" fill="#0C447C" text-anchor="end" dominant-baseline="central">3</text>
  <text x="368" y="127.0" font-size="9.5" font-weight="600" fill="#185FA5" text-anchor="start" dominant-baseline="central">← 价电子</text>
  <rect x="106" y="144" width="254" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="98" y="161.0" font-size="10.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">第2层 (L)</text>
  <circle cx="124" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="146" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="168" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="190" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="212" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="234" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="256" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="278" cy="161.0" r="6.5" fill="#0C447C"/>
  <text x="350" y="161.0" font-size="13.5" font-weight="700" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">8</text>
  <rect x="106" y="178" width="254" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="98" y="195.0" font-size="10.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">第1层 (K)</text>
  <circle cx="124" cy="195.0" r="6.5" fill="#0C447C"/>
  <circle cx="146" cy="195.0" r="6.5" fill="#0C447C"/>
  <text x="350" y="195.0" font-size="13.5" font-weight="700" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">2</text>
  <rect x="171.0" y="230" width="124" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.1"/>
  <text x="233.0" y="245" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">13 p⁺</text>
  <text x="233.0" y="262" font-size="12.5" font-weight="700" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">14 n⁰</text>
  <text x="307.0" y="253" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">原子核 nucleus</text>
  <text x="671.0" y="70" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O  氧  Z = 8</text>
  <text x="671.0" y="89" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">电子排布 = 2, 6　　(A = 16)</text>
  <rect x="548" y="110" width="254" height="34" rx="4" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.1"/>
  <text x="540" y="127.0" font-size="10.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">第2层 (L)</text>
  <circle cx="566" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="588" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="610" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="632" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="654" cy="127.0" r="6.5" fill="#0C447C"/>
  <circle cx="676" cy="127.0" r="6.5" fill="#0C447C"/>
  <text x="792" y="127.0" font-size="13.5" font-weight="700" fill="#0C447C" text-anchor="end" dominant-baseline="central">6</text>
  <text x="810" y="127.0" font-size="9.5" font-weight="600" fill="#185FA5" text-anchor="start" dominant-baseline="central">← 价电子</text>
  <rect x="548" y="144" width="254" height="34" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="540" y="161.0" font-size="10.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">第1层 (K)</text>
  <circle cx="566" cy="161.0" r="6.5" fill="#0C447C"/>
  <circle cx="588" cy="161.0" r="6.5" fill="#0C447C"/>
  <text x="792" y="161.0" font-size="13.5" font-weight="700" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">2</text>
  <rect x="613.0" y="196" width="124" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.1"/>
  <text x="675.0" y="211" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">8 p⁺</text>
  <text x="675.0" y="228" font-size="12.5" font-weight="700" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">8 n⁰</text>
  <text x="749.0" y="219" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">原子核 nucleus</text>
  <text x="70" y="298" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 1–2　Al 原子序数 13 → 13 p⁺，13 e⁻；O 原子序数 8 → 8 p⁺，8 e⁻</text>
  <text x="70" y="318" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 4　Al → 失去 3 个 → Al³⁺（cation）　O → 得到 2 个 → O²⁻（anion）</text>
  <text x="70" y="338" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 5　交叉法：Al³⁺ 与 O²⁻ 的最小公倍数是 6 → 2×(+3) = +6，3×(−2) = −6　→　Al₂O₃</text>
  <text x="70" y="358" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 6　金属 + 非金属 → IONIC　英文 aluminium oxide（BC 拼写）　中文 氧化铝</text>
  <text x="70" y="378" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 7　白色固体，熔点极高（约 2072 ℃），硬度大；不溶于水；固体不导电（熔融时可导电）</text>
  <text x="70" y="398" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">　　　　天然形式为刚玉 corundum，含杂质时即红宝石 / 蓝宝石</text>
  <rect x="60" y="414" width="780" height="77" rx="7" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="78" y="428" font-size="11" font-weight="700" fill="#854F0B" text-anchor="start" dominant-baseline="central">── 延伸：为什么铝制品耐腐蚀？────────────────────</text>
  <text x="78" y="447" font-size="11" fill="#854F0B" text-anchor="start" dominant-baseline="central">铝很活泼，表面立刻与 O₂ 反应生成一层致密且牢固的 Al₂O₃ 薄膜，隔绝内部铝与空气/水 → 不再继续被腐蚀。</text>
  <text x="78" y="466" font-size="11" fill="#854F0B" text-anchor="start" dominant-baseline="central">对比：铁生成的 Fe₂O₃·xH₂O 铁锈疏松多孔，会不断剥落，所以铁会一直锈穿，而铝不会。</text>
</svg>
