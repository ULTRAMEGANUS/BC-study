<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 8-3　单键 / 双键 / 三键｜Single, Double and Triple Bonds</title>
  <rect width="900" height="320" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 8-3　单键 / 双键 / 三键｜Single, Double and Triple Bonds</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 短线数量 = 共用电子对数量</text>
  <rect x="40" y="62" width="260" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="170" y="74" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">单键 single bond</text>
  <text x="170" y="90" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(1 对共用电子)</text>
  <text x="124" y="146" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="216" y="146" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <path d="M148 146.0 L192 146.0" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <text x="170" y="186" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">hydrogen 氢气 H₂</text>
  <text x="170" y="206" font-size="11" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">键长最长、键能最小</text>
  <rect x="320" y="62" width="260" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="450" y="74" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">双键 double bond</text>
  <text x="450" y="90" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(2 对共用电子)</text>
  <text x="404" y="146" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="496" y="146" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <path d="M428 142.0 L472 142.0" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <path d="M428 150.0 L472 150.0" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <text x="450" y="186" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">oxygen 氧气 O₂</text>
  <text x="450" y="206" font-size="11" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">键长居中，键更强</text>
  <rect x="600" y="62" width="260" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="730" y="74" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">三键 triple bond</text>
  <text x="730" y="90" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(3 对共用电子)</text>
  <text x="684" y="146" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="776" y="146" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">N</text>
  <path d="M708 138.0 L752 138.0" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <path d="M708 146.0 L752 146.0" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <path d="M708 154.0 L752 154.0" fill="none" stroke="#2C2C2A" stroke-width="2.2"/>
  <text x="730" y="186" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">nitrogen 氮气 N₂</text>
  <text x="730" y="206" font-size="11" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">键长最短，键最强（N₂ 极稳定）</text>
  <rect x="50" y="234" width="800" height="30" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="450" y="249" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">为什么 N₂ 这么稳定、能占空气 78%？因为三键太难被拉断。</text>
  <text x="450" y="284" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">双键不是「画得粗一点」，而是实实在在 4 个电子参与</text>
</svg>
