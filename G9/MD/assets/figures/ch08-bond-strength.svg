<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 8-6　共价键 vs 分子间作用力｜Bond Strength Clarified</title>
  <rect width="900" height="340" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 8-6　共价键 vs 分子间作用力｜Bond Strength Clarified</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 强的是分子内部，弱的是分子之间</text>
  <rect x="50" y="62" width="360" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.1"/>
  <text x="230" y="79" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">分子内部 INSIDE the molecule</text>
  <rect x="70" y="106" width="320" height="130" rx="10" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.3"/>
  <text x="160" y="152" font-size="19" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="230" y="152" font-size="19" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="300" y="152" font-size="19" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <path d="M178 152 L204 152" fill="none" stroke="#2C2C2A" stroke-width="2.6"/>
  <path d="M256 152 L282 152" fill="none" stroke="#2C2C2A" stroke-width="2.6"/>
  <text x="230" y="186" font-size="11.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">共用电子对　共价键 COVALENT</text>
  <text x="230" y="208" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">★ 非常强 ★　(~ 400 kJ/mol)</text>
  <rect x="490" y="62" width="360" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.1"/>
  <text x="670" y="79" font-size="13" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">分子之间 BETWEEN molecules</text>
  <rect x="500" y="106" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="575" y="146" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <text x="575" y="168" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">分子</text>
  <rect x="690" y="106" width="150" height="100" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="765" y="146" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂O</text>
  <text x="765" y="168" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">分子</text>
  <circle cx="660" cy="140" r="2.6" fill="#BA7517"/>
  <circle cx="660" cy="154" r="2.6" fill="#BA7517"/>
  <circle cx="660" cy="168" r="2.6" fill="#BA7517"/>
  <text x="670" y="226" font-size="11.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">↑ intermolecular force 分子间作用力</text>
  <text x="670" y="246" font-size="11.5" fill="#854F0B" text-anchor="middle" dominant-baseline="central">★ 非常弱 ★　(~ 40 kJ/mol，约 1/10)</text>
  <rect x="50" y="262" width="800" height="62" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="66" y="282" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">加热沸腾时：破的是 ──→ 分子之间的「点线」，不是分子内部的「短线」</text>
  <text x="66" y="306" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">⇒ 所以 H₂O 到 100 ℃ 就沸腾，但 H₂O 分子本身并没有肢解成 H 和 O。</text>
</svg>
