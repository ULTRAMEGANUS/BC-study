<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 1-3　原子结构与尺度｜Atomic Structure &amp; Scale</title>
  <rect width="900" height="470" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 1-3　原子结构与尺度｜Atomic Structure &amp; Scale</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 以钠原子 Na-23 为例（11 p⁺ / 12 n⁰）</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <circle cx="235" cy="250" r="178" fill="#FBFAF7" stroke="#185FA5" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="235" y="92" font-size="10.5" font-weight="600" fill="#185FA5" text-anchor="middle" dominant-baseline="central">电子云区域 electron cloud</text>
  <text x="235" y="108" font-size="9" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">（电子在这里运动，位置不固定）</text>
  <circle cx="115" cy="180" r="4.5" fill="#185FA5"/>
  <circle cx="140" cy="270" r="4.5" fill="#185FA5"/>
  <circle cx="165" cy="130" r="4.5" fill="#185FA5"/>
  <circle cx="180" cy="325" r="4.5" fill="#185FA5"/>
  <circle cx="205" cy="215" r="4.5" fill="#185FA5"/>
  <circle cx="220" cy="380" r="4.5" fill="#185FA5"/>
  <circle cx="245" cy="100" r="4.5" fill="#185FA5"/>
  <circle cx="260" cy="190" r="4.5" fill="#185FA5"/>
  <circle cx="280" cy="290" r="4.5" fill="#185FA5"/>
  <circle cx="300" cy="155" r="4.5" fill="#185FA5"/>
  <circle cx="320" cy="265" r="4.5" fill="#185FA5"/>
  <circle cx="340" cy="205" r="4.5" fill="#185FA5"/>
  <circle cx="295" cy="365" r="4.5" fill="#185FA5"/>
  <circle cx="130" cy="345" r="4.5" fill="#185FA5"/>
  <circle cx="355" cy="320" r="4.5" fill="#185FA5"/>
  <circle cx="195" cy="90" r="4.5" fill="#185FA5"/>
  <circle cx="250" cy="340" r="4.5" fill="#185FA5"/>
  <circle cx="330" cy="380" r="4.5" fill="#185FA5"/>
  <circle cx="105" cy="280" r="4.5" fill="#185FA5"/>
  <circle cx="270" cy="410" r="4.5" fill="#185FA5"/>
  <circle cx="165" cy="130" r="6.5" fill="#185FA5"/>
  <text x="165" y="110" font-size="11" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">e⁻</text>
  <circle cx="340" cy="205" r="6.5" fill="#185FA5"/>
  <text x="360" y="190" font-size="11" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">e⁻</text>
  <circle cx="330" cy="380" r="6.5" fill="#185FA5"/>
  <text x="345" y="400" font-size="11" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">e⁻</text>
  <circle cx="235" cy="250" r="17" fill="#A32D2D"/>
  <circle cx="229" cy="244" r="5" fill="#C9A0A0"/>
  <path d="M249 238 L331 176" fill="none" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="375" y="162" font-size="11.5" font-weight="600" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">原子核 nucleus</text>
  <text x="375" y="180" font-size="10.5" font-weight="600" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">11 p⁺ + 12 n⁰</text>
  <text x="375" y="198" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">直径只有原子的 1/100 000</text>
  <rect x="470" y="92" width="400" height="96" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="486" y="112" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">尺度对比 Scale</text>
  <text x="486" y="134" font-size="10.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">原子直径　　≈ 1 × 10⁻¹⁰ m</text>
  <text x="486" y="154" font-size="10.5" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">原子核直径　≈ 1 × 10⁻¹⁵ m</text>
  <text x="486" y="174" font-size="10" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">两者相差约 10 万倍</text>
  <rect x="470" y="200" width="400" height="96" rx="8" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="486" y="220" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">质量分布 Mass</text>
  <text x="486" y="242" font-size="10.5" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">原子核占原子总质量的 99.9% 以上</text>
  <text x="486" y="262" font-size="9.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">电子质量极小，计算相对原子质量时可忽略</text>
  <text x="486" y="282" font-size="10" font-weight="600" fill="#0C447C" text-anchor="start" dominant-baseline="central">→ 相对原子质量 ≈ 质子数 + 中子数</text>
  <rect x="470" y="312" width="400" height="118" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="670" y="334" font-size="13" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">类比 Analogy</text>
  <text x="670" y="356" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">如果原子是一座体育场，</text>
  <text x="670" y="376" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">原子核就是场中央的一颗弹珠，</text>
  <text x="670" y="396" font-size="11" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">电子则在整座体育场的看台上活动。</text>
  <text x="670" y="418" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">原子内部几乎全是空的 —— mostly empty space</text>
  <text x="450" y="452" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">证据：卢瑟福金箔实验中大部分 α 粒子直穿而过，说明原子内部几乎全是空的</text>
</svg>
