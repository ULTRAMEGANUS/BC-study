<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 9-3　磁贴配平示意｜Sticker Model for Balancing</title>
  <rect width="900" height="500" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 9-3　磁贴配平示意｜Sticker Model for Balancing</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 整簇整簇地复制，不能拆</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="450" y="62" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">每个方框 = 1 个原子；一「簇」方框 = 1 个分子</text>
  <rect x="50" y="84" width="800" height="98" rx="8" fill="#E6F1FB" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="66" y="102" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">① 骨架式（不配平）</text>
  <rect x="80" y="118" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="98" y="135" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="128" y="135" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <rect x="162" y="118" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="180" y="135" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="210" y="135" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <path d="M256 135 L290 135" fill="none" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="304" y="118" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="322" y="135" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="352" y="135" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="408" y="135" font-size="22" font-weight="700" fill="#A32D2D" text-anchor="start" dominant-baseline="central">✘</text>
  <text x="66" y="172" font-size="11" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">左：H = 2，O = 2　　右：H = 2，O = 1　← O 不平</text>
  <rect x="50" y="190" width="800" height="98" rx="8" fill="#FDECEC" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="66" y="208" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">② 只改下标 = 犯罪！（把 H₂O 写成 H₂O₂）</text>
  <rect x="80" y="224" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="98" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="128" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <rect x="162" y="224" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="180" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="210" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <path d="M256 241 L290 241" fill="none" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="304" y="224" width="102" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="322" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="352" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="382" y="241" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="438" y="241" font-size="22" font-weight="700" fill="#A32D2D" text-anchor="start" dominant-baseline="central">✘✘</text>
  <text x="66" y="278" font-size="11" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">H₂O₂ 是过氧化氢（双氧水），不是水！→ 你已经把反应偷偷换掉了</text>
  <rect x="50" y="296" width="800" height="98" rx="8" fill="#FAEEDA" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="66" y="314" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">③ 正确做法：复制整簇磁贴（加系数 2）</text>
  <rect x="80" y="330" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="98" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="128" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <rect x="162" y="330" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="180" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="210" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <path d="M256 347 L290 347" fill="none" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="304" y="330" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="322" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="352" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <rect x="386" y="330" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="404" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="434" y="347" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="490" y="347" font-size="22" font-weight="700" fill="#854F0B" text-anchor="start" dominant-baseline="central">△</text>
  <text x="66" y="384" font-size="11" font-weight="600" fill="#854F0B" text-anchor="start" dominant-baseline="central">左：H = 2，O = 2　　右：H = 4，O = 2　← O 平了，H 又不平</text>
  <rect x="50" y="402" width="800" height="98" rx="8" fill="#EAF3DE" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="66" y="420" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">④ 左边也复制一份 H₂（系数 2）</text>
  <rect x="80" y="436" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="98" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="128" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <rect x="162" y="436" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="180" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="210" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <rect x="244" y="436" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="262" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="292" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <path d="M338 453 L372 453" fill="none" stroke="#2C2C2A" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="386" y="436" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="404" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="434" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <rect x="468" y="436" width="72" height="34" rx="5" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.4"/>
  <text x="486" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="516" y="453" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="572" y="453" font-size="22" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">✔</text>
  <text x="66" y="490" font-size="11" font-weight="600" fill="#3B6D11" text-anchor="start" dominant-baseline="central">左：H = 4，O = 2　　右：H = 4，O = 2　✔ 配平！</text>
</svg>
