<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 1-1　物质分类树状图｜Classification Tree</title>
  <rect width="900" height="402" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 1-1　物质分类树状图｜Classification Tree</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 先分纯净物/混合物，再往下细分</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="300" y="62" width="300" height="58" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
  <text x="450" y="82" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">MATTER 物质</text>
  <text x="450" y="102" font-size="10" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(has mass &amp; takes up space) 有质量、占空间</text>
  <path d="M450 120 L450 150" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M230 150 L670 150" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M230 150 L230 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M670 150 L670 172" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="80" y="176" width="300" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="230" y="196" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">PURE SUBSTANCE 纯净物</text>
  <text x="230" y="216" font-size="10" fill="#185FA5" text-anchor="middle" dominant-baseline="central">(fixed composition) 组成固定</text>
  <rect x="520" y="176" width="300" height="62" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.2"/>
  <text x="670" y="196" font-size="14" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">MIXTURE 混合物</text>
  <text x="670" y="216" font-size="10" fill="#BA7517" text-anchor="middle" dominant-baseline="central">(variable composition) 组成可变</text>
  <path d="M230 238 L230 262" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M120 262 L340 262" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M120 262 L120 286" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M340 262 L340 286" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M670 238 L670 262" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M560 262 L780 262" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M560 262 L560 286" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M780 262 L780 286" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="20" y="290" width="200" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
  <text x="120" y="308" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">ELEMENT</text>
  <text x="120" y="327" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">元素</text>
  <text x="120" y="345" font-size="8.8" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1 种原子 only 1 kind of atom</text>
  <text x="120" y="361" font-size="9.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">O₂　Fe　Cu</text>
  <rect x="240" y="290" width="200" height="84" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
  <text x="340" y="308" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">COMPOUND</text>
  <text x="340" y="327" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">化合物</text>
  <text x="340" y="345" font-size="8.8" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2 种以上元素 2+ elements</text>
  <text x="340" y="361" font-size="9.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">H₂O　NaCl</text>
  <rect x="460" y="290" width="200" height="84" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="560" y="308" font-size="12.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">HOMOGENEOUS</text>
  <text x="560" y="327" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">均一混合物</text>
  <text x="560" y="345" font-size="8.8" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">看不出界面，整体均匀 uniform</text>
  <text x="560" y="361" font-size="9.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">盐水　空气　溶液</text>
  <rect x="680" y="290" width="200" height="84" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="780" y="308" font-size="12.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">HETEROGENEOUS</text>
  <text x="780" y="327" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">非均一混合物</text>
  <text x="780" y="345" font-size="8.8" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">看得出分层或界面 visible parts</text>
  <text x="780" y="361" font-size="9.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">沙水　沙拉　泥浆水</text>
  <text x="450" y="392" font-size="9.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">判断顺序：先问「组成固不固定」，再问「看不看得出界面」</text>
</svg>
