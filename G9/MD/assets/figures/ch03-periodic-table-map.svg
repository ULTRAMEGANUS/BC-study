<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 3-1　把周期表当「地图」读｜Reading the Map</title>
  <rect width="900" height="366" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 3-1　把周期表当「地图」读｜Reading the Map</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 位置 =（周期, 族）</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="560" y="66" font-size="12.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">group 族（纵列 1 → 18）</text>
  <path d="M700 76 L860 76" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="870" y="76" font-size="10.5" fill="#185FA5" text-anchor="start" dominant-baseline="central">向右：族号增大</text>
  <rect x="242" y="92" width="566" height="30" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="284.375" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="353.125" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="421.875" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">13</text>
  <text x="490.625" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">14</text>
  <text x="559.375" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">15</text>
  <text x="628.125" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">16</text>
  <text x="696.875" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">17</text>
  <text x="765.625" y="107" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">18</text>
  <rect x="242" y="122" width="566" height="34" rx="0" fill="#FBFAF6" stroke="#F0EEE6" stroke-width="0.6"/>
  <text x="200" y="139.0" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">period 1</text>
  <text x="284.375" y="139.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H</text>
  <text x="765.625" y="139.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">He</text>
  <text x="200" y="173.0" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">period 2</text>
  <text x="284.375" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Li</text>
  <text x="353.125" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Be</text>
  <text x="421.875" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">B</text>
  <text x="490.625" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">C</text>
  <text x="559.375" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">N</text>
  <text x="628.125" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">O</text>
  <text x="696.875" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">F</text>
  <text x="765.625" y="173.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Ne</text>
  <rect x="242" y="190" width="566" height="34" rx="0" fill="#FBFAF6" stroke="#F0EEE6" stroke-width="0.6"/>
  <text x="200" y="207.0" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">period 3</text>
  <text x="284.375" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Na</text>
  <text x="353.125" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Mg</text>
  <text x="421.875" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Al</text>
  <text x="490.625" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Si</text>
  <text x="559.375" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">P</text>
  <text x="628.125" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">S</text>
  <text x="696.875" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Cl</text>
  <text x="765.625" y="207.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Ar</text>
  <text x="200" y="241.0" font-size="11.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">period 4</text>
  <text x="284.375" y="241.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">K</text>
  <text x="353.125" y="241.0" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Ca</text>
  <text x="401.25" y="241.0" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">…（13–18 族为 31–36 号）</text>
  <rect x="242" y="122" width="566" height="136" rx="6" fill="none" stroke="#888780" stroke-width="1.2"/>
  <path d="M170 258 L170 292" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="178" y="300" font-size="10.5" fill="#185FA5" text-anchor="start" dominant-baseline="central">向下：周期数增大（电子层数增加）</text>
  <rect x="40" y="316" width="820" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="450" y="333" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">坐标读法 Position =（period, group）　　例：(3, 17) → Cl 氯　　(2, 14) → C 碳　　Na → (3, 1)</text>
</svg>
