<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 392" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 2-4　为什么改按原子序数排序｜Mass Order vs Number Order</title>
  <rect width="900" height="392" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 2-4　为什么改按原子序数排序｜Mass Order vs Number Order</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 位置由质子数决定，不由重量决定</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="60" y="60" width="360" height="30" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="240" y="75" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">按 atomic mass 排（Mendeleev）</text>
  <rect x="480" y="60" width="360" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
  <text x="660" y="75" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">按 atomic number 排（Moseley，现代）</text>
  <path d="M450 96 L450 300" fill="none" stroke="#B4B2A9" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="90" y="106" width="140" height="38" rx="6" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.0"/>
  <text x="160" y="125" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Ar  39.95</text>
  <rect x="90" y="156" width="140" height="38" rx="6" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.0"/>
  <text x="160" y="175" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">K  39.10</text>
  <path d="M258 114 C280 124 280 168 258 186" fill="none" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="300" y="125" font-size="12" font-weight="700" fill="#A32D2D" text-anchor="start" dominant-baseline="central">质量倒挂 ✗</text>
  <text x="300" y="146" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">重的 Ar 反而排在前面</text>
  <text x="300" y="168" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">与 K 的性质完全对不上</text>
  <rect x="510" y="106" width="150" height="38" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.0"/>
  <text x="585" y="125" font-size="13" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Z=Ar  18</text>
  <text x="700" y="125" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">✓ 惰性气体，与 Ne、Kr 同列</text>
  <rect x="510" y="156" width="150" height="38" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.0"/>
  <text x="585" y="175" font-size="13" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Z=K  19</text>
  <text x="700" y="175" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">✓ 活泼碱金属，与 Na 同列</text>
  <rect x="90" y="216" width="140" height="38" rx="6" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.0"/>
  <text x="160" y="235" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Te  127.60</text>
  <rect x="90" y="266" width="140" height="38" rx="6" fill="#FFFFFF" stroke="#BA7517" stroke-width="1.0"/>
  <text x="160" y="285" font-size="13" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">I  126.90</text>
  <path d="M258 224 C280 234 280 278 258 296" fill="none" stroke="#A32D2D" stroke-width="1.4"/>
  <text x="300" y="235" font-size="12" font-weight="700" fill="#A32D2D" text-anchor="start" dominant-baseline="central">质量倒挂 ✗</text>
  <text x="300" y="256" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">重的 Te 反而排在前面</text>
  <text x="300" y="278" font-size="11" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">与 I 的性质完全对不上</text>
  <rect x="510" y="216" width="150" height="38" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.0"/>
  <text x="585" y="235" font-size="13" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Z=Te  52</text>
  <text x="700" y="235" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">✓ 与 O、S、Se 同列</text>
  <rect x="510" y="266" width="150" height="38" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.0"/>
  <text x="585" y="285" font-size="13" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Z=I  53</text>
  <text x="700" y="285" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">✓ 与 F、Cl、Br 同列</text>
  <rect x="60" y="328" width="780" height="46" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.0"/>
  <text x="450" y="344" font-size="13" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">X 射线光谱给出的是「核电荷数」＝ 质子数</text>
  <text x="450" y="362" font-size="11.5" fill="#0C447C" text-anchor="middle" dominant-baseline="central">⇒ 位置由质子数决定，不由重量决定　⇒ 周期表本质是一张按电子结构排列的表</text>
</svg>
