<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 276" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 7-9　括号使用对照｜To Bracket or Not</title>
  <rect width="900" height="276" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 7-9　括号使用对照｜To Bracket or Not</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 个数 > 1 才加括号</text>
  <rect x="60" y="76" width="150" height="30" rx="5" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.9"/>
  <text x="135" y="91" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">✗  MgOH₂</text>
  <text x="232" y="91" font-size="14" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <rect x="252" y="76" width="190" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.9"/>
  <text x="347" y="91" font-size="13.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓  Mg(OH)₂</text>
  <text x="460" y="91" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">氢氧化镁 magnesium hydroxide</text>
  <rect x="60" y="112" width="150" height="30" rx="5" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.9"/>
  <text x="135" y="127" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">✗  AlSO₄₃</text>
  <text x="232" y="127" font-size="14" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <rect x="252" y="112" width="190" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.9"/>
  <text x="347" y="127" font-size="13.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓  Al₂(SO₄)₃</text>
  <text x="460" y="127" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">硫酸铝　aluminium sulfate</text>
  <rect x="60" y="148" width="150" height="30" rx="5" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.9"/>
  <text x="135" y="163" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">✗  CaPO₄₂</text>
  <text x="232" y="163" font-size="14" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <rect x="252" y="148" width="190" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.9"/>
  <text x="347" y="163" font-size="13.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓  Ca₃(PO₄)₂</text>
  <text x="460" y="163" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">磷酸钙　calcium phosphate</text>
  <rect x="60" y="184" width="150" height="30" rx="5" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.9"/>
  <text x="135" y="199" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">✗  NH₄₂SO₄</text>
  <text x="232" y="199" font-size="14" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <rect x="252" y="184" width="190" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.9"/>
  <text x="347" y="199" font-size="13.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓  (NH₄)₂SO₄</text>
  <text x="460" y="199" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">硫酸铵　ammonium sulfate</text>
  <rect x="60" y="220" width="150" height="30" rx="5" fill="#FDECEC" stroke="#A32D2D" stroke-width="0.9"/>
  <text x="135" y="235" font-size="13" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">✗  NaOH₂</text>
  <text x="232" y="235" font-size="14" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">→</text>
  <rect x="252" y="220" width="190" height="30" rx="5" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.9"/>
  <text x="347" y="235" font-size="13.5" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✓  NaOH</text>
  <text x="460" y="235" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">氢氧化钠（OH 只有 1 个 → 不要括号、不要下标）</text>
  <rect x="60" y="262" width="780" height="0" rx="8" fill="none" stroke="none" stroke-width="0"/>
</svg>
