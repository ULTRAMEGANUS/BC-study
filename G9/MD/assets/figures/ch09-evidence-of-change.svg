<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 9-1　化学变化证据盘｜Evidence of Chemical Change</title>
  <rect width="900" height="350" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 9-1　化学变化证据盘｜Evidence of Chemical Change</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 六种证据都是线索，不是结论</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="310" y="62" width="280" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.3"/>
  <text x="450" y="78" font-size="13.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">IS IT A CHEMICAL CHANGE?</text>
  <text x="450" y="98" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">是化学变化吗？</text>
  <path d="M450 108 L450 132" fill="none" stroke="#888780" stroke-width="1.6"/>
  <path d="M130 132 L770 132" fill="none" stroke="#888780" stroke-width="1.6"/>
  <path d="M130 132 L130 152" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="60" y="156" width="140" height="60" rx="8" fill="#E6F1FB" stroke="#0C447C" stroke-width="1.1"/>
  <text x="130" y="178" font-size="12" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">colour change</text>
  <text x="130" y="200" font-size="12.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">变色</text>
  <path d="M290 132 L290 152" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="220" y="156" width="140" height="60" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.1"/>
  <text x="290" y="178" font-size="12" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">gas / bubbles</text>
  <text x="290" y="200" font-size="12.5" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">生成气体</text>
  <path d="M450 132 L450 152" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="380" y="156" width="140" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="450" y="178" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">precipitate</text>
  <text x="450" y="200" font-size="12.5" font-weight="600" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">生成沉淀</text>
  <path d="M610 132 L610 152" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="540" y="156" width="140" height="60" rx="8" fill="#FDECEC" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="610" y="178" font-size="12" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">temperature</text>
  <text x="610" y="200" font-size="12.5" font-weight="600" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">温度变化</text>
  <path d="M770 132 L770 152" fill="none" stroke="#888780" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="700" y="156" width="140" height="60" rx="8" fill="#F3EEFA" stroke="#5B4B8A" stroke-width="1.1"/>
  <text x="770" y="178" font-size="12" font-weight="700" fill="#5B4B8A" text-anchor="middle" dominant-baseline="central">light / odour</text>
  <text x="770" y="200" font-size="12.5" font-weight="600" fill="#5B4B8A" text-anchor="middle" dominant-baseline="central">发光 / 新气味</text>
  <path d="M130 216 L770 216" fill="none" stroke="#888780" stroke-width="1.4"/>
  <path d="M450 216 L450 236" fill="none" stroke="#888780" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="120" y="240" width="660" height="96" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.3"/>
  <text x="450" y="264" font-size="13" font-weight="700" fill="#854F0B" text-anchor="middle" dominant-baseline="central">⚠ 单一证据不充分！必须问：有没有 NEW SUBSTANCE 新物质生成？</text>
  <text x="450" y="292" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">有新物质 → CHEMICAL CHANGE 化学变化</text>
  <text x="450" y="316" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">无新物质 → PHYSICAL CHANGE 物理变化</text>
</svg>
