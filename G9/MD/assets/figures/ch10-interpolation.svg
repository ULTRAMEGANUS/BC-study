<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 10-5　内插与外推｜Interpolation vs Extrapolation</title>
  <rect width="900" height="424" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 10-5　内插与外推｜Interpolation vs Extrapolation</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 结论的取值范围 = 你的取值范围</text>
  <rect x="120" y="74" width="620" height="190" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.0"/>
  <path d="M164 86 L164 238" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <path d="M164 238 L726 238" fill="none" stroke="#2C2C2A" stroke-width="1.6"/>
  <circle cx="266.1818181818182" cy="118.96000000000001" r="4.4" fill="#0C447C"/>
  <circle cx="368.3636363636364" cy="159.28" r="4.4" fill="#0C447C"/>
  <circle cx="470.5454545454545" cy="186.16" r="4.4" fill="#0C447C"/>
  <rect x="260.1818181818182" y="86" width="216.36363636363632" height="152" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.9"/>
  <path d="M235.5 103.6 L531.9 203.4" fill="none" stroke="#BA7517" stroke-width="1.8" stroke-dasharray="5 3"/>
  <path d="M531.9 203.4 L695.3 264.9" fill="none" stroke="#A32D2D" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="317.27272727272725" y="100" font-size="10.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">实测范围 20–60 ℃</text>
  <text x="138" y="169.0" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Time (s)</text>
  <text x="430.0" y="276" font-size="11" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Temperature (℃)</text>
  <rect x="70" y="288" width="380" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.1"/>
  <text x="260" y="308" font-size="12" font-weight="700" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">INTERPOLATION 内插（数据点之间）</text>
  <text x="260" y="330" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">✅ 可信：估计 30 ℃ 的值 → 约 50 s</text>
  <rect x="470" y="288" width="360" height="60" rx="8" fill="#FDECEC" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="650" y="308" font-size="12" font-weight="700" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">EXTRAPOLATION 外推 ⚠ 危险</text>
  <text x="650" y="330" font-size="11" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">延长到 100 ℃ 会得到负的溶解时间（物理上荒谬）</text>
  <rect x="70" y="358" width="760" height="56" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="90" y="376" font-size="11.5" font-weight="600" fill="#A32D2D" text-anchor="start" dominant-baseline="central">❌ 过度外推：「由此可知所有固体在所有温度下都溶解得更快」</text>
  <text x="90" y="398" font-size="11" font-weight="600" fill="#3B6D11" text-anchor="start" dominant-baseline="central">✅ 正确结论：「在 20–60 ℃ 范围内，对 5 g 蔗糖 / 100 mL 水这一条件，水温越高，溶解所需时间越短。」</text>
</svg>
