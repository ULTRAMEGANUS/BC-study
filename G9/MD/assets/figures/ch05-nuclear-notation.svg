<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>标准核素记号｜Standard Nuclear Notation</title>
  <rect width="900" height="348" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">标准核素记号｜Standard Nuclear Notation</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 左上 A、左下 Z、中间符号</text>
  <rect x="65" y="62" width="350" height="30" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="240" y="77" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">标准写法 Standard notation</text>
  <text x="240" y="176" font-size="44" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">X</text>
  <text x="200" y="138" font-size="20" font-weight="700" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">ᴬ</text>
  <text x="200" y="214" font-size="20" font-weight="700" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">Z</text>
  <path d="M264 138 L292 138" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="300" y="138" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">质量数 A</text>
  <path d="M264 176 L292 176" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="300" y="176" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">元素符号 symbol</text>
  <path d="M264 214 L292 214" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="300" y="214" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">原子序数 Z</text>
  <rect x="485" y="62" width="350" height="30" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="660" y="77" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">实例 Example（钠）</text>
  <text x="660" y="176" font-size="44" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Na</text>
  <text x="620" y="138" font-size="20" font-weight="700" fill="#0C447C" text-anchor="end" dominant-baseline="central">²³</text>
  <text x="620" y="214" font-size="20" font-weight="700" fill="#0C447C" text-anchor="end" dominant-baseline="central">₁₁</text>
  <path d="M684 138 L712 138" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="720" y="138" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">A = 23</text>
  <path d="M684 176 L712 176" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="720" y="176" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">sodium 钠</text>
  <path d="M684 214 L712 214" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="720" y="214" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Z = 11</text>
  <path d="M450 100 L450 236" fill="none" stroke="#B4B2A9" stroke-width="1.0" stroke-dasharray="4 4"/>
  <rect x="60" y="250" width="780" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
  <text x="450" y="265" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="central">横排写法 In-line：²³₁₁Na　　读作「Na-23」/「sodium-23」/ 中文「钠-23」</text>
  <text x="450" y="296" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">三量求解 Three quantities：</text>
  <text x="450" y="316" font-size="11.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">protons 质子数 = Z = 11　　electrons 电子数 = Z（中性原子）= 11</text>
  <text x="450" y="334" font-size="11.5" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">neutrons 中子数 = A − Z = 23 − 11 = 12</text>
</svg>
