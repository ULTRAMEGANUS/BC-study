  <path d="M772.5 66 L772.5 88" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="25" y="92" width="205" height="152" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1.0"/>
