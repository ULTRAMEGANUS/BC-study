  <title>图 1-2　原子模型演化时间轴｜Atomic Model Timeline</title>
  <rect width="900" height="486" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 1-2　原子模型演化时间轴｜Atomic Model Timeline</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 模型随新证据不断修正</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <path d="M60 62 L840 62" fill="none" stroke="#888780" stroke-width="1.2"/>
