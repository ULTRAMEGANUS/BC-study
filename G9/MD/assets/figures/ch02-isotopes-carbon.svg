  <text x="616" y="190" font-size="11" font-weight="700" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">n⁰</text>
  <circle cx="646" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="668" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="690" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="712" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
