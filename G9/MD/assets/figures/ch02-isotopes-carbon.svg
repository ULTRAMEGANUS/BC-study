  <circle cx="192" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="214" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="74" y="224" font-size="10" fill="#185FA5" text-anchor="start" dominant-baseline="central">6 个质子</text>
  <text x="288" y="224" font-size="10" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">6 个中子</text>
  <text x="181.0" y="254" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6p + 6n = 12</text>
  <text x="181.0" y="274" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">约占 98.9%</text>
  <text x="181.0" y="292" font-size="10" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">稳定 stable</text>
  <text x="452.0" y="116" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">碳-13  C-13</text>
