  <circle cx="104" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="126" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
