  <title>图 2-3　同位素：质子同、中子不同｜Isotopes</title>
  <rect width="900" height="404" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 2-3　同位素：质子同、中子不同｜Isotopes</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 黑点一样多 ⇒ 都是碳</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="40" y="58" width="820" height="26" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="450" y="71" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">同一种元素 ⇒ 质子数必须相同 SAME　　同位素 ⇒ 中子数可以不同 DIFFERENT</text>
  <text x="181.0" y="116" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">碳-12  C-12</text>
  <rect x="62" y="128" width="238" height="108" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.0"/>
  <text x="74" y="152" font-size="11" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">p⁺</text>
  <circle cx="104" cy="152" r="7.5" fill="#0C447C"/>
  <circle cx="126" cy="152" r="7.5" fill="#0C447C"/>
  <circle cx="148" cy="152" r="7.5" fill="#0C447C"/>
  <circle cx="170" cy="152" r="7.5" fill="#0C447C"/>
  <circle cx="192" cy="152" r="7.5" fill="#0C447C"/>
  <circle cx="214" cy="152" r="7.5" fill="#0C447C"/>
