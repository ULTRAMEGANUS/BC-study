  <circle cx="441" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="463" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="485" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <circle cx="507" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="345" y="224" font-size="10" fill="#185FA5" text-anchor="start" dominant-baseline="central">6 个质子</text>
  <text x="559" y="224" font-size="10" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">7 个中子</text>
  <text x="452.0" y="254" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6p + 7n = 13</text>
  <text x="452.0" y="274" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">约占 1.1%</text>
  <text x="452.0" y="292" font-size="10" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">稳定 stable</text>
  <text x="723.0" y="116" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">碳-14  C-14</text>
  <rect x="604" y="128" width="238" height="108" rx="6" fill="#FFFFFF" stroke="#888780" stroke-width="1.0"/>
  <text x="616" y="152" font-size="11" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">p⁺</text>
