  <circle cx="800" cy="190" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="616" y="224" font-size="10" fill="#185FA5" text-anchor="start" dominant-baseline="central">6 个质子</text>
  <text x="830" y="224" font-size="10" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">8 个中子</text>
  <text x="723.0" y="254" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">6p + 8n = 14</text>
  <text x="723.0" y="274" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">痕量 trace</text>
  <text x="723.0" y="292" font-size="10" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">放射性 radioactive</text>
  <circle cx="70" cy="320" r="7.5" fill="#0C447C"/>
  <text x="86" y="320" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">proton 质子</text>
  <circle cx="210" cy="320" r="7.5" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.4"/>
  <text x="226" y="320" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">neutron 中子</text>
  <text x="370" y="320" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">三者都是碳（都是 6 个质子），只是中子数不同</text>
  <rect x="40" y="340" width="820" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.0"/>
  <text x="60" y="358" font-size="12.5" font-weight="600" fill="#854F0B" text-anchor="start" dominant-baseline="central">氯的天然样品 ≈ 75% Cl-35 + 25% Cl-37</text>
  <text x="60" y="378" font-size="11.5" fill="#854F0B" text-anchor="start" dominant-baseline="central">⇒ 平均值落在 35 与 37 之间、且偏向含量多的 35　⇒ 周期表上 Cl = 35.45（小数！）</text>
