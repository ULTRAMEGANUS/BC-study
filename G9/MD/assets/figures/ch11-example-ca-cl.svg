  <circle cx="588" cy="195.0" r="6.5" fill="#0C447C"/>
  <text x="792" y="195.0" font-size="13.5" font-weight="700" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">2</text>
  <rect x="613.0" y="230" width="124" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1.1"/>
  <text x="675.0" y="245" font-size="12.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">17 p⁺</text>
  <text x="675.0" y="262" font-size="12.5" font-weight="700" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">18 n⁰</text>
  <text x="749.0" y="253" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">原子核 nucleus</text>
  <text x="70" y="332" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 1–2　Ca 原子序数 20 → 20 p⁺，20 e⁻；Cl 原子序数 17 → 17 p⁺，17 e⁻</text>
  <text x="70" y="352" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 4　Ca 价电子少 → 失去 2 个 → Ca²⁺（cation）　Cl 价电子 7 → 得到 1 个 → Cl⁻（anion）</text>
  <text x="70" y="372" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 5　交叉法：1 个 Ca²⁺(+2) 需 2 个 Cl⁻(−1×2 = −2)　→　化学式 = CaCl₂（下标 1 不写）</text>
  <text x="70" y="392" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 6　金属 Ca + 非金属 Cl → IONIC　英文 calcium chloride（不加前缀）　中文 氯化钙</text>
  <text x="70" y="412" font-size="11.5" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">STEP 7　白色晶体；熔点高（约 772 ℃）；硬而脆；易溶于水；固体不导电，溶于水或熔融时导电</text>
