  <text x="671.0" y="70" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Cl  氯  Z = 17</text>
  <text x="671.0" y="89" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">电子排布 = 2, 8, 7　　(A = 35)</text>
  <rect x="548" y="110" width="254" height="34" rx="4" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.1"/>
  <text x="540" y="127.0" font-size="10.5" font-weight="600" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">第3层 (M)</text>
