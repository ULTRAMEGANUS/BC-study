<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 770" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>交叉法｜Criss-cross Method for Ionic Formulas</title>
  <rect width="900" height="770" fill="#FFFFFF"/>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="19" font-weight="600" fill="#2C2C2A">交叉法｜Criss-cross Method</text>
  <text x="870" y="30" font-size="10.5" fill="#5F5E5A" text-anchor="end">写离子化合物化学式的标准动作</text>
  <text x="30" y="50" font-size="11.5" fill="#A32D2D">前提：化合物总电荷必须为零。The overall charge of an ionic compound must be zero.</text>

  <g font-size="10.5">
    <rect x="30" y="66" width="156" height="46" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
    <text x="108" y="82" font-size="11.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">① 写离子符号</text>
    <text x="108" y="99" font-size="9.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">cation 在前，anion 在后</text>

    <rect x="201" y="66" width="156" height="46" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
    <text x="279" y="82" font-size="11.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">② 标出电荷</text>
    <text x="279" y="99" font-size="9.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">由族号推出</text>

    <rect x="372" y="66" width="156" height="46" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
    <text x="450" y="82" font-size="11.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">③ 交叉成下标</text>
    <text x="450" y="99" font-size="9.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">电荷数变成对方的下标</text>

    <rect x="543" y="66" width="156" height="46" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
    <text x="621" y="82" font-size="11.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">④ 约成最简比</text>
    <text x="621" y="99" font-size="9.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">下标 1 省略不写</text>

    <rect x="714" y="66" width="156" height="46" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.9"/>
    <text x="792" y="82" font-size="11.5" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">⑤ 验算总电荷</text>
    <text x="792" y="99" font-size="9.5" fill="#185FA5" text-anchor="middle" dominant-baseline="central">加起来必须等于 0</text>
  </g>

  <rect x="30" y="134" width="270" height="212" rx="9" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="165" y="156" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle">例 1　Mg + F</text>
  <g font-size="15">
    <text x="82" y="192" fill="#185FA5" text-anchor="middle">Mg²⁺</text>
    <text x="248" y="192" fill="#A32D2D" text-anchor="middle">F⁻</text>
  </g>
  <path d="M96 202 L232 244" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M234 202 L100 244" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="165" y="228" font-size="9.5" fill="#888780" text-anchor="middle">交叉</text>
  <g font-size="14">
    <text x="82" y="264" fill="#185FA5" text-anchor="middle">Mg</text><tspan font-size="9" dy="4">1</tspan>
  </g>
  <g font-size="14">
    <text x="248" y="264" fill="#A32D2D" text-anchor="middle">F</text><tspan font-size="9" dy="4">2</tspan>
  </g>
  <path d="M165 282 L165 296" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="165" y="318" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">MgF₂</text>
  <text x="165" y="337" font-size="11" fill="#185FA5" text-anchor="middle">magnesium fluoride</text>
  <text x="165" y="354" font-size="11.5" font-weight="600" fill="#A32D2D" text-anchor="middle">氟化镁</text>

  <rect x="315" y="134" width="270" height="212" rx="9" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="450" y="156" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle">例 2　Al + O</text>
  <g font-size="15">
    <text x="367" y="192" fill="#185FA5" text-anchor="middle">Al³⁺</text>
    <text x="533" y="192" fill="#A32D2D" text-anchor="middle">O²⁻</text>
  </g>
  <path d="M381 202 L517 244" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M519 202 L385 244" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="450" y="228" font-size="9.5" fill="#888780" text-anchor="middle">交叉</text>
  <g font-size="14">
    <text x="367" y="264" fill="#185FA5" text-anchor="middle">Al</text><tspan font-size="9" dy="4">2</tspan>
  </g>
  <g font-size="14">
    <text x="533" y="264" fill="#A32D2D" text-anchor="middle">O</text><tspan font-size="9" dy="4">3</tspan>
  </g>
  <path d="M450 282 L450 296" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="450" y="318" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">Al₂O₃</text>
  <text x="450" y="337" font-size="11" fill="#185FA5" text-anchor="middle">aluminium oxide</text>
  <text x="450" y="354" font-size="11.5" font-weight="600" fill="#A32D2D" text-anchor="middle">氧化铝</text>

  <rect x="600" y="134" width="270" height="212" rx="9" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="735" y="156" font-size="12" font-weight="600" fill="#0C447C" text-anchor="middle">例 3　Na + S</text>
  <g font-size="15">
    <text x="652" y="192" fill="#185FA5" text-anchor="middle">Na⁺</text>
    <text x="818" y="192" fill="#A32D2D" text-anchor="middle">S²⁻</text>
  </g>
  <path d="M666 202 L802 244" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <path d="M804 202 L670 244" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="735" y="228" font-size="9.5" fill="#888780" text-anchor="middle">交叉</text>
  <g font-size="14">
    <text x="652" y="264" fill="#185FA5" text-anchor="middle">Na</text><tspan font-size="9" dy="4">2</tspan>
  </g>
  <g font-size="14">
    <text x="818" y="264" fill="#A32D2D" text-anchor="middle">S</text><tspan font-size="9" dy="4">1</tspan>
  </g>
  <path d="M735 282 L735 296" fill="none" stroke="#888780" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="735" y="318" font-size="20" font-weight="600" fill="#2C2C2A" text-anchor="middle">Na₂S</text>
  <text x="735" y="337" font-size="11" fill="#185FA5" text-anchor="middle">sodium sulfide</text>
  <text x="735" y="354" font-size="11.5" font-weight="600" fill="#A32D2D" text-anchor="middle">硫化钠</text>

  <rect x="30" y="366" width="410" height="152" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.1"/>
  <text x="48" y="390" font-size="12.5" font-weight="600" fill="#A32D2D">最常错的一步：忘了约成最简比</text>
  <text x="48" y="412" font-size="11" fill="#2C2C2A">Mg²⁺ + O²⁻　交叉后得到　Mg₂O₂</text>
  <path d="M48 424 L170 424" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="180" y="424" font-size="11" font-weight="600" fill="#A32D2D">必须约成 MgO</text>
  <text x="48" y="450" font-size="10.5" fill="#5F5E5A">化学式表示的是离子的最简个数比，不是交叉时算出的那对数。</text>
  <text x="48" y="468" font-size="10.5" fill="#5F5E5A">同理：Ca²⁺ + S²⁻ → CaS（不是 Ca₂S₂）；Na⁺ + Cl⁻ → NaCl（不是 Na₁Cl₁）。</text>
  <text x="48" y="490" font-size="10.5" fill="#A32D2D">下标为 1 时一律省略不写。</text>
  <text x="48" y="508" font-size="10" fill="#888780">对照：分子化合物不约简 —— H₂O₂ 就是 H₂O₂，不能写成 HO。</text>

  <rect x="460" y="366" width="410" height="152" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.1"/>
  <text x="478" y="390" font-size="12.5" font-weight="600" fill="#085041">多原子离子超过 1 个 → 必须加括号</text>
  <text x="478" y="412" font-size="11" fill="#2C2C2A">Ca²⁺ + NO₃⁻　→　Ca(NO₃)₂</text>
  <text x="478" y="434" font-size="10.5" fill="#5F5E5A">括号表示「整个硝酸根离子有 2 个」，下标 2 作用于括号内全部原子。</text>
  <text x="478" y="452" font-size="10.5" fill="#5F5E5A">原子总数：Ca 1 个、N 2 个、O 6 个。</text>
  <text x="478" y="476" font-size="11" font-weight="600" fill="#A32D2D">写成 CaNO₃₂ 是错的 ✗</text>
  <text x="478" y="496" font-size="10.5" fill="#2C2C2A">更多例子：(NH₄)₂SO₄ 硫酸铵　NaOH 氢氧化钠（1 个时不加括号）</text>
  <text x="478" y="512" font-size="10" fill="#888780">判断口诀：多原子离子 + 下标 &gt; 1 → 加括号。</text>

  <rect x="30" y="538" width="840" height="106" rx="9" fill="#F1EFE8" stroke="#888780" stroke-width="0.9"/>
  <text x="48" y="562" font-size="12.5" font-weight="600" fill="#2C2C2A">写完必做的三项检查｜Checklist</text>
  <text x="48" y="583" font-size="11" fill="#2C2C2A">1　总电荷是否为零？　例：Al₂O₃ → 2×(+3) + 3×(−2) = +6 − 6 = 0 ✔</text>
  <text x="48" y="603" font-size="11" fill="#2C2C2A">2　下标是否已约成最简比？　Mg₂O₂ 必须写成 MgO</text>
  <text x="48" y="623" font-size="11" fill="#2C2C2A">3　多原子离子的括号与下标是否配对？　Ca(NO₃)₂，不是 CaNO₃₂</text>
  <text x="48" y="641" font-size="10" fill="#888780">常见阳离子：Na⁺ K⁺ Ag⁺ ／ Mg²⁺ Ca²⁺ Zn²⁺ ／ Al³⁺ ／ NH₄⁺</text>

  <rect x="30" y="664" width="840" height="86" rx="9" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.9"/>
  <text x="48" y="688" font-size="12.5" font-weight="600" fill="#854F0B">英中命名对照｜Naming in two languages</text>
  <text x="48" y="710" font-size="11" fill="#2C2C2A">英文　metal + non-metal-ide　→　magnesium fluoride（正离子在前）</text>
  <text x="48" y="728" font-size="11" fill="#2C2C2A">中文　非金属 + 化 + 金属　→　氟化镁（负离子在前，-ide 译作「化」）</text>
  <text x="48" y="744" font-size="10" fill="#A32D2D">顺序是反的。写成「镁化氟」是错的 ✗</text>
</svg>
