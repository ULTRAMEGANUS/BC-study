<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900"
     font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
  <title>图 9-2　三级方程式阶梯｜From Words to a Balanced Equation</title>
  <rect width="900" height="420" fill="#FFFFFF"/>
  <text x="30" y="32" font-size="19" font-weight="600" fill="#2C2C2A">图 9-2　三级方程式阶梯｜From Words to a Balanced Equation</text>
  <text x="870" y="32" font-size="10.5" fill="#5F5E5A"
        text-anchor="end">BC Science 9 · 唯一能改的是系数</text>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L9 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="70" y="66" width="760" height="84" rx="8" fill="#E6F1FB" stroke="#0C447C" stroke-width="1.2"/>
  <text x="90" y="84" font-size="12.5" font-weight="700" fill="#0C447C" text-anchor="start" dominant-baseline="central">第 1 级　WORD EQUATION 文字方程式</text>
  <text x="450" y="108" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">hydrogen  +  oxygen  ──▶  water</text>
  <text x="450" y="130" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">氢气      +  氧气    ──▶   水</text>
  <text x="450" y="140" font-size="11" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">（只写名称，不涉及原子数）</text>
  <path d="M450 150 L450 166" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="470" y="158" font-size="11" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">把名称换成化学式（下标照抄，双原子分子别忘 ₂）</text>
  <rect x="70" y="194" width="760" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
  <text x="90" y="212" font-size="12.5" font-weight="700" fill="#854F0B" text-anchor="start" dominant-baseline="central">第 2 级　SKELETON EQUATION 骨架方程式</text>
  <text x="450" y="236" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">H₂  +  O₂  ──▶  H₂O</text>
  <text x="450" y="246" font-size="11" font-weight="600" fill="#854F0B" text-anchor="middle" dominant-baseline="central">⚠ 未配平：左 O = 2，右 O = 1　✘</text>
  <path d="M450 256 L450 272" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="470" y="264" font-size="11" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">只在化学式前面加系数（绝不改下标）</text>
  <rect x="70" y="300" width="760" height="62" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="90" y="318" font-size="12.5" font-weight="700" fill="#3B6D11" text-anchor="start" dominant-baseline="central">第 3 级　BALANCED EQUATION 配平方程式</text>
  <text x="450" y="342" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">2H₂  +  O₂  ──▶  2H₂O</text>
  <text x="450" y="352" font-size="11" font-weight="600" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">✔ 左：H = 4，O = 2　　右：H = 4，O = 2</text>
  <rect x="70" y="376" width="760" height="30" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.9"/>
  <text x="450" y="391" font-size="12" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">三级是递进关系：骨架式来自文字式，配平式来自骨架式</text>
</svg>
