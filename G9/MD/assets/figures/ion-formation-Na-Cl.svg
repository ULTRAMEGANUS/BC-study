<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1044" width="900" font-family="'Segoe UI','Microsoft YaHei','PingFang SC','Noto Sans CJK SC',Arial,sans-serif">
<title>离子键的形成：钠原子把 1 个电子转移给氯原子｜Ionic Bond Formation: Electron Transfer Na → Cl</title>
<rect width="900" height="1044" fill="#FFFFFF"/>
<text x="30" y="33" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="600">离子键的形成：钠 → 氯 的电子转移｜Ionic Bond: Electron Transfer Na → Cl</text>
<text x="870" y="33" font-size="10.5" fill="#5F5E5A" text-anchor="end">BC Science 9 · Ch.6–7 ｜ 英中对照</text>
<rect x="30" y="54" width="840" height="336" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
<text x="46" y="80" font-size="12" font-weight="600" fill="#185FA5">Step 1 · Before 反应前<tspan font-size="10.5" font-weight="400" fill="#5F5E5A" dx="6">—— 两个原子的最外层都未满 8，都不稳定</tspan></text>
<text x="175" y="106" font-size="13.5" fill="#0C447C" text-anchor="middle" font-weight="600">Na 钠原子 sodium atom</text>
<text x="175" y="121" font-size="9.5" fill="#888780" text-anchor="middle">metal 金属 · 第 1 族 · 最外层 1 个电子</text>
