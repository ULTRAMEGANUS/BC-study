<circle cx="291.0" cy="491.0" r="4.3" fill="#185FA5"/>
<text x="356" y="474" font-size="16" fill="#185FA5" text-anchor="start" font-weight="600">Na⁺</text>
<text x="250" y="632" font-size="10" fill="#3B6D11" text-anchor="middle" font-weight="600">2, 8　达到 8 电子稳定结构 ✓ full valence shell</text>
<text x="645" y="447" font-size="13" fill="#A32D2D" text-anchor="middle" font-weight="600">Cl⁻ 氯离子 chloride ion（anion 阴离子）</text>
<path d="M 561 452 L 547 452 L 547 612 L 561 612" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 729 612 L 743 612 L 743 452 L 729 452" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round"/>
