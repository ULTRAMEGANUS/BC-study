<text x="700" y="374" font-size="9.5" fill="#A32D2D" text-anchor="middle">最外层有 7 个 → 只差 1 个就满 8</text>
<path d="M 272 244 Q 440 130 614 248" fill="none" stroke="#A32D2D" stroke-width="2.4" stroke-linecap="round"/>
