<text x="175" y="357" font-size="11.5" fill="#2C2C2A" text-anchor="middle" font-weight="600">电子排布 2, 8, 1　　共 11 e⁻</text>
<text x="175" y="374" font-size="9.5" fill="#A32D2D" text-anchor="middle">最外层只有 1 个 → “丢掉”比“填满”更容易</text>
<text x="700" y="106" font-size="13.5" fill="#854F0B" text-anchor="middle" font-weight="600">Cl 氯原子 chlorine atom</text>
<text x="700" y="121" font-size="9.5" fill="#888780" text-anchor="middle">nonmetal 非金属 · 第 17 族 · 最外层 7 个电子</text>
