<text x="267" y="792" font-size="18" fill="#854F0B" text-anchor="middle" font-weight="600">Cl</text>
<circle cx="208" cy="762" r="3.6" fill="#854F0B"/>
<circle cx="208" cy="810" r="3.6" fill="#854F0B"/>
