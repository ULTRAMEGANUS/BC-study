<text x="175" y="248" font-size="9" fill="#2C2C2A" text-anchor="middle" font-weight="600">11 p⁺</text>
<text x="175" y="259" font-size="9" fill="#5F5E5A" text-anchor="middle">12 n⁰</text>
<circle cx="175.0" cy="284.0" r="4.3" fill="#185FA5"/>
