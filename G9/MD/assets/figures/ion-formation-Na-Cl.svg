<text x="437" y="168" font-size="11" fill="#A32D2D" text-anchor="middle" font-weight="600">1 个电子 e⁻ 转移给 Cl</text>
<rect x="30" y="404" width="840" height="244" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
<text x="46" y="430" font-size="12" font-weight="600" fill="#185FA5">Step 2 · After 反应后<tspan font-size="10.5" font-weight="400" fill="#5F5E5A" dx="6">—— 两个离子都达到 8 电子稳定结构（stable octet）</tspan></text>
<text x="250" y="447" font-size="13" fill="#185FA5" text-anchor="middle" font-weight="600">Na⁺ 钠离子 sodium ion（cation 阳离子）</text>
<path d="M 166 452 L 152 452 L 152 612 L 166 612" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 334 612 L 348 612 L 348 452 L 334 452" fill="none" stroke="#185FA5" stroke-width="1.6" stroke-linecap="round"/>
