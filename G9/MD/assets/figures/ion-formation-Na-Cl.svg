<text x="751" y="474" font-size="16" fill="#A32D2D" text-anchor="start" font-weight="600">Cl⁻</text>
<text x="645" y="632" font-size="10" fill="#3B6D11" text-anchor="middle" font-weight="600">2, 8, 8　达到 8 电子稳定结构 ✓ full valence shell</text>
<line x1="358" y1="532" x2="538" y2="532" stroke="#5F5E5A" stroke-width="1.4" stroke-dasharray="6 4"/>
<polygon points="538,532 528.0,536.0 528.0,528.0" fill="#5F5E5A"/>
<polygon points="358,532 368.0,528.0 368.0,536.0" fill="#5F5E5A"/>
<text x="448" y="508" font-size="11.5" fill="#2C2C2A" text-anchor="middle" font-weight="600">静电吸引</text>
<text x="448" y="522" font-size="9.5" fill="#5F5E5A" text-anchor="middle">electrostatic attraction</text>
<text x="448" y="556" font-size="11" fill="#2C2C2A" text-anchor="middle" font-weight="600">→ 形成离子键 ionic bond</text>
<text x="448" y="570" font-size="9" fill="#888780" text-anchor="middle">质子数不变：11 p⁺ / 17 p⁺</text>
<rect x="30" y="660" width="840" height="230" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.9"/>
<text x="46" y="686" font-size="12" font-weight="600" fill="#185FA5">Step 3 · Result 结果<tspan font-size="10.5" font-weight="400" fill="#5F5E5A" dx="6">—— 得到离子化合物氯化钠 NaCl（sodium chloride）</tspan></text>
<text x="215" y="714" font-size="11.5" fill="#5F5E5A" text-anchor="middle" font-weight="600">电子式 Lewis dot diagram</text>
<text x="120" y="792" font-size="20" fill="#185FA5" text-anchor="middle" font-weight="600">Na⁺</text>
<path d="M 203 722 L 190 722 L 190 838 L 203 838" fill="none" stroke="#5F5E5A" stroke-width="1.4" stroke-linecap="round"/>
