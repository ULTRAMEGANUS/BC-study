<circle cx="245" cy="744" r="3.6" fill="#854F0B"/>
<circle cx="289" cy="744" r="3.6" fill="#854F0B"/>
<circle cx="245" cy="828" r="3.6" fill="#854F0B"/>
<circle cx="289" cy="828" r="3.6" fill="#854F0B"/>
<text x="352" y="742" font-size="15" fill="#A32D2D" text-anchor="start" font-weight="600">⁻</text>
<text x="230" y="860" font-size="9.5" fill="#888780" text-anchor="middle">Na⁺ 周围 0 个点；Cl⁻ 周围 8 个点</text>
<text x="230" y="875" font-size="9.5" fill="#888780" text-anchor="middle">阳离子不画点（价电子已全部失去）</text>
<line x1="400" y1="702" x2="400" y2="872" stroke="#B4B2A9" stroke-width="0.9" stroke-dasharray="4 3"/>
<text x="414" y="714" font-size="9.5" fill="#888780" text-anchor="start">化学式 chemical formula</text>
<text x="414" y="742" font-size="24" fill="#2C2C2A" text-anchor="start" font-weight="600">NaCl</text>
<text x="414" y="768" font-size="13" fill="#2C2C2A" text-anchor="start">English：sodium chloride</text>
<text x="414" y="788" font-size="13.5" fill="#2C2C2A" text-anchor="start" font-weight="600">中文：氯化钠</text>
<rect x="412" y="800" width="442" height="82" rx="8" fill="#FCECEC" stroke="#A32D2D" stroke-width="1.1"/>
<path d="M 424 805 L 434 805 L 429 814 Z" fill="#A32D2D"/>
<line x1="427.5" y1="809" x2="427.5" y2="812.5" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="440" y="818" font-size="11.5" fill="#A32D2D" text-anchor="start" font-weight="600">命名顺序相反！中英不可直译</text>
<text x="424" y="836" font-size="10" fill="#2C2C2A" text-anchor="start">EN　metal + non-metal-ide：sodium + chloride（阳离子在前）</text>
<text x="424" y="852" font-size="10" fill="#2C2C2A" text-anchor="start">CN　非金属 + 化 + 金属：氯化钠（氯在前，钠在后）</text>
<text x="424" y="870" font-size="10" fill="#A32D2D" text-anchor="start" font-weight="600">× “钠化氯”是错的　× “sodium chlorine”也是错的</text>
<rect x="30" y="902" width="410" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="48" y="926" font-size="15" fill="#0C447C" text-anchor="start" font-weight="600">Na → Na⁺ + e⁻</text>
<text x="48" y="946" font-size="10.5" fill="#2C2C2A" text-anchor="start">钠失去 1 个电子 → 氧化 oxidation（Na⁺ = cation 阳离子）</text>
<rect x="460" y="902" width="410" height="56" rx="8" fill="#FCECEC" stroke="#A32D2D" stroke-width="1"/>
<text x="478" y="926" font-size="15" fill="#A32D2D" text-anchor="start" font-weight="600">Cl + e⁻ → Cl⁻</text>
<text x="478" y="946" font-size="10.5" fill="#2C2C2A" text-anchor="start">氯得到 1 个电子 → 还原 reduction（Cl⁻ = anion 阴离子）</text>
<rect x="30" y="966" width="840" height="48" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
<text x="48" y="988" font-size="12.5" fill="#3B6D11" text-anchor="start" font-weight="600">验算 Check：总电荷 = (+1) + (−1) = 0  ✓</text>
<text x="48" y="1007" font-size="10.5" fill="#2C2C2A" text-anchor="start">离子化合物总电荷必须为零（overall charge = zero）——电子不会凭空消失：失去的电子数 = 得到的电子数。</text>
</svg>