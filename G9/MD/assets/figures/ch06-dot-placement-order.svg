  <path d="M40 396 L860 396" fill="none" stroke="#B4B2A9" stroke-width="1.0"/>
  <text x="450" y="412" font-size="11.5" font-weight="700" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">点数核对 dot count</text>
  <text x="60" y="430" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">3 = 上1 + 左1 + 右1</text>
  <text x="350" y="430" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">4 = 上1 + 下1 + 左1 + 右1</text>
  <text x="640" y="430" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">5 = 上2 + 下1 + 左1 + 右1</text>
  <text x="60" y="448" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">6 = 上2 + 下2 + 左1 + 右1</text>
  <text x="350" y="448" font-size="10.5" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">7 = 上2 + 下2 + 左2 + 右1</text>
